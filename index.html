<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>MS Hang Prep — Mark 1:21–45</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700;800;900&family=Inter:wght@400;500;600;700;800;900&family=Raleway:wght@800;900&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#0D0D0D;
    --paper:#FFFFFF;
    --cream:#EAE6DF;

    /* Baseline: Golden Hour Horizon — the adult site's actual D-W-E-L-L
       flat colors, used directly as flat backgrounds and as the source
       family every accent below is mixed from. */
    --d-discover:     #e28a5c;
    --d-wordwork:     #d76b65;
    --d-expand:       #9e6488;
    --d-learn:        #5d587e;
    --d-live:         #2d324f;

    /* Accent palette — ONE confident teal as the single "positive/
       interactive" accent (success, correct, ready, highlighter), a
       matching gold for attention/pulse, and coral-red for errors —
       instead of six different muted/dusty hues that read as a random
       grab-bag next to each other. Punchier and more saturated than a
       "matched by mood" attempt, closer to the energy of the original
       lime, but genuinely complementary (teal vs. the warm orange-to-
       navy DWELL spread) instead of literally identical hue to the
       background it sits on. Names kept for low-risk reuse. */
    --lime:   #50af9b;  /* softer teal — success / correct / positive */
    --yellow: #efac39;  /* vivid gold  — attention / ready / pulse */
    --pink:   #dd554b;  /* vivid coral-red — error / incorrect */
    --purple: #8459cf;  /* vivid violet    — reference / kicker accents */
    --purple-light: #bfabe3;  /* soft lavender — the "God is..." trait word specifically */
    --blue:   #4299d7;  /* vivid sky blue  — highlighter: Characters */
    --green:  #30a68e;  /* same teal as --lime — highlighter: Setting */

    --bg-lime: var(--lime);
    --bg-purple: var(--purple);
    --bg-pink: var(--pink);
    --bg-dark: #181818;
    --bg-cream: #e8e3da;
    --bg-yellow: var(--yellow);

    --bg-discover:  var(--d-discover);
    --bg-wordwork:  var(--d-wordwork);
    --bg-expand:    var(--d-expand);
    --bg-learn:     var(--d-learn);
    --bg-live:      var(--d-live);

    --bg-terracotta: #c87760;
    --bg-orange: #d99762;
    --bg-leather: #643c23;
  }

  /* ── DEV MODE: Northern Depths theme ──
     Same family as the adult site's cool palette (discover #38b2a3,
     wordwork #1d788a, expand #295b87, learn #2d3766, live #141933),
     pushed brighter/higher-chroma to match this app's energy. Toggle
     with the dev pill button, top-left. */
  :root[data-theme="northern"] {
    --bg-discover:  #2dd7b2;
    --bg-wordwork:  #23bcdf;
    --bg-expand:    #4576ee;
    --bg-learn:     #5666e1;
    --bg-live:      #212a73;
    --bg-cream:     #e4eff3;
  }
  *{box-sizing:border-box;}
  
  html, body { 
    margin:0; 
    padding:0; 
    width:100%; 
    height:100%; 
    background:var(--ink); 
    font-family:'Plus Jakarta Sans', sans-serif; 
    -webkit-tap-highlight-color: transparent; 
    overscroll-behavior:none; 
    overflow:hidden;
  }

  .app-viewport {
    position: relative;
    z-index: 0;
    width: 100vw;
    height: 100vh;
    height: 100dvh;
    background: var(--bg-cream);
    display: flex;
    flex-direction: column;
    overflow: hidden;
    transition: background .4s ease;
    -webkit-user-select: none;
    user-select: none;
    -webkit-touch-callout: none;
  }
  /* INTRO SCREEN — soft blurred color blobs + a grain overlay instead of
     a flat fill, so the title screen has some depth/texture (reference:
     poster-style hero with blurred gradient blobs + film grain). Both
     pseudo-elements sit at negative z-index so they stay behind the
     .beat content (z-index 1/2) without needing to touch that stack. */
  .app-viewport.intro-glow::before{
    content:'';
    position:absolute;
    inset:-15%;
    background:
      radial-gradient(circle at 18% 22%, rgba(255,255,255,0.30) 0%, transparent 45%),
      radial-gradient(circle at 78% 15%, var(--d-wordwork) 0%, transparent 55%),
      radial-gradient(circle at 82% 78%, var(--d-expand) 0%, transparent 55%),
      radial-gradient(circle at 22% 82%, var(--d-live) 0%, transparent 50%),
      linear-gradient(155deg, var(--d-discover) 0%, var(--d-wordwork) 100%);
    filter: blur(60px) saturate(1.15);
    z-index: -2;
  }
  .app-viewport.intro-glow::after{
    content:'';
    position:absolute;
    inset:0;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='120' height='120'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>");
    opacity: 0.22;
    mix-blend-mode: overlay;
    z-index: -1;
    pointer-events: none;
  }
  /* QUEST SCREENS (testament/section) — same grain-over-blurred-blob
     treatment as the intro. Every color here is one of the 5 baseline
     D-W-E-L-L hues (never an invented one-off hex) so it reads as the
     same system as the intro/every other screen, just recombined.
     Each screen previews a different "next" baseline color so
     back-to-back Discover screens don't look identical. */
  .app-viewport.quest-glow::before{
    content:'';
    position:absolute;
    inset:-15%;
    background:
      radial-gradient(circle at 15% 85%, var(--d-expand) 0%, transparent 42%),
      radial-gradient(circle at 88% 30%, rgba(255,255,255,0.24) 0%, transparent 40%),
      linear-gradient(155deg, var(--d-discover) 0%, var(--d-wordwork) 100%);
    filter: blur(60px) saturate(1.15);
    z-index: -2;
  }
  .app-viewport.quest-glow.variant-b::before{
    background:
      radial-gradient(circle at 85% 82%, var(--d-learn) 0%, transparent 44%),
      radial-gradient(circle at 12% 20%, rgba(255,255,255,0.24) 0%, transparent 40%),
      linear-gradient(200deg, var(--d-discover) 0%, var(--d-expand) 100%);
  }
  .app-viewport.quest-glow::after{
    content:'';
    position:absolute;
    inset:0;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='120' height='120'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>");
    opacity: 0.20;
    mix-blend-mode: overlay;
    z-index: -1;
    pointer-events: none;
  }
  /* FINAL SCREEN — mirrors char-coaching's recipe in reverse (learn to
     live vs. live to learn) so the two "Learn"/"Live" screens visually
     bookend each other, instead of final having its own invented purple
     that shares no vocabulary with anything else in the app. --d-learn
     IS the app's purple (used nowhere near as saturated as an accent
     violet would be, but it's the real baseline purple), so "purple
     gradient" and "only baseline colors" aren't actually in tension. */
  .app-viewport.final-glow::before{
    content:'';
    position:absolute;
    inset:-15%;
    background:
      radial-gradient(circle at 20% 15%, rgba(255,255,255,0.22) 0%, transparent 45%),
      radial-gradient(circle at 82% 82%, var(--d-expand) 0%, transparent 46%),
      linear-gradient(155deg, var(--d-learn) 0%, var(--d-live) 100%);
    filter: blur(60px) saturate(1.15);
    z-index: -2;
  }
  .app-viewport.final-glow::after{
    content:'';
    position:absolute;
    inset:0;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='120' height='120'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>");
    opacity: 0.20;
    mix-blend-mode: overlay;
    z-index: -1;
    pointer-events: none;
  }
  /* EVERY OTHER SCREEN — same grain-over-blurred-blob mechanism, but
     generic: each beat's own background color is the base of the
     gradient (set as --glow-base/--glow-base2 inline per beat in JS),
     with two soft accent blooms layered on top. This is what makes a
     cream "Word Work" screen glow warm-cream, a navy "Learn" screen
     glow navy, etc. — the screen's existing identity color leads,
     instead of importing an unrelated accent hue. */
  .app-viewport.beat-glow::before{
    content:'';
    position:absolute;
    inset:-15%;
    background:
      radial-gradient(circle at var(--glow-p3, 50% 50%), var(--glow-a3, rgba(255,255,255,0)) 0%, transparent 40%),
      radial-gradient(circle at var(--glow-p1, 15% 85%), var(--glow-a1, rgba(255,255,255,0)) 0%, transparent 42%),
      radial-gradient(circle at var(--glow-p2, 88% 20%), var(--glow-a2, rgba(255,255,255,0.18)) 0%, transparent 40%),
      linear-gradient(155deg, var(--glow-base, var(--bg-cream)) 0%, var(--glow-base2, var(--bg-cream)) 100%);
    filter: blur(60px) saturate(1.12);
    z-index: -2;
  }
  .app-viewport.beat-glow::after{
    content:'';
    position:absolute;
    inset:0;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='120' height='120'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>");
    opacity: 0.18;
    mix-blend-mode: overlay;
    z-index: -1;
    pointer-events: none;
  }

  /* DEV-ONLY: palette tester — docked inline inside the dev notes panel,
     toggled via the "Color" text button next to "Close" */
  .palette-tester-wrap {
    position: absolute;
    bottom: clamp(78px, 13vh, 108px);
    right: clamp(14px, 3vw, 22px);
    z-index: 100;
    display: flex;
    flex-direction: column;
    align-items: flex-end;
  }
  .palette-tester-panel {
    display: none;
    background: #FFF;
    color: var(--ink);
    border: 3px solid var(--ink);
    border-radius: 18px;
    padding: 12px;
    margin-bottom: 10px;
    box-shadow: 5px 5px 0 var(--ink);
    width: 240px;
  }
  .palette-tester-wrap.open .palette-tester-panel { display: block; }
  /* Docked variant: lives inline inside the dev notes panel instead of
     floating bottom-right */
  .palette-tester-wrap.docked-panel {
    position: static;
    align-items: stretch;
    margin: 2px 0 0 0;
  }
  .palette-tester-wrap.docked-panel .palette-tester-panel {
    width: 100%;
    margin-bottom: 0;
  }

  .ptp-head {
    font-family: 'Space Grotesk', sans-serif;
    font-size: 11px;
    font-weight: 800;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    margin-bottom: 10px;
    padding-bottom: 8px;
    border-bottom: 1.5px solid rgba(0,0,0,0.1);
  }
  .ptp-list { display: flex; flex-direction: column; gap: 7px; }
  .ptp-card {
    display: flex;
    flex-direction: column;
    gap: 6px;
    padding: 9px 11px;
    background: #FBFBFB;
    border: 2px solid var(--ink);
    border-radius: 12px;
    cursor: pointer;
    text-align: left;
    font-family: inherit;
    transition: transform 0.12s ease;
  }
  .ptp-card:hover { transform: translate(-1px, -1px); }
  .ptp-card.active { background: var(--bg-yellow); box-shadow: 2px 2px 0 var(--ink); }
  .ptp-name {
    font-family: 'Space Grotesk', sans-serif;
    font-size: 12.5px;
    font-weight: 800;
  }
  .ptp-swatches { display: flex; gap: 4px; height: 14px; border-radius: 4px; overflow: hidden; }
  .ptp-swatches span { flex: 1; }


  /* FULLSCREEN CLICK ZONE (DESKTOP ONLY) — invisible hotspot, top-right corner.
     No visible mark; clicking/tapping this corner still toggles fullscreen. */
  .fs-toggle-btn {
    position: absolute;
    top: 0;
    right: 0;
    z-index: 100;
    width: 72px;
    height: 64px;
    background: transparent;
    border: none;
    cursor: pointer;
  }
  @media (max-width: 767px) {
    .fs-toggle-btn { display: none !important; }
  }

  /* ================= MINIMAL BORDERLESS CHEVRON NAVIGATION ================= */
  .persistent-nav-shell {
    position: absolute;
    left: 0;
    right: 0;
    bottom: clamp(14px, 2.5vh, 22px);
    z-index: 90;
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 0 clamp(16px, 4vw, 40px);
    pointer-events: none;
  }
  .minimal-arrow-btn {
    pointer-events: auto;
    background: none;
    border: none;
    padding: 10px 14px;
    color: var(--ink);
    font-size: clamp(22px, 3vh, 28px);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    opacity: 0.55;
    transition: opacity 0.2s ease, transform 0.2s ease, color 0.2s ease;
  }
  .app-viewport.tx-light .minimal-arrow-btn {
    color: #FFFFFF;
  }
  .minimal-arrow-btn:hover {
    opacity: 1;
    transform: scale(1.15);
  }
  .minimal-arrow-btn.disabled {
    opacity: 0.15;
    pointer-events: none;
  }
  .minimal-arrow-btn.ready {
    opacity: 1;
    animation: chevronPulse 1.3s infinite cubic-bezier(.45,0,.55,1);
  }
  @keyframes chevronPulse {
    0%, 100% {
      transform: translateX(0) scale(1);
      opacity: 0.75;
      filter: drop-shadow(0 0 0 rgba(239,172,57,0));
    }
    50% {
      transform: translateX(14px) scale(1.5);
      opacity: 1;
      filter: drop-shadow(0 0 10px rgba(239,172,57,0.85));
    }
  }
  .minimal-arrow-btn.shake-warn {
    animation: shakeX 0.45s !important;
    opacity: 1;
  }

  /* CONTEXTUAL FLOATING ISLAND */
  .floating-context-island {
    position: absolute;
    left: 50%;
    bottom: clamp(14px, 2.5vh, 22px);
    transform: translateX(-50%);
    z-index: 95;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
    pointer-events: auto;
  }
  .tools-capsule {
    display: flex;
    align-items: center;
    gap: 6px;
    background: rgba(255, 255, 255, 0.95);
    border: 3px solid var(--ink);
    border-radius: 100px;
    padding: 5px 8px;
    box-shadow: 3.5px 3.5px 0 var(--ink);
    backdrop-filter: blur(8px);
  }
  .hl-mini-btn {
    display: flex;
    align-items: center;
    gap: 6px;
    background: #FFF;
    color: var(--ink);
    border: 2px solid var(--ink);
    border-radius: 100px;
    padding: 7px 11px;
    font-family: 'Space Grotesk', sans-serif;
    font-weight: 700;
    font-size: 11.5px;
    cursor: pointer;
    transition: all 0.12s ease;
    white-space: nowrap;
  }
  .hl-mini-btn:hover { background: #F4F0E8; }
  .hl-mini-btn.active {
    border-width: 2.5px;
    transform: scale(0.96);
    box-shadow: inset 0 2px 4px rgba(0,0,0,0.18);
  }
  .hl-mini-btn[data-color="blue"].active { background: rgba(66,153,215,0.3); }
  .hl-mini-btn[data-color="green"].active { background: rgba(48,166,142,0.3); }
  .hl-mini-btn[data-color="yellow"].active { background: rgba(239,172,57,0.4); }
  .hl-mini-btn[data-color="pink"].active { background: rgba(221,85,75,0.3); }

  .hl-swatch {
    width: 12px;
    height: 12px;
    border-radius: 50%;
    border: 1.5px solid var(--ink);
    flex-shrink: 0;
  }
  .hl-swatch-blue{ background:var(--blue); }
  .hl-swatch-green{ background:var(--green); }
  .hl-swatch-yellow{ background:var(--yellow); }
  .hl-swatch-pink{ background:var(--pink); }

  /* FLANKING HIGHLIGHTER CONTROLS — unified into one toolbar capsule so it
     reads as a single tool, not floating icons; swatches are dot-only by
     default (label only shows on the active color) to keep the footprint
     small — sizes stay tight for mobile */
  .hl-flank-row{
    display: flex;
    align-items: center;
    gap: 4px;
    background: rgba(255,255,255,0.97);
    border: 2.5px solid var(--ink);
    border-radius: 100px;
    padding: 4px 6px;
    box-shadow: 3px 3px 0 var(--ink);
  }
  .hl-flank-btn{
    background: none;
    border: none;
    padding: 2px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 2px;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }
  .hl-flank-btn .hl-swatch{
    width: 11px;
    height: 11px;
    transition: transform 0.15s ease, box-shadow 0.15s ease;
  }
  .hl-flank-btn .hl-flank-label{
    display: none;
    font-family: 'Space Grotesk', sans-serif;
    font-weight: 800;
    font-size: 7px;
    letter-spacing: 0.1px;
    text-transform: uppercase;
    color: var(--ink);
    opacity: 0.65;
    white-space: nowrap;
  }
  .hl-flank-btn.active .hl-swatch{
    transform: scale(1.25);
    box-shadow: 0 0 0 3px rgba(13,13,13,0.15);
  }
  .hl-flank-btn.active .hl-flank-label{ display: block; opacity: 1; }
  .hl-flank-row .action-gate-pill{ padding: 9px 14px; font-size: 11.5px; border: none; box-shadow: none; }
  @media (min-width: 480px) {
    .hl-flank-row{ gap: 7px; padding: 5px 8px; }
    .hl-flank-btn .hl-swatch{ width: 13px; height: 13px; }
    .hl-flank-btn .hl-flank-label{ font-size: 8.5px; letter-spacing: 0.3px; }
    .hl-flank-row .action-gate-pill{ padding: 10px 20px; font-size: 13px; }
  }
  @media (min-width: 1024px) {
    .hl-flank-row{ gap: 10px; padding: 7px 12px; border-width: 3px; box-shadow: 4px 4px 0 var(--ink); }
    .hl-flank-btn .hl-swatch{ width: 16px; height: 16px; }
    .hl-flank-btn .hl-flank-label{ font-size: 11px; }
  }

  .action-gate-pill {
    font-family: 'Space Grotesk', sans-serif;
    font-size: 13px;
    font-weight: 800;
    letter-spacing: 0.4px;
    text-transform: uppercase;
    background: #FFF;
    color: var(--ink);
    border: 3px solid var(--ink);
    border-radius: 100px;
    padding: 10px 20px;
    cursor: pointer;
    box-shadow: 3.5px 3.5px 0 var(--ink);
    display: inline-flex;
    align-items: center;
    gap: 8px;
    white-space: nowrap;
    transition: all 0.15s ease;
  }
  .action-gate-pill:active { transform: translate(2px, 2px); box-shadow: 1px 1px 0 var(--ink); }
  .action-gate-pill.ready {
    animation: gentlePulse 2s infinite ease-in-out;
  }
  .action-gate-pill.shake-warn {
    animation: shakeX 0.45s !important;
  }

  @keyframes gentlePulse {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.02); }
  }
  @keyframes shakeX{ 10%,90%{transform:translateX(-3px);} 20%,80%{transform:translateX(5px);} 30%,50%{transform:translateX(-8px);} 40%,60%{transform:translateX(8px);} }

  /* FLOATING NOTICE BADGE */
  .clue-badge{
    position: absolute;
    left: 50%;
    bottom: clamp(76px, 12vh, 96px);
    transform: translateX(-50%);
    display: flex; align-items: center; gap: 8px;
    background: var(--ink); color: #FFF;
    font-family:'Space Grotesk', sans-serif; font-size: 13px; font-weight: 800; text-transform: uppercase; letter-spacing: .4px;
    padding: 10px 18px; border-radius: 100px;
    box-shadow: 3px 3px 0 rgba(0,0,0,0.3);
    z-index: 100;
    white-space: nowrap;
  }
  .clue-badge i{ color: var(--yellow); }

  /* HEADER & HUD */
  .hud-header{ 
    position:relative; 
    z-index:50; 
    padding: clamp(14px, 2.5vh, 22px) clamp(20px, 4vw, 60px) 6px; 
    width: 100%;
    margin: 0 auto;
    display:flex; 
    flex-direction:column; 
    gap:8px; 
  }

  .progress-container{ position:relative; width:100%; height:7px; background:rgba(13,13,29,0.18); border-radius:100px; }
  .tx-light .progress-container{ background:rgba(255,255,255,0.25); }
  .progress-bar-fill{ position:absolute; left:0; top:0; bottom:0; width:0%; background:var(--ink); border-radius:100px; transition:width .3s cubic-bezier(.2,.8,.25,1); }
  .tx-light .progress-bar-fill{ background:#FFF; }
  
  .notches-layer{ position:absolute; inset:0; pointer-events:none; }
  .prog-notch{ position:absolute; top:50%; transform:translate(-50%, -50%); width:9px; height:9px; border-radius:50%; background:rgba(13,13,29,0.3); border:1.5px solid rgba(255,255,255,0.6); transition:all .25s ease; }
  .tx-light .prog-notch{ background:rgba(255,255,255,0.4); border-color:rgba(0,0,0,0.3); }
  .prog-notch.passed{ background:var(--lime); border-color:var(--ink); }
  .prog-notch.active{ width:13px; height:13px; background:var(--yellow); border-color:var(--ink); box-shadow:0 0 8px rgba(0,0,0,0.3); animation:notchPulse 1.2s infinite ease-in-out; }
  @keyframes notchPulse{ 0%,100%{ transform:translate(-50%, -50%) scale(1); } 50%{ transform:translate(-50%, -50%) scale(1.25); } }

  .story-meta{ display:flex; align-items:center; justify-content:space-between; font-family:'Space Grotesk', sans-serif; font-size:12px; font-weight:800; letter-spacing:1.2px; text-transform:uppercase; opacity:.85; padding-right: 16px; }
  @media (max-width: 767px) {
    .story-meta { padding-right: 0; }
  }
  .story-meta .meta-link-btn{
    background: none;
    border: none;
    padding: 0;
    color: inherit;
    font-family: inherit;
    font-size: inherit;

  /* STAGE & BEATS */

  .beat{

    padding: clamp(10px, 2vh, 24px) clamp(20px, 4vw, 60px) clamp(70px, 10vh, 85px); 
    opacity:0; 
    transform:translateY(10px) scale(0.98); 
    transition:opacity .25s ease, transform .25s ease; 
    pointer-events:none; 
    z-index:1; 
    background: transparent !important;
    /* Once the fade-in transform settles, drop the layer promotion so
       children paint through the normal (reliable) path rather than
       staying composited indefinitely — see .deck-card for why this
       matters on iOS Safari. */
    -webkit-backface-visibility: hidden;
    backface-visibility: hidden;

  .deck-card {
    background: #FFF;
    color: var(--ink);
    border: 3.5px solid var(--ink);
    border-radius: 20px;
    padding: clamp(16px, 2.5vh, 28px);
    cursor: pointer;
    transition: all .14s ease;
    box-shadow: 5px 5px 0 var(--ink);
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    justify-content: center;
    /* Forces each card onto its own compositing layer. Without this,
       iOS Safari can fail to repaint a rounded-corner+box-shadow card's
       white fill after the parent .beat's transform-based fade-in
       transition finishes — the border paints but the background
       underneath it doesn't, so the card looks like it's blended into
       the page behind it. */
    -webkit-transform: translateZ(0);
    transform: translateZ(0);
    -webkit-backface-visibility: hidden;
    backface-visibility: hidden;
  }
  .deck-card:active { transform: translate(2px, 2px) translateZ(0); box-shadow: 0 0 0 var(--ink); }
  .deck-card .dc-title { font-family: 'Space Grotesk', sans-serif; font-size: clamp(18px, 2.6vh, 24px); font-weight: 800; margin-bottom: 8px; }
  .deck-card .dc-icon { font-size: clamp(22px, 3.4vh, 30px); color: var(--ink); margin-bottom: 8px; }
  .deck-card.correct .dc-icon,
  .deck-card.incorrect .dc-icon { color: inherit; }
  .deck-card .dc-badge { font-family: 'Space Grotesk', sans-serif; font-size: 11px; font-weight: 700; background: var(--ink); color: #FFF; padding: 4px 12px; border-radius: 100px; margin-bottom: 10px; }
  .deck-card .dc-desc { font-family: 'Plus Jakarta Sans', sans-serif; font-size: clamp(12.5px, 1.7vh, 14.5px); font-weight: 700; opacity: 0.85; line-height: 1.45; }
  /* Book-abbreviation pills — revealed inside the correct category card so
     picking it doubles as a quick "where Mark sits" reference */
  .dc-books{ display:none; flex-wrap:wrap; gap:6px; justify-content:center; margin-top:10px; }
  .deck-card.correct .dc-books{ display:flex; animation: bookPillsIn .4s cubic-bezier(.2,.8,.25,1) .15s both; }
  @keyframes bookPillsIn{ from{ opacity:0; transform:translateY(8px); } to{ opacity:1; transform:translateY(0); } }
  .book-pill{

<script>
const passage = [
 "They went to Capernaum, and when the Sabbath came, Jesus went into the synagogue and began to teach.",
 "The people were amazed at his teaching, because he taught them as one who had authority, not as the teachers of the law.",
 "Just then a man in their synagogue who was possessed by an impure spirit cried out,",
 "\"What do you want with us, Jesus of Nazareth? Have you come to destroy us? I know who you are—the Holy One of God!\"",
 "\"Be quiet!\" said Jesus sternly. \"Come out of him!\"",
 "The impure spirit shook the man violently and came out of him with a shriek.",
 "The people were all so amazed that they asked each other, \"What is this? A new teaching—and with authority! He even gives orders to impure spirits and they obey him.\"",

function quoteVerse(text){
  const t = (text||'').trim();
  const startsWithQuote = /^["“]/.test(t);
  const endsWithQuote = /["”]$/.test(t);
  return (startsWithQuote ? '' : '"') + text + (endsWithQuote ? '' : '"');
}
function normWord(w){ return w.replace(/[^a-zA-Z']/g,'').toLowerCase(); }

function kw(lines, extraClass){
  let i = 0;
  const body = lines.map(line=>{
    const words = line.map(w=>{
      const delay = (i * 0.09).toFixed(2); i++;
      return `<span class="kword" style="animation-delay:${delay}s">${w}</span>`;
    }).join(' ');
    return `<div class="kline">${words}</div>`;
  }).join('');
  return `<div class="hero-title${extraClass ? ' '+extraClass : ''}">${body}</div>`;
}

const paragraphEnds = [28, 31, 34, 39, 44, 45];

function passageWordsHTML(){
  let out = '<p class="flow-para">';
  passage.forEach((v,i)=>{
    const verseNum = i + 21;
    const words = v.replace(/—(?=\S)/g, '— ').split(/\s+/);
    const normed = words.map(normWord);
    const pieces = [];
    let wi = 0;
    while (wi < words.length) {
      const marker = wi === 0 ? `<span class="verse-num-inline">${verseNum}</span>` : '';
      const match = phrases.find(p => p.words.every((pw,k) => normed[wi+k] === pw));
      if (match) {
        const span = words.slice(wi, wi + match.words.length).join(' ');
        pieces.push(`${marker}<span class="w" data-word="${match.key}" onclick="tapWord(event,this)">${span}</span>`);
        wi += match.words.length;
        continue;
      }
      const norm = normed[wi];
      pieces.push(`${marker}<span class="w" data-word="${norm}" onclick="tapWord(event,this)">${words[wi]}</span>`);
      wi++;
    }
    out += pieces.join(' ') + ' ';
    if (paragraphEnds.includes(verseNum) && verseNum !== 45) out += '</p><p class="flow-para">';
  });
  out += '</p>';
  return out;
}

function versePickHTML(){
  return passage.map((v,i)=>`
    <div class="verse-tile" data-v="${i+21}" onclick="tapVerseTile(event, ${i+21})">
      <div class="vnum">${i+21}</div><div class="vtext">${v}</div>
    </div>`).join('');
}

function initNotches(){
  const layer = document.getElementById('notchesLayer');
  layer.innerHTML = '';
  const total = beats.length;
  beats.forEach((b, i) => {
    if (b.isInteractive) {
      const notch = document.createElement('div');
      notch.className = 'prog-notch';
      notch.id = `notch-${i}`;
      const pct = (i / (total - 1)) * 100;
      notch.style.left = `${pct}%`;
      layer.appendChild(notch);
    }
  });
}

function updateProgressBar(){
  const fill = document.getElementById('progressBarFill');
  const total = beats.length;
  const pct = (state.index / (total - 1)) * 100;
  fill.style.width = `${pct}%`;

  beats.forEach((b, i) => {
    if (b.isInteractive) {
      const notch = document.getElementById(`notch-${i}`);
      if (!notch) return;
      notch.classList.remove('passed', 'active');
      if (state.index > i) notch.classList.add('passed');
      else if (state.index === i) notch.classList.add('active');
    }
  });
}

function updateNavShell(){

  const b = beats[state.index];

  // Configure Previous Button

  let ready = false;
  if (b.id === 'quest-testament' || b.id === 'quest-section') ready = answeredBeats.has(state.index);
  else if (b.id === 'vocab-scan') ready = isVocabComplete();
  else if (b.id === 'char-verse-pick') ready = state.charVerse !== null;
  else if (b.id === 'char-coaching') ready = Boolean(state.trait && state.trait.trim());
  else ready = !b.blockTap;
  nextBtn.classList.toggle('ready', ready);

  // Screens whose floating island already has its own "Continue" pill hide
  // the redundant chevron so there's a single forward control, not two
  const hideNextArrow = (b.id === 'vocab-scan' || b.id === 'char-verse-pick');

  // Contextual Floating Tool Island for interaction slides

  'character-prompt':  { base:'var(--bg-cream)',   base2:'var(--bg-cream)',   p1:'85% 20%', a1:'rgba(158,100,136,0.28)', p2:'15% 85%', a2:'rgba(93,88,126,0.20)' },
  'char-verse-pick':   { base:'var(--bg-cream)',   base2:'var(--bg-cream)',   p1:'15% 80%', a1:'rgba(93,88,126,0.26)',   p2:'85% 15%', a2:'rgba(158,100,136,0.22)' },
  'char-coaching':     { base:'var(--d-live)',     base2:'var(--d-learn)',   p1:'85% 80%', a1:'rgba(158,100,136,0.30)', p2:'15% 15%', a2:'rgba(255,255,255,0.20)' },
};

function renderBeat(i){
  document.querySelectorAll('.beat').forEach(el=>el.classList.remove('active'));
  document.getElementById(`beat-${i}`).classList.add('active');
  renderGen++;
  const b = beats[i];

  phoneEl.style.background = b.bgGrad;
  phoneEl.classList.toggle('intro-glow', b.id === 'intro');
  phoneEl.classList.toggle('quest-glow', b.id === 'quest-testament' || b.id === 'quest-section');
  phoneEl.classList.toggle('variant-b', b.id === 'quest-section');
  phoneEl.classList.toggle('final-glow', b.id === 'final');
  const glowTheme = GLOW_THEMES[b.id];
  phoneEl.classList.toggle('beat-glow', !!glowTheme);
  if (glowTheme) {
    phoneEl.style.setProperty('--glow-base', glowTheme.base);
    phoneEl.style.setProperty('--glow-base2', glowTheme.base2);
    phoneEl.style.setProperty('--glow-p1', glowTheme.p1);
    phoneEl.style.setProperty('--glow-a1', glowTheme.a1);
    phoneEl.style.setProperty('--glow-p2', glowTheme.p2);
    phoneEl.style.setProperty('--glow-a2', glowTheme.a2);
    phoneEl.style.setProperty('--glow-p3', glowTheme.p3 || '50% 50%');
    phoneEl.style.setProperty('--glow-a3', glowTheme.a3 || 'rgba(255,255,255,0)');
  }
  if (b.text === 'light') {
    phoneEl.classList.add('tx-light');
    phoneEl.classList.remove('tx-dark');
    document.getElementById('hudHeader').className = 'hud-header tx-light';
  } else {
    phoneEl.classList.add('tx-dark');
    phoneEl.classList.remove('tx-light');
    document.getElementById('hudHeader').className = 'hud-header tx-dark';
  }

  updateHeaderMeta();
  updateNavShell();

  if (b.id === 'char-coaching') {
    const activeVerse = state.charVerse || 21;
    document.getElementById('charRef').textContent = 'Mark 1:' + activeVerse;
    document.getElementById('charText').textContent = quoteVerse(passage[activeVerse-21]);
    const arcStem = document.getElementById('arcStemText');
    if (arcStem) arcStem.textContent = `BASED ON VERSE ${activeVerse}:`;
    const inp = document.getElementById('customTraitInput');
    if (inp) inp.value = state.trait || '';
    requestAnimationFrame(() => requestAnimationFrame(fitCharVerseText));
  } else if (b.id === 'char-verse-pick') {
    document.querySelectorAll('#beat-'+i+' .verse-tile').forEach(t=>t.classList.toggle('selected', state.charVerse !== null && Number(t.dataset.v)===state.charVerse));
  } else if (b.id === 'vocab-scan') {
    checkPassageScroll();
    updateHoverPreviewColor();
  }

  if (b.id === 'final') renderFinalReflection();
  if (b.id === 'vocab-review') renderVocabReview();
  updateProgressBar();
  if (devMode) renderDevBubbles();
}

const answeredBeats = new Set();
function questAnswer(e, el, gridId){
  e.stopPropagation();
  if (el.classList.contains('locked')) return;
  const isCorrect = el.dataset.correct === 'true';
  if (isCorrect) {
    const grid = document.getElementById(gridId);
    grid.querySelectorAll('.deck-card').forEach(t=>t.classList.add('locked'));
    el.classList.add('correct');
    answeredBeats.add(state.index);
  } else {
    el.classList.add('incorrect','shake');
    setTimeout(()=>{ el.classList.remove('shake','incorrect'); }, 500);
  }
}

function setPassageHighlighter(color, btnEl){

    state.activeTool.vocab = null;
  } else {
    state.activeTool.vocab = color;

/* Keeps the word-hover preview matching whichever highlighter color is
   currently selected, instead of always previewing yellow */
const HOVER_PREVIEW_COLORS = {
  blue:   'rgba(66, 153, 215, 0.28)',
  green:  'rgba(48, 166, 142, 0.24)',
  yellow: 'rgba(239, 172, 57, 0.32)',

function updateHoverPreviewColor(){

function tapWord(e, el){
  e.stopPropagation();
  const key = el.dataset.word;
  if (!key) return;
  const word = el.textContent.trim().replace(/^[^A-Za-z']+/, '').replace(/[^A-Za-z']+$/, '');
  const def = defs[key] || null;
  const isStop = stopWords.has(key);

  if (state.activeTool.vocab) {
    const cls = 'hl-' + state.activeTool.vocab;
    const alreadyThisColor = el.classList.contains(cls);
    ['hl-blue','hl-green','hl-yellow','hl-pink','flagged'].forEach(c => el.classList.remove(c));
    
    if (!alreadyThisColor) {
      el.classList.add(cls);
      state.wordTaps = state.wordTaps.filter(w => w.el !== el);
      state.wordTaps.push({ el, word, def, isStop, key });
    } else {
      state.wordTaps = state.wordTaps.filter(w => w.el !== el);
    }
  } else {
    const isColored = ['hl-blue','hl-green','hl-yellow','hl-pink'].some(c=>el.classList.contains(c));
    if (isColored) {
      ['hl-blue','hl-green','hl-yellow','hl-pink'].forEach(c => el.classList.remove(c));
      state.wordTaps = state.wordTaps.filter(w => w.el !== el);
    } else if (el.classList.contains('flagged')) {
      // second tap: fully unhighlight
      el.classList.remove('flagged');
      state.wordTaps = state.wordTaps.filter(w => w.el !== el);
    } else {
      el.classList.add('flagged');
      state.wordTaps.push({ el, word, def, isStop, key });
    }
  }
  updateNavShell();
}

function tapVerseTile(e, v){
  e.stopPropagation();
  state.charVerse = v;
  document.querySelectorAll('.verse-tile').forEach(t=>t.classList.toggle('selected', Number(t.dataset.v)===v));
  updateNavShell();
}

function checkPassageScroll(){
  const el = document.getElementById('passageScrollEl');
  if (!el) return;
  const atBottom = el.scrollHeight - el.scrollTop - el.clientHeight < 45;
  if (atBottom && !state.scrolledToEnd) {
    state.scrolledToEnd = true;
    updateNavShell();
  }
}

function renderVocabReview(){
  const box = document.getElementById('vocabReviewBox');
  if (state.wordTaps.length === 0) {
    box.innerHTML = `<div class="glossary-panel"><div class="review-def-entry" style="border:none; opacity:0.7;">No words highlighted yet!</div></div>`;
    return;
  }
  
  const defined = [];
  const undefinedWords = [];
  const seen = new Set();

  state.wordTaps.forEach(w => {
    const norm = normWord(w.word);
    if (seen.has(norm)) return;
    seen.add(norm);

    const fullDef = defs[w.key] || defs[norm];
    if (fullDef) {
      defined.push({ word: w.word, def: fullDef });
    } else {
      undefinedWords.push(w.word);
    }
  });

  let html = '<div class="glossary-panel">';
  if (defined.length > 0) {
    html += `<div class="review-section-header"><i class="fa-solid fa-book-bookmark"></i> Defined Terms</div>`;
    html += defined.map((w,i) => `<div class="review-def-entry"><span class="term-word"><span class="gloss-num">${i+1}</span>${w.word}</span>${w.def}</div>`).join('');
  }
  if (undefinedWords.length > 0) {
    html += `<div class="review-section-header"><i class="fa-solid fa-magnifying-glass"></i> Terms to Define</div>
             <div class="pill-cloud">${undefinedWords.map(word => `<div class="research-pill">${word}</div>`).join('')}</div>`;
  }
  html += '</div>';
  box.innerHTML = html;
}

function handleCustomTrait(val){

function renderFinalReflection(){

/* 2 MINUTE TIMER LOGIC */
let timerSeconds = 120;
let timerInterval = null;
let timerRunning = false;

function toggleTimer(){
  const card = document.getElementById('timerCard');
  const btn = document.getElementById('timerBtn');
  const digits = document.getElementById('timerDigits');
  
  if (timerRunning) {
    clearInterval(timerInterval);
    timerRunning = false;
    card.classList.remove('running');
    btn.innerHTML = '<i class="fa-solid fa-play"></i> Resume';
  } else {
    if (timerSeconds <= 0) timerSeconds = 120;
    timerRunning = true;
    card.classList.add('running');
    btn.innerHTML = '<i class="fa-solid fa-pause"></i> Pause';
    
    timerInterval = setInterval(() => {
      timerSeconds--;
      const mins = String(Math.floor(timerSeconds / 60)).padStart(2, '0');
      const secs = String(timerSeconds % 60).padStart(2, '0');
      digits.textContent = `${mins}:${secs}`;
      
      if (timerSeconds <= 0) {
        clearInterval(timerInterval);
        timerRunning = false;
        card.classList.remove('running');
        btn.innerHTML = '<i class="fa-solid fa-rotate-right"></i> Restart';
      }
    }, 1000);
  }
}

let clueTimeout = null;
function showBadgeClue(text, iconClass){
  const badge = document.getElementById('clueBadge');
  const badgeText = document.getElementById('clueBadgeText');
  const badgeIcon = badge ? badge.querySelector('i') : null;
  if (!badge || !badgeText) return;
  badgeText.textContent = text;
  if (badgeIcon) badgeIcon.className = iconClass || 'fa-solid fa-circle-exclamation';
  badge.style.display = 'flex';

  clearTimeout(clueTimeout);
  clueTimeout = setTimeout(() => {
    badge.style.display = 'none';
  }, 2200);
}

function triggerGateShake(msg, elementId, iconClass){
  const el = document.getElementById(elementId) || document.getElementById('shellNextBtn');
  if (el) {
    el.classList.remove('shake-warn');
    void el.offsetWidth;
    el.classList.add('shake-warn');
    setTimeout(() => el.classList.remove('shake-warn'), 600);
  }
  showBadgeClue(msg, iconClass);
}

function handleForwardAttempt(){
  const b = beats[state.index];
  if (b.blockTap) {
    if ((b.id === 'quest-testament' || b.id === 'quest-section') && !answeredBeats.has(state.index)) { 
      triggerGateShake('Pick an answer to continue', 'shellNextBtn', 'fa-solid fa-hand-point-up'); 
      return; 
    }
    if (b.id === 'vocab-scan') {
      if (!state.wordTaps.length && !state.scrolledToEnd) {
        triggerGateShake('Highlight at least 1 word & scroll down!', 'vocabActionPill');
        return;
      } else if (!state.wordTaps.length) {
        triggerGateShake('Highlight at least 1 word!', 'vocabActionPill');
        return;
      } else if (!state.scrolledToEnd) {
        triggerGateShake('Scroll to the bottom first!', 'vocabActionPill');
        return;
      }
    }
    if (b.id === 'char-verse-pick' && state.charVerse === null) { 
      triggerGateShake('Tap a verse to select!', 'verseActionPill'); 
      return; 
    }
    if (b.id === 'char-coaching' && !(state.trait && state.trait.trim())) { 
      triggerGateShake('Fill in the blank to continue!'); 
      return; 
    }
  }
  goNext();
}

function fitCharVerseText(){
  const vt = document.getElementById('charText');
  const card = vt ? vt.closest('.dark-scripture-card') : null;
  const beatEl = card ? card.closest('.beat') : null;
  if (!vt || !card || !beatEl) return;
  vt.style.fontSize = '';
  const maxFont = parseFloat(getComputedStyle(vt).fontSize);
  let fontSize = maxFont;
  const minFont = Math.max(11, maxFont * 0.5);
  let guard = 0;
  while (beatEl.scrollHeight > beatEl.clientHeight + 2 && fontSize > minFont && guard < 50) {
    fontSize -= 0.5;
    vt.style.fontSize = fontSize + 'px';
    guard++;
  }
}

const PAGE_FLIP_BEAT_IDS = ['reading-intro', 'character-prompt'];
function goNext(){
  if (state.index < beats.length - 1) {
    const leavingBeat = beats[state.index];
    if (PAGE_FLIP_BEAT_IDS.includes(leavingBeat.id)) {
      const el = document.getElementById('beat-' + state.index);
      if (el) {
        el.classList.add('page-flip-exit');
        setTimeout(() => {
          el.classList.remove('page-flip-exit');
          state.index++; renderBeat(state.index);
        }, 380);
        return;
      }
    }
    state.index++; renderBeat(state.index);
  }
}

function goPrev(){ 
  if (state.index > 0) { 
    state.index--; renderBeat(state.index); 
  } 
}

  else if (document.exitFullscreen) document.exitFullscreen();
}

document.addEventListener('keydown', (e) => {
  const inField = e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA' || e.target.isContentEditable;
  if (!inField && (e.key === 'ArrowDown' || e.key === 'ArrowUp' || e.key === 'PageDown' || e.key === 'PageUp')) {
    const scrollable = document.querySelector(
      '.beat.active .passage-scroll, .beat.active .verse-pick-list, .beat.active .review-scroll'
    );
    if (scrollable) {
      const amount = (e.key === 'PageDown' || e.key === 'PageUp')
        ? scrollable.clientHeight * 0.9
        : 220;
      const dir = (e.key === 'ArrowDown' || e.key === 'PageDown') ? 1 : -1;
      scrollable.scrollBy({ top: amount * dir, behavior: 'smooth' });
      return;
    }
  }
  if (e.key === 'ArrowRight') handleForwardAttempt();
  if (e.key === 'ArrowLeft') goPrev();
  if (e.key.toLowerCase() === 'f' && e.target.tagName !== 'INPUT') toggleFullScreen();
});

/* TAP-ZONE + SWIPE NAVIGATION */
(function initGestureNav(){
  const stageEl = document.getElementById('stage');
  if (!stageEl) return;
  const LEFT_ZONE = 0.28;
  const SWIPE_THRESHOLD = 60;
  let lastSwipeTime = 0;

  stageEl.addEventListener('click', (e) => {
    if (Date.now() - lastSwipeTime < 500) return;
    const b = beats[state.index];
    const rect = stageEl.getBoundingClientRect();
    const relX = (e.clientX - rect.left) / rect.width;
    if (relX < LEFT_ZONE) {
      goPrev();
    } else if (!b.blockTap) {
      goNext();
    }
  });

  let touchStartX = 0, touchStartY = 0, touchTracking = false;
  stageEl.addEventListener('touchstart', (e) => {
    if (e.touches.length !== 1) return;
    touchStartX = e.touches[0].clientX;
    touchStartY = e.touches[0].clientY;
    touchTracking = true;
  }, { passive: true });

  stageEl.addEventListener('touchend', (e) => {
    if (!touchTracking) return;
    touchTracking = false;
    const touch = e.changedTouches[0];
    const dx = touch.clientX - touchStartX;
    const dy = touch.clientY - touchStartY;
    if (Math.abs(dx) > Math.abs(dy) && Math.abs(dx) > SWIPE_THRESHOLD) {
      lastSwipeTime = Date.now();
      const b = beats[state.index];
      if (dx < 0) {
        if (!b.blockTap) goNext();
        else handleForwardAttempt();
      } else {
        goPrev();
      }
    }
  }, { passive: true });

  stageEl.addEventListener('touchcancel', () => { touchTracking = false; }, { passive: true });
})();

const passageScrollElInit = document.getElementById('passageScrollEl');
if (passageScrollElInit) passageScrollElInit.addEventListener('scroll', checkPassageScroll, { passive: true });

/* ===================== DEV MODE ===================== */
let devMode = false;
let devTapCount = 0;
let devLastTapTime = 0;
const DEV_NOTES_KEY = 'msHangDevNotes_1_21_45';

function loadDevNotes(){
  try { return JSON.parse(localStorage.getItem(DEV_NOTES_KEY) || '{}'); }
  catch(e){ return {}; }
}
function saveDevNotes(obj){
  try { localStorage.setItem(DEV_NOTES_KEY, JSON.stringify(obj)); } catch(e){}
}

function handleEmojiTap(){
  const now = Date.now();
  if (now - devLastTapTime > 1500) devTapCount = 0;
  devTapCount++;
  devLastTapTime = now;
  if (devTapCount >= 10) {
    devTapCount = 0;
    enterDevMode();
  }
}

function enterDevMode(){
  devMode = true;
  document.getElementById('normalProgressWrap').style.display = 'none';
  document.getElementById('devBubblesBar').style.display = 'flex';
  updateHeaderMeta();
  renderDevBubbles();
}

function exitDevMode(){
  devMode = false;
  document.getElementById('normalProgressWrap').style.display = 'block';
  document.getElementById('devBubblesBar').style.display = 'none';
  updateHeaderMeta();
  closeDevNotesPanel();
}

function renderDevBubbles(){
  const bar = document.getElementById('devBubblesBar');
  const notes = loadDevNotes();
  bar.innerHTML = '';
  beats.forEach((b, i) => {
    const bub = document.createElement('div');
    bub.className = 'dev-bubble' + (i === state.index ? ' active' : '');
    bub.style.background = b.bgGrad;
    bub.style.color = b.text === 'light' ? '#FFF' : 'var(--ink)';
    bub.textContent = i + 1;
    bub.title = b.id;
    if (notes[i + '_' + b.id] && notes[i + '_' + b.id].trim()) {
      const dot = document.createElement('div');
      dot.className = 'note-dot';
      bub.appendChild(dot);
    }
    bub.onclick = (e) => { e.stopPropagation(); state.index = i; renderBeat(i); renderDevBubbles(); };
    bar.appendChild(bub);
  });
  const activeBub = bar.querySelector('.dev-bubble.active');
  if (activeBub) activeBub.scrollIntoView({ inline: 'center', block: 'nearest' });
}

function openDevNotesPanel(){
  const b = beats[state.index];
  document.getElementById('dnpTitle').textContent = `Slide ${state.index + 1}: ${b.id}`;
  const notes = loadDevNotes();
  document.getElementById('devNoteInput').value = notes[state.index + '_' + b.id] || '';
  document.getElementById('devAllNotesSection').style.display = 'none';
  document.getElementById('dnpStatus').textContent = '';
  document.getElementById('dnpRetryBtn').style.display = 'none';
  document.getElementById('paletteTesterWrap').classList.remove('open');
  document.getElementById('devNotesOverlay').style.display = 'flex';
}
function closeDevNotesPanel(){
  document.getElementById('devNotesOverlay').style.display = 'none';
  document.getElementById('paletteTesterWrap').classList.remove('open');
}
function saveCurrentDevNote(val){
  const b = beats[state.index];
  const notes = loadDevNotes();
  notes[state.index + '_' + b.id] = val;
  saveDevNotes(notes);
  if (devMode) renderDevBubbles();
}

function clearAllDevNotes(){
  if (!confirm('Clear all slide notes? This cannot be undone.')) return;
  saveDevNotes({});
  const input = document.getElementById('devNoteInput');
  if (input) input.value = '';
  const allNotesPanel = document.getElementById('devAllNotesPanel');
  if (allNotesPanel) allNotesPanel.value = '';
  if (devMode) renderDevBubbles();
}

function compileAllNotes(){
  const notes = loadDevNotes();
  const lines = [];
  beats.forEach((b, i) => {
    const key = i + '_' + b.id;
    const txt = notes[key];
    if (txt && txt.trim()) lines.push(`[${i}] ${b.id}:\n${txt.trim()}`);
  });
  return lines.length ? lines.join('\n\n') : 'No notes yet.';
}

function copyAllDevNotes(){
  const section = document.getElementById('devAllNotesSection');
  const panel = document.getElementById('devAllNotesPanel');
  section.style.display = 'flex';
  panel.value = compileAllNotes();
  panel.focus();
  panel.select();
  tryCopyAllNotes();
}

function tryCopyAllNotes(){
  const panel = document.getElementById('devAllNotesPanel');
  const status = document.getElementById('dnpStatus');
  const retryBtn = document.getElementById('dnpRetryBtn');
  panel.focus();
  panel.select();
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(panel.value).then(() => {
      status.textContent = '✓ Copied to clipboard';
      status.className = 'dnp-status ok';
      retryBtn.style.display = 'none';
    }).catch(() => {
      status.textContent = 'Copy failed — select the text above and copy manually.';
      status.className = 'dnp-status warn';
      retryBtn.style.display = 'inline-block';
    });
  } else {
    status.textContent = 'Clipboard unavailable — select the text above and copy manually.';
    status.className = 'dnp-status warn';
    retryBtn.style.display = 'inline-block';
  }
}
