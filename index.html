<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Red String — Prototype</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;0,900;1,700;1,900&family=IBM+Plex+Mono:wght@400;600&family=Inter:wght@500;700;800&display=swap">
<style>
/* VOICE: a noir party game, tense but playful
   IDEA: a case file passed around a table; the murder board is the shared heart
   PICTURE: each screen is the working game itself (lobby, files, board, lineup)
   COLOUR and TYPE: black, smoke, paper white; red string, amber lamp light, one colour per player; Playfair italic, Plex Mono, Inter
   LAYOUT: phone column with a bottom tab bar during play */
:root{color-scheme:dark;--bg:#0B0B0D;--panel:#151518;--line:#34343A;--ink:#ECE8DF;--mute:#A3A3AA;--red:#FF3B4E;--btn:#E3263A;--amber:#FFC23D;--paper:#ECE8DF;--pink:#141414}
*{box-sizing:border-box;min-width:0}
html,body{margin:0;height:100%;background:#050506}
body{color:var(--ink);font:15px/1.5 Inter,system-ui,sans-serif;display:flex;justify-content:center;overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
button:focus-visible,a:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
a{color:inherit}
#app{position:relative;width:100%;max-width:440px;height:100svh;background:var(--bg);display:flex;flex-direction:column;overflow:hidden}
.scr{flex:1;display:flex;flex-direction:column;gap:14px;padding:18px 16px 16px;overflow-y:auto;min-height:0}
.serif{font-family:'Playfair Display',serif}.mono{font-family:'IBM Plex Mono',monospace}
h1,h2,h3{margin:0}
.big{font:italic 900 64px/.92 'Playfair Display',serif;letter-spacing:-2px}
.big span{color:var(--red)}
.lbl{font:12px 'IBM Plex Mono',monospace;letter-spacing:3px;color:var(--mute)}
.amber{color:var(--amber)}
.blinds{background:repeating-linear-gradient(-22deg,rgba(0,0,0,.6) 0 16px,transparent 16px 34px),radial-gradient(ellipse at 78% 8%,rgba(255,194,61,.28),transparent 55%),var(--bg)}
.tag{position:relative;background:var(--paper);color:#141414;border-radius:6px;padding:14px 18px 14px 54px;transform:rotate(-1.5deg);box-shadow:0 14px 30px rgba(0,0,0,.6)}
.tag::before{content:"";position:absolute;left:18px;top:50%;width:18px;height:18px;margin-top:-9px;border-radius:50%;background:var(--bg);box-shadow:inset 0 0 0 4px #CFC9BC}
.code{font:800 64px/1 Inter;letter-spacing:10px}
.btn{min-height:60px;border:0;border-radius:4px;background:var(--btn);color:#fff;font-weight:800;letter-spacing:3px;font-size:16px;padding:0 18px;display:flex;align-items:center;justify-content:center;gap:10px;width:100%}
.btn.ghost{background:none;border:1px solid #6B6B72;color:var(--ink);letter-spacing:2px;font-weight:700}
.btn:disabled{opacity:.45;cursor:default}
.row{display:flex;gap:10px;align-items:center}
.grow{flex:1}
.list{border-top:1px solid var(--line)}
.li{display:flex;align-items:center;gap:12px;padding:12px 4px;border-bottom:1px solid var(--line);background:none;border-left:0;border-right:0;border-top:0;width:100%;text-align:left;min-height:56px}
.dot{width:10px;height:10px;border-radius:50%;flex:none}
.choice{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.opt{background:var(--panel);border:2px solid var(--line);border-radius:6px;padding:12px;text-align:left;min-height:84px;display:flex;flex-direction:column;gap:4px}
.opt[aria-pressed=true]{border-color:var(--amber);box-shadow:0 0 24px rgba(255,194,61,.15)}
.opt b{font:italic 700 20px/1.05 'Playfair Display',serif}
.opt small{color:var(--mute);font-size:12px;line-height:1.35}
/* game shell */
.top{display:flex;align-items:center;gap:10px;padding:14px 16px 10px;border-bottom:1px solid var(--line)}
.top h2{font:italic 900 22px/1 'Playfair Display',serif}
.timer{margin-left:auto;font:600 22px 'IBM Plex Mono',monospace;color:var(--amber);text-shadow:0 0 14px rgba(255,194,61,.45)}
.timer.low{color:var(--red);text-shadow:0 0 14px rgba(255,59,78,.5)}
.skip{border:1px solid var(--line);background:none;border-radius:4px;height:32px;padding:0 8px;font:11px 'IBM Plex Mono',monospace;color:var(--mute)}
.tabs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border-top:1px solid var(--line);background:#0e0e10}
.tabs button{background:none;border:0;padding:8px 0 10px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;font-weight:700;color:var(--mute);min-height:58px;position:relative}
.tabs button[aria-selected=true]{color:var(--ink)}
.tabs button[aria-selected=true]::before{content:"";position:absolute;top:0;left:25%;right:25%;height:3px;background:var(--red)}
.tabs .n{position:absolute;top:6px;right:22%;background:var(--amber);color:#141414;border-radius:999px;font:600 10px 'IBM Plex Mono',monospace;padding:0 5px}
.lock{opacity:.45}
.paper{background:var(--paper);color:#141414;padding:18px;font:12.5px/1.6 'IBM Plex Mono',monospace;box-shadow:0 14px 30px rgba(0,0,0,.6)}
.paper h3{font:900 24px/1.1 'Playfair Display',serif;margin:4px 0 8px}
.paper p{margin:0 0 10px}
.paper .hdr{display:flex;justify-content:space-between;border-bottom:2px solid #141414;padding-bottom:6px;font-weight:600;font-size:11px;letter-spacing:2px}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.ev{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:0;overflow:hidden;text-align:left;display:flex;flex-direction:column}
.ev .im{aspect-ratio:1;background:#1c1c20 center/cover;display:grid;place-items:center;filter:grayscale(.35)}
.ev .cap{padding:8px 10px 10px;line-height:1.2}
.ev .cap small{display:block;font:11px 'IBM Plex Mono',monospace;color:var(--mute)}
.ev .cap b{font:700 16px 'Playfair Display',serif}
.ev .new{position:absolute;margin:8px;background:var(--amber);color:#141414;font:600 10px 'IBM Plex Mono',monospace;letter-spacing:2px;padding:2px 6px}
.sus{display:grid;grid-template-columns:84px minmax(0,1fr);gap:12px;padding:10px;background:var(--panel);border:1px solid var(--line);border-radius:6px;text-align:left;width:100%}
.sus img{width:84px;height:104px;object-fit:cover;object-position:top;filter:grayscale(1)}
.sus b{font:900 20px 'Playfair Display',serif}
.sus p{margin:2px 0 0;font-size:13px;color:#cfcfd4;line-height:1.4}
/* board */
.board{position:relative;flex:1;min-height:380px;border:1px solid var(--line);border-radius:6px;overflow:hidden;background:repeating-linear-gradient(-22deg,rgba(0,0,0,.45) 0 14px,transparent 14px 30px),radial-gradient(ellipse at 70% 10%,rgba(255,194,61,.16),transparent 60%),#1A1A1E;touch-action:none}
.board svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.board line{stroke:var(--red);stroke-width:2.4;stroke-linecap:round;vector-effect:non-scaling-stroke;filter:drop-shadow(0 0 3px rgba(255,59,78,.9))}
.bc{position:absolute;transform:translate(-50%,-50%) rotate(var(--r,0deg));width:92px;background:var(--paper);color:#141414;padding:5px 5px 6px;box-shadow:0 8px 16px rgba(0,0,0,.6);border:0;text-align:left;cursor:grab;touch-action:none;user-select:none}
.bc img{display:block;width:100%;height:58px;object-fit:cover;object-position:top;filter:grayscale(1);pointer-events:none}
.bc b{display:block;font:900 13px/1.15 'Playfair Display',serif;margin-top:4px}
.bc small{font:10px 'IBM Plex Mono',monospace}
.bc .pin{position:absolute;left:50%;top:-6px;width:12px;height:12px;margin-left:-6px;border-radius:50%;box-shadow:0 0 0 2px #141414}
.bc.sel{outline:3px solid var(--amber);outline-offset:2px}
.bc.note{background:var(--amber)}
.bc.doc{background:#e3dccb}
.btools{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr) 64px;gap:8px}
.chip{border:1px solid var(--line);background:var(--panel);border-radius:4px;min-height:48px;font-weight:700;font-size:13px}
.chip[aria-pressed=true]{border-color:var(--red);color:#fff;background:#2a1418}
/* overlays */
.ov{position:absolute;inset:0;z-index:20;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:24px;text-align:center;background:radial-gradient(circle at 50% 40%,#3a3a42 0%,#141418 45%,#08080a 80%);animation:fade .25s}
.stamp{border:4px solid var(--red);color:var(--red);font:600 34px 'IBM Plex Mono',monospace;letter-spacing:6px;padding:2px 14px;transform:rotate(-10deg);animation:stamp .35s cubic-bezier(.2,1.6,.5,1)}
.sheet{position:absolute;left:0;right:0;bottom:0;z-index:15;background:#111114;border-top:1px solid var(--line);border-radius:12px 12px 0 0;padding:18px 16px 18px;max-height:88%;overflow-y:auto;display:flex;flex-direction:column;gap:12px;animation:up .25s;box-shadow:0 -20px 40px rgba(0,0,0,.6)}
.scrim{position:absolute;inset:0;z-index:14;background:rgba(0,0,0,.55)}
.toast{position:absolute;left:12px;right:12px;top:64px;z-index:12;background:rgba(21,21,24,.96);border:1px solid var(--line);border-radius:6px;padding:10px 12px;font-size:13px;display:flex;gap:8px;align-items:center;animation:drop .25s}
@keyframes fade{from{opacity:0}}@keyframes up{from{transform:translateY(40%);opacity:0}}@keyframes drop{from{transform:translateY(-12px);opacity:0}}
@keyframes stamp{from{transform:rotate(-10deg) scale(2.2);opacity:0}}
.lineup{position:relative;height:300px;border:1px solid var(--line);border-radius:6px;overflow:hidden;background:repeating-linear-gradient(180deg,transparent 0 37px,#34343A 37px 38px),#151518;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:4px;padding:0 4px;align-items:end}
.lu{border:0;background:none;padding:0 0 8px;display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end;border-radius:4px}
.lu img{width:100%;object-fit:cover;object-position:top;border-radius:3px;filter:grayscale(1) brightness(.5);transition:filter .2s}
.lu .pl{background:var(--paper);color:#141414;font:600 14px 'IBM Plex Mono',monospace;padding:1px 9px;margin-top:-16px;position:relative}
.lu b{font:900 15px 'Playfair Display',serif}
.lu[aria-pressed=true] img{filter:none}
.lu[aria-pressed=true]{background:radial-gradient(ellipse at 50% 30%,rgba(255,255,255,.18),transparent 65%)}
.qs{display:flex;flex-wrap:wrap;gap:8px}
.q{border:1px solid var(--line);background:var(--panel);border-radius:999px;min-height:44px;padding:0 14px;font-size:14px;font-weight:700}
.q[aria-pressed=true]{border-color:var(--amber);color:var(--amber)}
table{width:100%;border-collapse:collapse;font-size:13px}td,th{text-align:left;padding:8px 6px;border-bottom:1px solid var(--line)}th{font:11px 'IBM Plex Mono',monospace;color:var(--mute);letter-spacing:1px}
.ok{color:#5BD39A}.no{color:var(--red)}
.tvwrap{position:absolute;inset:0;z-index:25;background:#000;display:flex;flex-direction:column;justify-content:center;padding:12px;gap:10px}
.tv{aspect-ratio:16/9;width:100%;border:6px solid #222;border-radius:8px;position:relative;overflow:hidden}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</head>
<body>
<main id="app" aria-live="polite"></main>
<script>
{
const IMG = n => 'img/' + n + '.jpg';
const VIEWER = 'evidence/';
const PLAYERS = [
  {id:'me', n:'You', c:'#FF3B4E'},
  {id:'jess', n:'Jess', c:'#3FD0C9'},
  {id:'marcus', n:'Marcus', c:'#B48CFF'},
  {id:'priya', n:'Priya', c:'#FFC23D'}
];
const SUS = [
  {id:'roylott', n:'Dr. Grimesby Roylott', s:'Roylott', img:'suspect-roylott', c:'#FF3B4E', who:'Julia\'s stepfather. Ex-doctor back from India. Violent temper; keeps Indian animals loose on the grounds.', alibi:'"Asleep in my room all night." (The room next to Julia\'s.)'},
  {id:'helen', n:'Helen Stoner', s:'Helen', img:'suspect-helen', c:'#B48CFF', who:'Julia\'s twin sister. Brought the case to you.', alibi:'Woke to Julia\'s scream and found her in the hall.'},
  {id:'croft', n:'Silas Croft', s:'Croft', img:'suspect-croft', c:'#3FD0C9', who:'Groundskeeper. Julia reported him for selling the estate\'s firewood.', alibi:'"In my cottage all night." Muddy boots by the back door.'},
  {id:'price', n:'Major Edmund Price', s:'Price', img:'suspect-price', c:'#FFC23D', who:'Julia\'s fiancé. Overheard arguing with her the week before.', alibi:'Took the evening train home to Harrow.'}
];
const ROUNDS = [
  {n:'The locked room', q:'How did anyone get in? Was it Croft, or Price?'},
  {n:'Something in the walls', q:'The room was changed on purpose. And who gains from the will?'},
  {n:'The room next door', q:'What is Roylott keeping in his room?'}
];
const P = (a) => a.map(x => `<p>${x}</p>`).join('');
const ITEMS = [
  {id:'D1', kind:'doc', r:1, tag:'D-1', n:'Helen\'s statement', sub:'Witness statement', body:`<div class="hdr"><span>WITNESS STATEMENT</span><span>D-1</span></div><h3>Helen Stoner</h3>` + P(['On the night Julia died, a storm was blowing. Julia came to my room before bed and asked if I ever heard a low, clear whistle in the night, around three. I said no. She said she had heard it for several nights.','Later I woke to a terrible scream. I opened my door and heard a soft whistle, then a clanging sound, like metal falling. Julia staggered out of her room. She cried, "It was the band! The speckled band!" and pointed toward the doctor\'s room. She died within minutes.','Julia always locked her door and barred her shutters at night. My stepfather keeps a cheetah and a baboon loose on the grounds.'])},
  {id:'D2', kind:'doc', r:1, tag:'D-2', n:'Inquest summary', sub:'Coroner', body:`<div class="hdr"><span>SURREY COUNTY CORONER</span><span>D-2</span></div><h3>Inquest Summary</h3>` + P(['DECEASED: Julia Stoner, 30. FINDING: Open verdict.','No marks of violence. No poison found in tests. Door locked from inside; window shutters barred with iron bars, checked each night. Walls and floor found solid. Chimney wide, but barred with four large staples.','Found in her nightdress. In her right hand, the stump of a burnt match. In her left, a matchbox.','The coroner could not name a cause. Death from fright is possible.'])},
  {id:'D3', kind:'doc', r:2, tag:'D-3', n:'Mrs. Stoner\'s will', sub:'Extract', body:`<div class="hdr"><span>EXTRACT · LAST WILL</span><span>D-3</span></div><h3>Mrs. Stoner's Will</h3>` + P(['I leave my income of £1,000 a year to my husband, Dr. Grimesby Roylott, <b>while my daughters live with him</b>. On the marriage of either daughter, she is to receive a yearly share of that income for her own use.'])},
  {id:'D4', kind:'doc', r:2, tag:'D-4', n:'Julia\'s letter', sub:'Found in her desk', body:`<div class="hdr"><span>LETTER</span><span>D-4</span></div><h3>Dear Helen,</h3>` + P(['Strange things this week. Workmen came and fitted a new ventilator high in my wall and a bell-rope beside my bed, though I never asked for either. The ventilator opens into the doctor\'s room, not outside. Some nights I smell his cigars through it.','And that whistle again, at three in the morning. You must hear it too?','Your loving sister,<br>Julia'])},
  {id:'P1', kind:'photo', r:1, tag:'Photo 1', n:'Julia\'s bedroom', img:'photo-1-bedroom', d:'The bolted bed, the bell-rope dangling to the pillow, the vent high above.'},
  {id:'R1', kind:'ev', r:1, tag:'R-1', n:'Muddy boots', img:'R-1-muddy-boots', d:'Croft\'s work boots by the back door, caked in wet mud.', v3d:1},
  {id:'R2', kind:'ev', r:1, tag:'R-2', n:'Train ticket', icon:'ticket', d:'Evening train from Leatherhead, punched, dated the night of the death.', v3d:1},
  {id:'A7', kind:'ev', r:1, tag:'A-7', n:'Matchbox', icon:'box', d:'Found in Julia\'s left hand, with one burnt match.', v3d:1},
  {id:'R3', kind:'ev', r:2, tag:'R-3', n:'Copy of the will', icon:'doc', d:'Helen\'s copy, with the shares underlined in pencil.', v3d:1},
  {id:'A2', kind:'photo', r:2, tag:'A-2', n:'Bell-rope', img:'A-2-bell-rope', d:'Hangs to the pillow. Pulled, it rings nothing: the wire isn\'t attached. Hooked just under the ventilator.'},
  {id:'A3', kind:'photo', r:2, tag:'A-3', n:'Bolted bed', img:'A-3-bolted-bed', d:'Bolted to the floor, so it can\'t be moved away from the rope.'},
  {id:'A1', kind:'photo', r:2, tag:'A-1', n:'Ventilator', icon:'vent', d:'A small vent high in Julia\'s wall. It opens into Roylott\'s room, not outside.'},
  {id:'A4', kind:'ev', r:3, tag:'A-4', n:'Saucer of milk', img:'A-4-saucer', d:'On top of the iron safe in Roylott\'s room. He keeps no cat.', v3d:1},
  {id:'A5', kind:'ev', r:3, tag:'A-5', n:'Looped dog lash', img:'A-5-dog-lash', d:'By Roylott\'s bed, its end tied into a small loop.', v3d:1},
  {id:'A6', kind:'photo', r:3, tag:'A-6', n:'Iron safe', img:'A-6-iron-safe', d:'A heavy safe in Roylott\'s room. Its door clangs shut.'}
];
const ICON = {
  ticket:'<path d="M3 7h12l-2 3 2 3-2 3H3z"/><path d="M7 7v9" stroke-dasharray="2 2"/>',
  box:'<rect x="3" y="7" width="18" height="10" rx="1"/><path d="M14 7v10"/>',
  doc:'<path d="M6 3h9l4 4v14H6z"/><path d="M9 10h7M9 13h7M9 16h4"/>',
  vent:'<rect x="5" y="5" width="14" height="14"/><path d="M5 9h14M5 13h14M5 17h14"/>'
};
const svgI = k => `<svg width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="#ECE8DF" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICON[k]}</svg>`;
const HOW = ['Poisoned drink', 'A snake sent through the vent', 'A hidden passage', 'Frightened by the cheetah'];
const WHY = ['To keep the family money', 'Jealousy', 'Revenge for being reported', 'A lovers\' quarrel'];
const ANSWER = {who:'roylott', how:1, why:0};
const ROUND_SECS = 480;

const S = {screen:'title', mode:'tv', joined:['me'], round:1, t:ROUND_SECS, tab:'files', seen:new Set(), pins:[], strings:[], tie:false, sel:null, ready:new Set(), vote:{who:null, how:null, why:null}, bots:{}, sheet:null, ov:null, toast:null, tv:false};
const P_ = id => PLAYERS.find(p => p.id === id);
const unlocked = () => ITEMS.filter(i => i.r <= S.round);
const newCount = kinds => unlocked().filter(i => kinds.includes(i.kind) && !S.seen.has(i.id)).length;
const $ = s => document.querySelector(s);
const esc = x => String(x).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const app = $('#app');
let timerId = null, botId = null, toastId = null;

/* ---------- renderers ---------- */
function render() {
  const f = {title, lobby, brief, game, vote, reveal}[S.screen];
  app.innerHTML = f() + overlays();
  if (S.screen === 'game' && S.tab === 'board') drawStrings();
}
function title() {
  return `<section class="scr blinds" style="justify-content:space-between">
    <div><div class="lbl amber">A PARTY MURDER MYSTERY</div><h1 class="big" style="font-size:80px;margin-top:8px">Red<br><span>String</span></h1></div>
    <p style="margin:0;color:#cfcfd4;max-width:30ch">Gather your detectives. Read the files, pin the clues, tie the string, and name the killer before time runs out.</p>
    <div style="display:grid;gap:10px"><button class="btn" data-a="host">HOST A CASE</button><button class="btn ghost" data-a="host">JOIN WITH A CODE</button>
    <p class="mono" style="margin:0;font-size:11px;color:var(--mute);text-align:center">Prototype · the other 3 detectives are simulated</p></div></section>`;
}
function lobby() {
  const full = S.joined.length === 4;
  return `<section class="scr blinds">
    <div><div class="lbl amber">CASE 0221 · THE SPECKLED BAND</div><h1 class="big" style="font-size:52px;margin-top:6px">Red <span>String</span></h1></div>
    <div class="tag"><div class="mono" style="font-size:12px;font-weight:600;letter-spacing:4px">ROOM CODE</div><div class="code">KXQZ</div><div style="font-size:13px;color:#4A4740">Friends join on their phones with this code</div></div>
    <div class="lbl">WHERE DOES THE BOARD LIVE?</div>
    <div class="choice">${[['tv','On the TV','Board on the big screen, files on phones'],['phones','Phones only','Everyone carries the full board']].map(([k, a, b]) => `<button class="opt" data-a="mode" data-v="${k}" aria-pressed="${S.mode === k}"><b>${a}</b><small>${b}</small></button>`).join('')}</div>
    <div class="list">${PLAYERS.map(p => S.joined.includes(p.id) ? `<div class="li" style="min-height:44px"><span class="dot" style="background:${p.c}"></span><b>${p.n}</b><span class="grow"></span><span class="mono" style="font-size:11px;color:var(--mute)">${p.id === 'me' ? 'HOST' : 'READY'}</span></div>` : `<div class="li" style="min-height:44px;color:var(--mute)"><span class="dot" style="border:2px dashed #6B6B72"></span>waiting…</div>`).join('')}</div>
    <div class="grow"></div>
    <button class="btn" data-a="start" ${full ? '' : 'disabled'}>${full ? 'OPEN THE CASE' : 'WAITING FOR DETECTIVES…'}</button></section>`;
}
function brief() {
  return `<section class="scr" style="background:radial-gradient(circle at 50% 30%,#2a2a30,#0b0b0d 70%)">
    <div class="lbl amber">CASE 0221 · STOKE MORAN MANOR · 1883</div>
    <h1 class="serif" style="font:italic 900 44px/1 'Playfair Display'">The Speckled Band</h1>
    <div class="row" style="align-items:flex-start;gap:14px"><img src="${IMG('victim-julia')}" alt="Julia Stoner" style="width:96px;height:120px;object-fit:cover;filter:grayscale(1);box-shadow:0 10px 20px rgba(0,0,0,.6)">
    <p style="margin:0;color:#d8d8dc">Two years ago, <b>Julia Stoner</b>, 30, died in her bedroom. The door was locked from the inside. The shutters were barred. No wound, no poison, no sign of anyone else.</p></div>
    <p style="margin:0;font:italic 700 22px/1.3 'Playfair Display';border-left:3px solid var(--red);padding-left:14px">"It was the band! The speckled band!"</p>

  else if (a === 'how') { S.vote.how = +v; render(); }
  else if (a === 'why') { S.vote.why = +v; render(); }
  else if (a === 'lock') { S.ready.add('me'); const go = () => { if (Object.keys(S.bots).length === 3) { S.screen = 'reveal'; S.ov = `<span class="stamp" style="font-size:28px">THE VERDICT</span><p class="mono" style="color:var(--mute);margin:0">Opening the sealed envelope…</p>`; render(); setTimeout(() => { S.ov = null; render(); }, 1600); } else setTimeout(go, 500); }; S.ov = `<div class="lbl amber">VOTE LOCKED</div><h2 class="serif" style="font:italic 900 34px 'Playfair Display'">Waiting for the others…</h2>`; render(); go(); }
  else if (a === 'again') location.reload();
});

/* board: drag cards, tap to tie strings */
let drag = null;
app.addEventListener('pointerdown', e => {
  const c = e.target.closest('.bc'); if (!c) return; const b = $('#board').getBoundingClientRect();
  drag = {k:c.dataset.k, el:c, b, sx:e.clientX, sy:e.clientY, moved:false}; c.setPointerCapture(e.pointerId);
});
app.addEventListener('pointermove', e => {
  if (!drag) return; const d = Math.hypot(e.clientX - drag.sx, e.clientY - drag.sy); if (d > 6) drag.moved = true; if (!drag.moved || S.tie) return;
  const p = S.pins.find(x => x.key === drag.k); p.x = Math.min(94, Math.max(6, (e.clientX - drag.b.left) / drag.b.width * 100)); p.y = Math.min(94, Math.max(6, (e.clientY - drag.b.top) / drag.b.height * 100));
  drag.el.style.left = p.x + '%'; drag.el.style.top = p.y + '%'; drawStrings();
});
app.addEventListener('pointerup', () => {
  if (!drag) return; const k = drag.k, moved = drag.moved; drag = null;
  if (moved && !S.tie) return;
  if (S.tie) { if (!S.sel) { S.sel = k; } else if (S.sel !== k) { if (!S.strings.some(([x, y]) => (x === S.sel && y === k) || (x === k && y === S.sel))) S.strings.push([S.sel, k, 'me']); S.sel = null; S.tie = false; } render(); }
});

render();
}
</script>
