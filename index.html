<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Bao Buddy</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Nunito:wght@500;700;800&display=swap');

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; min-height: 100vh; background: #F3EEE7; font-family: 'Nunito', -apple-system, sans-serif; transition: background 1.2s ease; }
  #root { max-width: 460px; margin: 0 auto; padding: 16px; }
  @media (min-width: 480px) { #root { padding: 24px; } }
  button { font-family: inherit; }

  @keyframes fall { to { transform: translateY(140px) rotate(200deg); opacity: 0; } }
  @keyframes bob {
    0%, 100% { transform: translateY(0) rotate(-2deg); }
    50% { transform: translateY(-5px) rotate(2deg); }
  }
  .bob { animation: bob 2.4s ease-in-out infinite; }
  .bob-fast { animation: bob 1.5s ease-in-out infinite; }
  @keyframes squish {
    0% { transform: scale(1, 1) rotate(0deg); }
    18% { transform: scale(1.32, 0.66) rotate(-4deg); }
    38% { transform: scale(0.8, 1.22) rotate(4deg); }
    58% { transform: scale(1.14, 0.88) rotate(-2deg); }
    75% { transform: scale(0.94, 1.08) rotate(1.5deg); }
    90% { transform: scale(1.03, 0.98) rotate(-0.5deg); }
    100% { transform: scale(1, 1) rotate(0deg); }
  }
  .squish-anim { animation: squish 0.55s cubic-bezier(0.34, 1.56, 0.64, 1); transform-origin: 50% 65%; }
  .mascot-tap { cursor: pointer; }
  @keyframes celebratePop {
    0% { transform: scale(0.7); opacity: 0; }
    55% { transform: scale(1.06); opacity: 1; }
    75% { transform: scale(0.97); }
    100% { transform: scale(1); }
  }
  .celebrate-pop { animation: celebratePop 0.5s cubic-bezier(0.34, 1.56, 0.64, 1); }

  .kid-panel-content { position: relative; }
  .shared-header { margin-bottom: 18px; }
  .row { display: flex; align-items: center; }
  .row-between { display: flex; justify-content: space-between; align-items: center; }
  .kid-btn { flex: 1; border: none; cursor: pointer; border-radius: 22px; display: flex; flex-direction: column; align-items: center; gap: 2px; transition: all 0.2s ease; }
  .chore-card { position: relative; border-radius: 20px; padding: 14px 16px; display: flex; align-items: center; gap: 14px; transition: all 0.25s ease; }
  .icon-box { width: 48px; height: 48px; border-radius: 14px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; cursor: pointer; }
  .done-btn { background: none; border: none; cursor: pointer; flex-shrink: 0; }
  .footer-card { margin-top: 16px; background: white; border-radius: 22px; padding: 16px; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 4px 16px rgba(0,0,0,0.06); height: 100%; }
  .lock-btn { background: #ffffff33; border: none; border-radius: 999px; width: 36px; height: 36px; display: flex; align-items: center; justify-content: center; cursor: pointer; }

  /* Kid pieces: 4 total (2 chores + 2 balance). Narrow: only the active
     kid's 2 pieces show, stacking normally. Wide: all 4 show as a real
     2x2 grid — chores row on top, balance row beneath, both kids' balance
     cards land in the same row (same height) no matter how many chores
     either kid has, since a grid row sizes to its tallest cell. */
  .kid-grid { display: block; }
  .kid-piece { display: none; }
  .kid-piece.active { display: block; }
  .wide-only { display: none; }
  @media (min-width: 700px) {
    #root { max-width: 1280px; }
    .kid-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 22px 28px; }
    .kid-piece { display: block !important; min-width: 0; }
    .narrow-only { display: none !important; }
    .wide-only { display: flex !important; }

    /* a bigger, chunkier feel once there's room to spare */
    .chore-card { padding: 18px 20px !important; border-radius: 24px !important; }
    .icon-box { width: 58px !important; height: 58px !important; border-radius: 16px !important; }
    .chore-label { font-size: 20px !important; }
    .chore-minutes { font-size: 14px !important; }
    .chore-emoji { font-size: 34px !important; }
    .balance-amount { font-size: 38px !important; }
    .footer-card { padding: 20px !important; border-radius: 26px !important; }
    .wide-mascot svg { width: 112px !important; height: 112px !important; }
  }
  .confetti-wrap { position: absolute; inset: 0; pointer-events: none; overflow: hidden; border-radius: 20px; }
  .confetti-piece { position: absolute; top: -10%; width: 7px; height: 7px; }
  .timer-row { display: flex; align-items: center; gap: 10px; margin-top: 8px; }
  .timer-btn { border: none; border-radius: 999px; width: 34px; height: 34px; display: flex; align-items: center; justify-content: center; cursor: pointer; box-shadow: 0 2px 0 rgba(0,0,0,0.15); }
</style>
</head>
<body>
<div id="root"></div>

<script>
"use strict";

/* ---------------------------------------------------------------
   Bao Buddy — vanilla JS build (no React, no build step).
   Each routine is a little path across a sky that shifts with the
   time of day. Every chore is a stepping stone with its own timer.
----------------------------------------------------------------- */

var KIDS = {
  miles: { name: "Miles", age: 3, accent: "#FF9B42", accent2: "#FFD166", mascot: "bao-miles" },
  lina:  { name: "Lina",  age: 7, accent: "#5B7FFF", accent2: "#7DD8C6", mascot: "bao-lina" }
};

var CHORE_LIBRARY = {
  miles: {
    morning: [
      { id: "m1", label: "Go potty",      minutes: 3,  emoji: "\uD83D\uDEBD" },
      { id: "m2", label: "Get dressed",   minutes: 5,  emoji: "\uD83D\uDC55" },
      { id: "m3", label: "Brush teeth",   minutes: 2,  emoji: "\uD83E\uDEA5" },
      { id: "m4", label: "Eat breakfast", minutes: 10, emoji: "\uD83C\uDF73" },
      { id: "m5", label: "Put on shoes",  minutes: 2,  emoji: "\uD83D\uDC5F" }
    ],
    evening: [
      { id: "e1", label: "Clean up toys",  minutes: 5,  emoji: "\uD83E\uDDF8" },
      { id: "e2", label: "Brush teeth",    minutes: 2,  emoji: "\uD83E\uDEA5" },
      { id: "e3", label: "Take bath",      minutes: 10, emoji: "\uD83D\uDEC1" },
      { id: "e4", label: "Go potty",       minutes: 3,  emoji: "\uD83D\uDEBD" },
      { id: "e5", label: "Put on pajamas", minutes: 3,  emoji: "\uD83C\uDF19" }
    ]
  },
  lina: {
    morning: [
      { id: "m1", label: "Make bed",      minutes: 3,  emoji: "\uD83D\uDECF\uFE0F" },
      { id: "m2", label: "Get dressed",   minutes: 5,  emoji: "\uD83D\uDC55" },
      { id: "m3", label: "Brush teeth",   minutes: 2,  emoji: "\uD83E\uDEA5" },
      { id: "m4", label: "Eat breakfast", minutes: 10, emoji: "\uD83C\uDF73" },
      { id: "m5", label: "Pack backpack", minutes: 3,  emoji: "\uD83C\uDF92" }
    ],
    evening: [
      { id: "e1", label: "Tidy room",           minutes: 8,  emoji: "\uD83E\uDDF9" },
      { id: "e2", label: "Shower",              minutes: 10, emoji: "\uD83D\uDEBF" },
      { id: "e3", label: "Brush teeth",         minutes: 2,  emoji: "\uD83E\uDEA5" },
      { id: "e4", label: "Read + lights out",   minutes: 10, emoji: "\uD83D\uDCD6" }
    ]
  }
};

/* ---------------- goals (simple savings-progress display, not a full prize catalog) ---------------- */
var GOALS = {
  miles: [
    { emoji: "\uD83C\uDF66", label: "Ice Cream", cost: 4 },
    { emoji: "\uD83D\uDECC", label: "Sleepover", cost: 8 },
    { emoji: "\uD83C\uDFAF", label: "Target Toy", cost: 12 }
  ],
  lina: [
    { emoji: "\uD83C\uDF66", label: "Ice Cream", cost: 4 },
    { emoji: "\uD83D\uDECC", label: "Sleepover", cost: 8 },
    { emoji: "\uD83C\uDFAF", label: "Target Toy", cost: 12 }
  ]
};

function cloneChoreList(list) {
  return list.map(function (c) { return { id: c.id, label: c.label, minutes: c.minutes, emoji: c.emoji }; });
}
function defaultCustomChores() {
  var out = {};
  Object.keys(KIDS).forEach(function (kidId) {
    out[kidId] = {
      morning: cloneChoreList(CHORE_LIBRARY[kidId].morning),
      evening: cloneChoreList(CHORE_LIBRARY[kidId].evening)
    };
  });
  return out;
}

/* ---------------- state ---------------- */
var state = {
  kidId: "lina",
  parentMode: false,
  periodOverride: null,
  done: {},        // choreKey -> true
  timerUI: {},      // choreKey -> bool, is the timer row expanded
  timers: {},       // choreKey -> { totalSeconds, remainingSeconds, running, endTimestamp }
  balance: { miles: 0, lina: 0 },
  jars: {
    miles: { give: 0, save: 0, spend: 0 },
    lina:  { give: 0, save: 0, spend: 0 }
  },
  weekly: {
    miles: { weekStart: null, days: { mon: false, tue: false, wed: false, thu: false, fri: false }, awarded: false },
    lina:  { weekStart: null, days: { mon: false, tue: false, wed: false, thu: false, fri: false }, awarded: false }
  },
  customChores: defaultCustomChores(), // parent-editable base chore lists (Lina's weekday homework/rotation are auto-added on top, not editable)
  nextChoreId: 1,
  lastActiveDate: null,
  accountOpenFor: null, // kidId whose Give/Save/Spend account view is open, or null
  squishSwitcher: null, // kidId whose switcher mascot should play the squish animation this render, or null
  squishBanner: false,  // whether the all-done banner mascot should play the squish animation this render
  celebrateKid: null,   // kidId whose all-done banner should play the celebration pop-in this render, or null
  bunColors: { miles: null, lina: null }, // custom recolor per kid, null = use default color
  playModalFor: null,   // kidId whose "Bao Play" modal is open (long-press unlock, only once all done), or null
  pokeBao: null,         // kidId whose bao should play the poke squish this render, or null
  lastRenderedPeriod: null
};

/* ---------------- persistence (localStorage) ----------------
   Only balance/jars/weekly/lastActiveDate persist — chore
   checkmarks and timers intentionally reset each new day. */
var STORAGE_KEY = "choretrail_state_v1";
function loadPersisted() {
  try {
    var raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return null;
    return JSON.parse(raw);
  } catch (e) { return null; }
}
function savePersisted() {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify({
      balance: state.balance,
      jars: state.jars,
      weekly: state.weekly,
      lastActiveDate: state.lastActiveDate,
      customChores: state.customChores,
      bunColors: state.bunColors,
      nextChoreId: state.nextChoreId
    }));
  } catch (e) { /* storage unavailable, continue without persistence */ }
}
function todayDateString(d) {
  return d.toISOString().slice(0, 10);
}
function mondayOfWeek(d) {
  var day = d.getDay(); // 0 Sun .. 6 Sat
  var diff = (day === 0 ? -6 : 1 - day);
  var monday = new Date(d.getFullYear(), d.getMonth(), d.getDate() + diff);
  return todayDateString(monday);
}
function isoWeekdayKey(d) {
  var map = { 1: "mon", 2: "tue", 3: "wed", 4: "thu", 5: "fri" };
  return map[d.getDay()] || null; // null for Sat/Sun
}
var WEEKDAY_KEYS = ["mon", "tue", "wed", "thu", "fri"];

function initPersistence() {
  var saved = loadPersisted();
  if (saved) {
    if (saved.balance) state.balance = saved.balance;
    if (saved.jars) state.jars = saved.jars;
    if (saved.weekly) state.weekly = saved.weekly;
    if (saved.lastActiveDate) state.lastActiveDate = saved.lastActiveDate;
    if (saved.customChores) state.customChores = saved.customChores;
    if (saved.bunColors) state.bunColors = saved.bunColors;
    if (saved.nextChoreId) state.nextChoreId = saved.nextChoreId;
  }

  var now = new Date();
  var today = todayDateString(now);
  var thisMonday = mondayOfWeek(now);

  // new calendar day since last use -> clear today's chore checkmarks/timers (fresh routine)
  if (state.lastActiveDate !== today) {
    state.done = {};
    state.timers = {};
    state.timerUI = {};
    state.lastActiveDate = today;
  }

  // new week -> reset each kid's weekly day-tracker and award flag (balance/jars carry over)
  Object.keys(KIDS).forEach(function (kidId) {
    var w = state.weekly[kidId];
    if (!w || w.weekStart !== thisMonday) {
      state.weekly[kidId] = { weekStart: thisMonday, days: { mon: false, tue: false, wed: false, thu: false, fri: false }, awarded: false };
    }
  });

  savePersisted();
}

function naturalPeriod() {
  var h = new Date().getHours();
  return (h >= 4 && h < 15) ? "morning" : "evening";
}
function currentPeriod() {
  return state.periodOverride || naturalPeriod();
}

/* ---------------- Lina's weekday extras: a rotating daily chore + homework (from her LIGHT chart) ---------------- */
var ROTATING_CHORES = [
  { label: "Wipe bathroom sink", minutes: 4, emoji: "\uD83E\uDDFD" }, // Monday
  { label: "Feed Luna",          minutes: 3, emoji: "\uD83D\uDC3E" }, // Tuesday
  { label: "Clean room",         minutes: 8, emoji: "\uD83E\uDDF9" }, // Wednesday
  { label: "Put away clothes",   minutes: 5, emoji: "\uD83E\uDDFA" }, // Thursday
  { label: "Water plants",       minutes: 3, emoji: "\uD83E\uDEB4" }  // Friday
];
function weekdayIndex() {
  var d = new Date().getDay(); // 0 Sun ... 6 Sat
  return (d >= 1 && d <= 5) ? d - 1 : -1; // 0..4 for Mon..Fri, -1 for weekend
}
function choresFor(kidId, period) {
  var base = state.customChores[kidId][period];
  var wIdx = weekdayIndex();
  if (kidId === "lina" && period === "evening" && wIdx >= 0) {
    var rotating = ROTATING_CHORES[wIdx];
    return base.concat([
      { id: "hw", label: "Homework", minutes: 20, emoji: "\uD83D\uDCDA", auto: true },
      { id: "dc" + wIdx, label: rotating.label, minutes: rotating.minutes, emoji: rotating.emoji, auto: true }
    ]);
  }
  return base;
}

function choreKey(kidId, period, choreId) {
  return kidId + "-" + period + "-" + choreId;
}
function ensureTimer(key, minutes) {
  if (!state.timers[key]) {
    state.timers[key] = { totalSeconds: minutes * 60, remainingSeconds: minutes * 60, running: false, endTimestamp: null };
  }
  return state.timers[key];
}
function formatClock(d) {
  var h = d.getHours();
  var m = d.getMinutes();
  var ampm = h >= 12 ? "PM" : "AM";
  h = h % 12 || 12;
  return h + ":" + (m < 10 ? "0" + m : m) + " " + ampm;
}
function formatClockParts(d) {
  var h = d.getHours();
  var m = d.getMinutes();
  var ampm = h >= 12 ? "PM" : "AM";
  h = h % 12 || 12;
  return { hm: h + ":" + (m < 10 ? "0" + m : m), ampm: ampm };
}

/* ---------------- sound ---------------- */
function playChime() {
  try {
    var ctx = new (window.AudioContext || window.webkitAudioContext)();
    var notes = [523.25, 659.25, 783.99];
    notes.forEach(function (freq, i) {
      var osc = ctx.createOscillator();
      var gain = ctx.createGain();
      osc.type = "sine";
      osc.frequency.value = freq;
      osc.connect(gain);
      gain.connect(ctx.destination);
      var start = ctx.currentTime + i * 0.09;
      gain.gain.setValueAtTime(0.0001, start);
      gain.gain.exponentialRampToValueAtTime(0.18, start + 0.02);
      gain.gain.exponentialRampToValueAtTime(0.0001, start + 0.35);
      osc.start(start);
      osc.stop(start + 0.4);
    });
  } catch (e) { /* audio unavailable, ignore */ }
}

/* A bigger, distinct fanfare for finishing the WHOLE routine — this is
   the peak moment of the experience (Peak-End Rule), so it should sound
   more triumphant than the routine per-chore chime. */
function playFanfare() {
  try {
    var ctx = new (window.AudioContext || window.webkitAudioContext)();
    var notes = [523.25, 659.25, 783.99, 1046.5, 1318.5]; // C5 E5 G5 C6 E6, rising
    notes.forEach(function (freq, i) {
      var osc = ctx.createOscillator();
      var gain = ctx.createGain();
      osc.type = "triangle";
      osc.frequency.value = freq;
      osc.connect(gain);
      gain.connect(ctx.destination);
      var start = ctx.currentTime + i * 0.1;
      gain.gain.setValueAtTime(0.0001, start);
      gain.gain.exponentialRampToValueAtTime(0.22, start + 0.03);
      gain.gain.exponentialRampToValueAtTime(0.0001, start + 0.5);
      osc.start(start);
      osc.stop(start + 0.55);
    });
    // little final chord for extra sparkle
    [1046.5, 1318.5, 1568].forEach(function (freq) {
      var osc = ctx.createOscillator();
      var gain = ctx.createGain();
      osc.type = "sine";
      osc.frequency.value = freq;
      osc.connect(gain);
      gain.connect(ctx.destination);
      var start = ctx.currentTime + notes.length * 0.1;
      gain.gain.setValueAtTime(0.0001, start);
      gain.gain.exponentialRampToValueAtTime(0.15, start + 0.03);
      gain.gain.exponentialRampToValueAtTime(0.0001, start + 0.7);
      osc.start(start);
      osc.stop(start + 0.75);
    });
  } catch (e) { /* audio unavailable, ignore */ }
}

/* A quick, playful "boop" for poking the bao in the play modal. */
function playPoke() {
  try {
    var ctx = new (window.AudioContext || window.webkitAudioContext)();
    var osc = ctx.createOscillator();
    var gain = ctx.createGain();
    osc.type = "sine";
    osc.frequency.setValueAtTime(280, ctx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(420, ctx.currentTime + 0.08);
    osc.connect(gain);
    gain.connect(ctx.destination);
    gain.gain.setValueAtTime(0.0001, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.2, ctx.currentTime + 0.02);
    gain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + 0.15);
    osc.start(ctx.currentTime);
    osc.stop(ctx.currentTime + 0.16);
  } catch (e) { /* audio unavailable, ignore */ }
}

/* ---------------- confetti (DOM-injected, independent of render cycle) ---------------- */
function spawnConfetti(containerEl) {
  if (!containerEl) return;
  var wrap = document.createElement("div");
  wrap.className = "confetti-wrap";
  var colors = ["#FF9B42", "#FFD166", "#5B7FFF", "#7DD8C6", "#FF6B6B"];
  for (var i = 0; i < 14; i++) {
    var span = document.createElement("span");
    span.className = "confetti-piece";
    var left = Math.random() * 100;
    var delay = Math.random() * 0.2;
    var dur = 0.7 + Math.random() * 0.5;
    var color = colors[i % colors.length];
    span.style.left = left + "%";
    span.style.background = color;
    span.style.borderRadius = (i % 2) ? "50%" : "2px";
    span.style.animation = "fall " + dur + "s ease-in " + delay + "s forwards";
    wrap.appendChild(span);
  }
  containerEl.appendChild(wrap);
  setTimeout(function () { if (wrap.parentNode) wrap.parentNode.removeChild(wrap); }, 1200);
}

/* A bigger burst for the "all done!" moment — more pieces, wider spread,
   longer fall, since this is the peak celebration of the whole routine. */
function spawnBigConfetti(containerEl) {
  if (!containerEl) return;
  var wrap = document.createElement("div");
  wrap.className = "confetti-wrap";
  wrap.style.borderRadius = "16px";
  var colors = ["#FF9B42", "#FFD166", "#5B7FFF", "#7DD8C6", "#FF6B6B", "#BDEFC9", "#FFC9DE"];
  for (var i = 0; i < 34; i++) {
    var span = document.createElement("span");
    span.className = "confetti-piece";
    var left = Math.random() * 100;
    var delay = Math.random() * 0.35;
    var dur = 1.0 + Math.random() * 0.7;
    var size = 6 + Math.random() * 6;
    var color = colors[i % colors.length];
    span.style.left = left + "%";
    span.style.width = size + "px";
    span.style.height = size + "px";
    span.style.background = color;
    span.style.borderRadius = (i % 2) ? "50%" : "2px";
    span.style.animation = "fall " + dur + "s ease-in " + delay + "s forwards";
    wrap.appendChild(span);
  }
  containerEl.appendChild(wrap);
  setTimeout(function () { if (wrap.parentNode) wrap.parentNode.removeChild(wrap); }, 2000);
}

/* ---------------- icons (small hand-drawn SVGs, no library needed) ---------------- */
function svgOpen(size, color, filled) {
  if (filled) return '<svg width="' + size + '" height="' + size + '" viewBox="0 0 24 24" fill="' + (color || "currentColor") + '">';
  return '<svg width="' + size + '" height="' + size + '" viewBox="0 0 24 24" fill="none" stroke="' + (color || "currentColor") + '" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">';
}
function iconSun(size, color) {
  return '<svg width="' + size + '" height="' + size + '" viewBox="0 0 24 24" fill="' + (color || "currentColor") + '" stroke="' + (color || "currentColor") + '" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">' +
    '<circle cx="12" cy="12" r="4.2"/><g fill="none">' +
    '<path d="M12 2v2.4M12 19.6v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2.4M19.6 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></g></svg>';
}
function iconMoon(size, color) {
  return svgOpen(size, color, true) + '<path d="M20 14.5A8.5 8.5 0 019.5 4 8.5 8.5 0 1020 14.5z"/></svg>';
}
function iconCheckCircle(size, color) {
  return svgOpen(size, color) + '<circle cx="12" cy="12" r="9"/><path d="M8.5 12.5l2.5 2.5 5-5"/></svg>';
}
function iconCircle(size, color) {
  return svgOpen(size, color) + '<circle cx="12" cy="12" r="9"/></svg>';
}
function iconPlay(size, color) {
  return svgOpen(size, color, true) + '<path d="M6 4l14 8-14 8V4z"/></svg>';
}
function iconPause(size, color) {
  return svgOpen(size, color, true) + '<rect x="6" y="4" width="4" height="16" rx="1"/><rect x="14" y="4" width="4" height="16" rx="1"/></svg>';
}
function iconReset(size, color) {
  return svgOpen(size, color) + '<path d="M3 12a9 9 0 109-9 9 9 0 00-6.7 3"/><path d="M3 4v5h5"/></svg>';
}
function iconLock(size, color) {
  return svgOpen(size, color) + '<rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V7a4 4 0 018 0v4"/></svg>';
}
function iconUnlock(size, color) {

/* ---------------- mascots: little bao bun characters ---------------- */
function bunFace(bodyColor, pleatColor, blushColor, mood) {
  var pleatLines = "";
  var n = 9;
  for (var i = 0; i < n; i++) {
    var frac = (i - (n - 1) / 2) / ((n - 1) / 2); // -1..1
    var theta = frac * 1.15; // ~66 degree spread each side
    var ex = 50 + 32 * Math.sin(theta);
    var ey = 58 - 29 * Math.cos(theta);
    var cx1 = 50 + 12 * Math.sin(theta);
    var cy1 = 28 + 5 * (1 - Math.cos(theta));
    pleatLines += '<path d="M50,24 Q' + cx1.toFixed(1) + ',' + cy1.toFixed(1) + ' ' + ex.toFixed(1) + ',' + ey.toFixed(1) + '" stroke="' + pleatColor + '" stroke-width="1.6" fill="none" stroke-linecap="round" opacity="0.75"/>';
  }
  var mouth = (mood === "happy")
    ? '<path d="M41 66 Q50 74 59 66" stroke="#3a2e2e" stroke-width="2.6" fill="none" stroke-linecap="round"/>'
    : '<path d="M43 67 Q50 71 57 67" stroke="#3a2e2e" stroke-width="2.6" fill="none" stroke-linecap="round"/>';

  var eyes, zzz = "";
  if (mood === "sleepy") {
    // closed, drowsy curved eyes instead of open dots
    eyes = '<path d="M32 57 Q37 61 42 57" stroke="#3a2e2e" stroke-width="2.4" fill="none" stroke-linecap="round"/>' +
      '<path d="M58 57 Q63 61 68 57" stroke="#3a2e2e" stroke-width="2.4" fill="none" stroke-linecap="round"/>';
    zzz = '<text x="74" y="30" font-family="\'Baloo 2\',sans-serif" font-weight="800" font-size="13" fill="' + pleatColor + '" opacity="0.85">z</text>' +
      '<text x="80" y="22" font-family="\'Baloo 2\',sans-serif" font-weight="800" font-size="10" fill="' + pleatColor + '" opacity="0.7">z</text>';
  } else {
    eyes = '<circle cx="37" cy="58" r="5.2" fill="#3a2e2e"/>' +
      '<circle cx="63" cy="58" r="5.2" fill="#3a2e2e"/>' +
      '<circle cx="38.3" cy="56.3" r="1.4" fill="#fff"/>' +
      '<circle cx="64.3" cy="56.3" r="1.4" fill="#fff"/>';
  }

  return '<path d="M14,58 C14,32 30,25 50,25 C70,25 86,32 86,58 C86,80 70,88 50,88 C30,88 14,80 14,58 Z" fill="' + bodyColor + '"/>' +
    '<ellipse cx="40" cy="38" rx="15" ry="9" fill="#ffffff" opacity="0.2"/>' +
    '<g>' + pleatLines + '</g>' +
    '<circle cx="50" cy="24" r="2.6" fill="' + pleatColor + '"/>' +
    eyes +
    '<ellipse cx="28" cy="67" rx="6" ry="4" fill="' + blushColor + '" opacity="0.6"/>' +
    '<ellipse cx="72" cy="67" rx="6" ry="4" fill="' + blushColor + '" opacity="0.6"/>' +
    mouth + zzz;
}

/* Narrative thread: the bun's expression reflects the moment — bright
   and awake in the morning, drowsy by evening, delighted once the
   routine is actually finished. */
function moodForKid(kId, isMorningNow) {
  var period = isMorningNow ? "morning" : "evening";
  var kidChores = choresFor(kId, period);
  var kidAllDone = kidChores.length > 0 && kidChores.every(function (c) { return !!state.done[choreKey(kId, period, c.id)]; });
  if (kidAllDone) return "happy";
  return isMorningNow ? "idle" : "sleepy";
}

      '<div style="font-family:\'Nunito\',sans-serif;font-weight:700;font-size:12.5px;color:#8a7f7f;margin-top:10px">Unallocated: $' + unallocated.toFixed(2) + ' of $' + balance.toFixed(2) + '</div>';

    if (state.parentMode) {
      html += '<div style="display:flex;align-items:center;gap:12px;margin-top:14px;background:#3a2e2e0d;border:1px dashed #c9c2c2;border-radius:16px;padding:10px 12px">' +
        '<div style="flex:1">' +
        '<div style="font-family:\'Baloo 2\',sans-serif;font-weight:700;font-size:13px;color:#3a2e2e">Parent: adjust total balance</div>' +
        '<div style="font-family:\'Nunito\',sans-serif;font-weight:800;font-size:16px;color:#3a2e2e">$' + balance.toFixed(2) + '</div>' +
        '</div>' +
        '<button class="timer-btn" data-action="balance-adj" data-kid="' + kidId + '" data-amount="-1" style="background:#ffffffcc;color:#3a2e2e" aria-label="Subtract one dollar">\u2212</button>' +
        '<button class="timer-btn" data-action="balance-adj" data-kid="' + kidId + '" data-amount="1" style="background:#3a2e2e;color:white" aria-label="Add one dollar">+</button>' +
        '</div>';
    }

    jarDefs.forEach(function (jd) {
      var amt = jars[jd.key];
      html += '<div style="display:flex;align-items:center;gap:12px;margin-top:14px;background:' + jd.color + '18;border-radius:16px;padding:10px 12px">' +
        '<div style="font-size:26px">' + jd.emoji + '</div>' +
        '<div style="flex:1">' +
        '<div style="font-family:\'Baloo 2\',sans-serif;font-weight:700;font-size:14px;color:#3a2e2e">' + jd.label + '</div>' +
        '<div style="font-family:\'Nunito\',sans-serif;font-weight:800;font-size:18px;color:' + jd.color + '">$' + amt.toFixed(2) + '</div>' +
        '</div>' +
        '<button class="timer-btn" data-action="jar-dec" data-kid="' + kidId + '" data-jar="' + jd.key + '" style="background:#ffffffcc;color:#3a2e2e" aria-label="Remove one dollar from ' + jd.label + '">\u2212</button>' +
        '<button class="timer-btn" data-action="jar-inc" data-kid="' + kidId + '" data-jar="' + jd.key + '" style="background:' + jd.color + ';color:white" aria-label="Add one dollar to ' + jd.label + '">+</button>' +
        '</div>';
    });

    html += '<div style="margin-top:16px;font-family:\'Nunito\',sans-serif;font-size:11.5px;color:#b0a8a8;text-align:center">Move a dollar at a time into Give, Save, or Spend.</div>' +
      '</div></div>';
  }

  return html;
}

function render() {
  var squishSwitcherKid = state.squishSwitcher;
  state.squishSwitcher = null;
  var squishBannerKid = state.squishBanner;
  state.squishBanner = null;
  var celebrateKid = state.celebrateKid;
  state.celebrateKid = null;
  var pokeBaoKid = state.pokeBao;
  state.pokeBao = null;

  var period = currentPeriod();
  state.lastRenderedPeriod = period;
  var isMorning = period === "morning";

  var sky = isMorning
    ? "linear-gradient(180deg, #FFE5A3 0%, #FFB683 45%, #FF9B7A 100%)"
    : "linear-gradient(180deg, #1B2A6B 0%, #3B3F8C 55%, #6B5B95 100%)";
  var textOnSky = isMorning ? "#5A3A1A" : "#EAE6FF";
  document.body.style.background = sky;

  var periodIconHtml = isMorning ? iconSun(24, "#FFDE7A") : iconMoon(21, "#EAE6FF");
  var clockParts = formatClockParts(new Date());
  var clockGlow = isMorning ? "#FF9B4266" : "#7DD8C666";
  var isFullscreen = !!document.fullscreenElement;

  var html = "";
  html += '<div class="row-between shared-header">' +
    '<div style="width:36px"></div>' + // spacer so the clock stays visually centered
    '<div class="clock-el" data-clock-el style="display:inline-flex;align-items:baseline;gap:8px;background:#00000020;padding:12px 24px;border-radius:20px;box-shadow:inset 0 2px 6px rgba(0,0,0,0.18)">' +
    '<span class="clock-time" data-clock-time style="font-family:\'Courier New\',monospace;font-weight:800;font-size:52px;color:' + textOnSky + ';letter-spacing:1px;text-shadow:0 0 16px ' + clockGlow + '">' + clockParts.hm + '</span>' +
    '<span class="clock-ampm" data-clock-ampm style="font-family:\'Nunito\',sans-serif;font-weight:800;font-size:16px;color:' + textOnSky + ';opacity:0.75">' + clockParts.ampm + '</span>' +
    '</div>' +
    '<button class="lock-btn" data-action="toggle-fullscreen" style="color:' + textOnSky + '" aria-label="' + (isFullscreen ? "Exit full screen" : "Enter full screen") + '">' +
    (isFullscreen ? iconCompress(18) : iconExpand(18)) + '</button>' +
    '</div>';

  html += '<div class="kid-grid">';
  Object.keys(KIDS).forEach(function (id) {
    var active = state.kidId === id;
    html += '<div class="kid-piece' + (active ? " active" : "") + '" data-kid="' + id + '">' +
      renderKidChores(id, textOnSky, isMorning, squishSwitcherKid, squishBannerKid, celebrateKid, pokeBaoKid) +
      '</div>';
  });
  Object.keys(KIDS).forEach(function (id) {
    var active = state.kidId === id;
    html += '<div class="kid-piece' + (active ? " active" : "") + '" data-kid="' + id + '">' +
      renderKidBalance(id) +
      '</div>';
  });
  html += '</div>';

  // footer: parent mode lives here now, tucked out of the way of the kids' view
  html += '<div class="row-between" style="margin-top:20px;opacity:0.85">' +
    '<div style="font-family:\'Nunito\',sans-serif;font-weight:700;font-size:11px;color:' + textOnSky + ';opacity:0.6">Bao Buddy</div>' +
    '<div class="row" style="gap:8px">' +
    (state.parentMode
      ? '<button class="lock-btn" data-action="toggle-period-preview" aria-label="Switch between morning and evening (parent check-in)">' + periodIconHtml + '</button>'
      : '') +
    '<button class="lock-btn" data-action="toggle-parent" style="color:' + textOnSky + '" aria-label="Toggle parent mode">' + (state.parentMode ? iconUnlock(16) : iconLock(16)) + '</button>' +
    '</div>' +
    '</div>';

  document.getElementById("root").innerHTML = html;
}

/* ---------------- actions ---------------- */
function checkWeeklyAward(kidId) {
  var now = new Date();
  var todayKey = isoWeekdayKey(now);
  if (!todayKey) return; // weekend, no weekday tracking

  // has the kid finished every chore across BOTH morning and evening today?
  var morning = choresFor(kidId, "morning");
  var evening = choresFor(kidId, "evening");
  var morningDone = morning.every(function (c) { return !!state.done[choreKey(kidId, "morning", c.id)]; });
  var eveningDone = evening.every(function (c) { return !!state.done[choreKey(kidId, "evening", c.id)]; });
  if (!morningDone || !eveningDone) return;

  var w = state.weekly[kidId];
  if (w.days[todayKey]) return; // already recorded today
  w.days[todayKey] = true;

  var allDaysDone = WEEKDAY_KEYS.every(function (k) { return w.days[k]; });
  if (allDaysDone && !w.awarded) {
    w.awarded = true;
    state.balance[kidId] += 2;
  }
  savePersisted();
}

function completeChore(kidId, period, choreId) {
  var key = choreKey(kidId, period, choreId);
  var chores = choresFor(kidId, period);
  var wasAllDone = chores.every(function (c) { return !!state.done[choreKey(kidId, period, c.id)]; });

  state.done[key] = true;
  if (state.timers[key]) { state.timers[key].running = false; }

  var isAllDoneNow = chores.every(function (c) { return !!state.done[choreKey(kidId, period, c.id)]; });
  var justFinishedRoutine = isAllDoneNow && !wasAllDone;

  if (justFinishedRoutine) {
    playFanfare();
    state.celebrateKid = kidId;
  } else {
    playChime();
  }
  checkWeeklyAward(kidId);
  render();

  var card = document.querySelector('[data-chorekey="' + key + '"]');
  spawnConfetti(card);
  if (justFinishedRoutine) {
    var banner = document.querySelector('[data-all-done-banner="' + kidId + '"]');
    if (banner) spawnBigConfetti(banner);
  }
}

document.getElementById("root").addEventListener("click", function (e) {
  var el = e.target.closest("[data-action]");
  if (!el) return;
  var action = el.dataset.action;
  var key = el.dataset.key;

  if (action === "select-kid") {
    state.kidId = el.dataset.kid;
    state.accountOpenFor = null;
    state.playModalFor = null;
    state.squishSwitcher = el.dataset.kid;
    render();
  } else if (action === "squish-switcher") {
    state.squishSwitcher = el.dataset.kid;
    render();
  } else if (action === "squish-banner") {
    state.squishBanner = el.dataset.kid;
    state.playModalFor = el.dataset.kid;
    render();
  } else if (action === "close-play-modal") {
    state.playModalFor = null;
    render();
  } else if (action === "poke-bao") {
    state.pokeBao = el.dataset.kid;
    playPoke();
    render();
  } else if (action === "bun-color") {
    var colorKid = el.dataset.kid;
    var colorIndex = parseInt(el.dataset.colorIndex, 10);
    state.bunColors[colorKid] = BUN_PALETTE[colorIndex];
    savePersisted();
    render();
  } else if (action === "toggle-parent") {
    state.parentMode = !state.parentMode;
    render();
  } else if (action === "toggle-fullscreen") {
    try {
      if (!document.fullscreenElement && document.documentElement.requestFullscreen) {
        document.documentElement.requestFullscreen().catch(function () {});
      } else if (document.fullscreenElement && document.exitFullscreen) {
        document.exitFullscreen().catch(function () {});
      }
    } catch (e) { /* fullscreen unsupported or blocked, ignore */ }
  } else if (action === "toggle-period-preview") {
    state.periodOverride = state.periodOverride ? null : (naturalPeriod() === "morning" ? "evening" : "morning");
    render();
  } else if (action === "open-account") {
    state.accountOpenFor = el.dataset.kid;
    render();
  } else if (action === "close-account") {
    state.accountOpenFor = null;
    render();
  } else if (action === "jar-inc" || action === "jar-dec") {
    var jarKidId = el.dataset.kid;
    var jarName = el.dataset.jar;
    var jars = state.jars[jarKidId];
    var totalBalance = state.balance[jarKidId];
    var allocatedNow = jars.give + jars.save + jars.spend;
    if (action === "jar-inc") {
      if (allocatedNow < totalBalance) jars[jarName] += 1;
    } else {
      if (jars[jarName] > 0) jars[jarName] -= 1;
    }
    savePersisted();
    render();
  } else if (action === "balance-adj") {
    if (!state.parentMode) return; // safety: only parents can adjust the total
    var adjKidId = el.dataset.kid;
    var amount = parseInt(el.dataset.amount, 10);
    var adjJars = state.jars[adjKidId];
    var floor = adjJars.give + adjJars.save + adjJars.spend; // can't drop below what's already in the jars
    var newBalance = state.balance[adjKidId] + amount;
    state.balance[adjKidId] = Math.max(floor, newBalance);
    savePersisted();
    render();
  } else if (action === "chore-move-up" || action === "chore-move-down") {
    if (!state.parentMode) return;
    var mvKid = el.dataset.kid, mvPeriod = el.dataset.period, mvId = el.dataset.choreid;
    var list = state.customChores[mvKid][mvPeriod];
    var i = list.findIndex(function (c) { return c.id === mvId; });
    if (i < 0) return;
    var j = action === "chore-move-up" ? i - 1 : i + 1;
    if (j < 0 || j >= list.length) return;
    var tmp = list[i]; list[i] = list[j]; list[j] = tmp;
    savePersisted();
    render();
  } else if (action === "chore-delete") {
    if (!state.parentMode) return;
    var delKid = el.dataset.kid, delPeriod = el.dataset.period, delId = el.dataset.choreid;
    var delList = state.customChores[delKid][delPeriod];
    var delIdx = delList.findIndex(function (c) { return c.id === delId; });
    if (delIdx >= 0) delList.splice(delIdx, 1);
    savePersisted();
    render();
  } else if (action === "chore-add") {
    if (!state.parentMode) return;
    var addKid = el.dataset.kid, addPeriod = el.dataset.period;
    var idBase = "chore-add-" + addKid + "-" + addPeriod;
    var emojiEl = document.getElementById(idBase + "-emoji");
    var labelEl = document.getElementById(idBase + "-label");
    var minutesEl = document.getElementById(idBase + "-minutes");
    var label = (labelEl.value || "").trim();
    if (!label) { labelEl.focus(); return; }
    var minutes = parseInt(minutesEl.value, 10);
    if (!minutes || minutes < 1) minutes = 5;
    var emoji = (emojiEl.value || "").trim() || "\u2B50";
    var newChore = { id: "c" + state.nextChoreId, label: label, minutes: minutes, emoji: emoji };
    state.nextChoreId += 1;
    state.customChores[addKid][addPeriod].push(newChore);
    savePersisted();
    render();
  } else if (action === "toggle-timer-ui") {
    state.timerUI[key] = !state.timerUI[key];
    render();
  } else if (action === "timer-toggle-run") {
    var t = state.timers[key];
    if (!t) return;
    if (t.running) {
      t.remainingSeconds = Math.max(0, Math.round((t.endTimestamp - Date.now()) / 1000));
      t.running = false;
    } else {
      t.endTimestamp = Date.now() + t.remainingSeconds * 1000;
      t.running = true;
    }
    render();
  } else if (action === "timer-reset") {
    var t2 = state.timers[key];
    if (!t2) return;
    t2.running = false;
    t2.remainingSeconds = t2.totalSeconds;
    render();
  } else if (action === "toggle-done") {
    var parts = key.split("-");
    var kidId = parts[0], period = parts[1], choreId = parts[2];
    var wasDone = !!state.done[key];
    if (wasDone) {
      state.done[key] = false;
      render();
    } else {
      completeChore(kidId, period, choreId);
    }
  }
});

/* ---------------- ticker: updates clock + running timers without a full re-render ---------------- */
setInterval(function () {
  // clock (there's one instance per visible kid column)
  var parts = formatClockParts(new Date());
  document.querySelectorAll("[data-clock-time]").forEach(function (el) {
    if (el.textContent !== parts.hm) el.textContent = parts.hm;
  });
  document.querySelectorAll("[data-clock-ampm]").forEach(function (el) {
    if (el.textContent !== parts.ampm) el.textContent = parts.ampm;
  });

  // auto period switch (rare — only matters right around the morning/evening boundary)
  if (!state.periodOverride && naturalPeriod() !== state.lastRenderedPeriod) {
    render();
    return;
  }

  // running timers
  Object.keys(state.timers).forEach(function (key) {
    var t = state.timers[key];
    if (!t.running) return;
    var remaining = Math.max(0, Math.round((t.endTimestamp - Date.now()) / 1000));
    if (remaining !== t.remainingSeconds) {
      t.remainingSeconds = remaining;
      var timeEl = document.getElementById("time-" + key);
      var ringEl = document.getElementById("ring-" + key);
      if (timeEl) {
        var mm = Math.floor(remaining / 60), ss = remaining % 60;
        timeEl.textContent = mm + ":" + (ss < 10 ? "0" + ss : ss);
      }
      if (ringEl) {
        var circumference = 2 * Math.PI * 18;
        var pct = 1 - remaining / t.totalSeconds;
        ringEl.setAttribute("stroke-dashoffset", circumference * (1 - pct));
      }
    }
    if (remaining <= 0) {
      var parts = key.split("-");
      completeChore(parts[0], parts[1], parts[2]);
    }
  });
}, 500);

document.addEventListener("fullscreenchange", function () { render(); });

initPersistence();
render();
</script>
