<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Red Thread — Prototype</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="icon" href="favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#0b0b0d">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;0,900;1,400;1,700;1,900&family=IBM+Plex+Mono:wght@400;600&family=Inter:wght@500;700;800&family=Special+Elite&family=Cormorant+Garamond:ital,wght@0,500;0,700;1,500&family=UnifrakturMaguntia&family=Homemade+Apple&family=Mrs+Saint+Delafield&family=Cinzel:wght@600;800&family=Old+Standard+TT:ital@0;1&display=swap">
<style>
/* VOICE: a noir party game, tense but playful
   IDEA: a case file passed around a table; the murder board is the shared heart
   PICTURE: each screen is the working game itself (lobby, files, board, lineup)
   COLOUR and TYPE: black, smoke, paper white; red string, amber lamp light, one colour per player; Playfair italic, Plex Mono, Inter
   LAYOUT: phone column with a bottom tab bar during play */
:root{color-scheme:dark;--bg:#0B0B0D;--panel:#151518;--line:#34343A;--ink:#ECE8DF;--mute:#A3A3AA;--red:#FF3B4E;--btn:#E3263A;--amber:#FFC23D;--paper:#ECE8DF;--pink:#141414}
*{box-sizing:border-box;min-width:0}
html,body{margin:0;height:100%;background:#050506}
body{color:var(--ink);font:15px/1.5 Inter,system-ui,sans-serif;display:flex;justify-content:center;overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
button:focus-visible,a:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
a{color:inherit}
#app{position:relative;width:100%;max-width:440px;height:100svh;background:var(--bg);display:flex;flex-direction:column;overflow:hidden}
.scr{flex:1;display:flex;flex-direction:column;gap:14px;padding:18px 16px 16px;overflow-y:auto;min-height:0}
.serif{font-family:'Playfair Display',serif}.mono{font-family:'IBM Plex Mono',monospace}
h1,h2,h3{margin:0}
.big{font:italic 900 64px/.92 'Playfair Display',serif;letter-spacing:-2px}
.big span{color:var(--red)}
.lbl{font:12px 'IBM Plex Mono',monospace;letter-spacing:3px;color:var(--mute)}
.amber{color:var(--amber)}
.noir{position:relative;background:radial-gradient(ellipse at 50% 38%,#26262b 0%,#0b0b0d 62%)}
.noir::before{content:"";position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(-22deg,rgba(0,0,0,.25) 0 16px,transparent 16px 34px),radial-gradient(ellipse at 78% 8%,rgba(235,235,240,.08),transparent 55%)}
.noir>*{position:relative}
.cz{font-family:Cinzel,serif;font-weight:800;letter-spacing:4px}
.kick{font:700 12px 'Playfair Display',serif;letter-spacing:4px;color:#BDB8AE}
.back{width:44px;height:44px;border:1px solid #3a3a40;background:rgba(11,11,13,.6);border-radius:50%;font-size:20px;line-height:1;display:flex;align-items:center;justify-content:center;flex:none}
.hhead{position:relative;display:flex;flex-direction:column;align-items:center;gap:6px;padding-top:2px}
.hhead .back{position:absolute;left:0;top:0;z-index:3}
.hlogo{zoom:.42;pointer-events:none}
.hlogo .tblock{margin-top:0!important}
.hhead .kick.hk{text-align:center;margin-top:14px}
.hhead{margin-bottom:6px}
.mini{display:flex;flex-direction:column;align-items:flex-start;font:900 19px/.92 'Playfair Display',serif;letter-spacing:.5px;margin-top:3px}.mini span{color:#F2EEE6;text-shadow:1px 1px 0 #a19c92,2px 2px 0 #68655d,3px 3px 0 #33312c,4px 6px 8px rgba(0,0,0,.8)}.mini span+span{color:var(--red);font-size:15px;margin-top:3px;letter-spacing:1px;text-shadow:1px 1px 0 #b72535,2px 2px 0 #821a26,3px 3px 0 #501017,4px 6px 8px rgba(0,0,0,.8)}
.kick.hk{font:600 11px Cinzel,serif;letter-spacing:5px}
.cbtn{min-height:58px;width:100%;border:0;background:#F2EEE6;color:#0b0b0d;font:900 17px 'Playfair Display',serif;letter-spacing:4px;display:flex;align-items:center;justify-content:center}
.cbtn:disabled{background:#2a2a2e;color:#8a8a90;cursor:default}
.ticket{position:relative;background:#F2EEE6;color:#0b0b0d;padding:16px 18px 14px;text-align:center;box-shadow:0 18px 36px rgba(0,0,0,.7);transform:rotate(-1.2deg);-webkit-mask:radial-gradient(circle 10px at 0 50%,#0000 98%,#000) left/51% 100% no-repeat,radial-gradient(circle 10px at 100% 50%,#0000 98%,#000) right/51% 100% no-repeat;mask:radial-gradient(circle 10px at 0 50%,#0000 98%,#000) left/51% 100% no-repeat,radial-gradient(circle 10px at 100% 50%,#0000 98%,#000) right/51% 100% no-repeat}
.ticket .rc{font:900 64px/1.15 'Playfair Display',serif;margin-bottom:2px;letter-spacing:14px;margin-right:-14px}
.ticket small{display:block;font:400 14px 'Playfair Display',serif;color:#4A4740}
.seg{display:grid;grid-template-columns:1fr 1fr;border:1px solid #4a4a50}
.seg button{background:none;border:0;min-height:64px;padding:8px 10px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;color:#BDB8AE}
.seg button+button{border-left:1px solid #4a4a50}
.seg button b{font:900 15px 'Playfair Display',serif;letter-spacing:2px;color:inherit}
.seg button small{font:400 12px 'Playfair Display',serif}
.seg button[aria-pressed=true]{background:#F2EEE6;color:#0b0b0d}
.det{display:flex;align-items:center;gap:12px;min-height:50px;border-bottom:1px solid #2c2c31}
.det .pin{width:14px;height:14px;border-radius:50%;flex:none;box-shadow:inset -2px -2px 0 rgba(0,0,0,.3),0 2px 4px rgba(0,0,0,.6)}
.det b{font:900 21px 'Playfair Display',serif}
.det em{margin-left:auto;font:700 11px 'Playfair Display',serif;letter-spacing:3px;font-style:normal;color:#8f8f96}
.det.open{color:#6f6f76}.det.open .pin{background:none;border:1.5px dashed #5a5a60;box-shadow:none}
.boxes{position:relative;display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.boxes span{height:82px;border:1.5px solid #6b6b72;background:rgba(11,11,13,.7);display:flex;align-items:center;justify-content:center;font:900 52px 'Playfair Display',serif;color:#F2EEE6}
.boxes span.on{border-color:#F2EEE6;box-shadow:0 0 0 1px #F2EEE6}
.boxes input{position:absolute;inset:0;width:100%;opacity:0;font-size:16px;text-transform:uppercase}
.field{width:100%;min-height:56px;background:rgba(11,11,13,.7);border:1.5px solid #6b6b72;color:#F2EEE6;font:900 24px 'Playfair Display',serif;padding:0 14px}
.field:focus{outline:none;border-color:#F2EEE6}
.tipC{flex:none;padding:6px 0 4px;height:214px;display:flex;flex-direction:column}
.tCrow{display:flex;align-items:center;margin-bottom:14px}
.tCrow i{flex:1;height:2px;background:#3a3a40}
.tCpin{padding:0;cursor:pointer;position:relative;width:28px;height:28px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;font:900 13px 'Playfair Display',serif;color:#F2EEE6;border:1.5px solid #3a3a40;background:#3a3a40}
.tCpin::after{content:"";position:absolute;inset:-8px}
.tCpin:not(.on):hover{border-color:#F2EEE6;color:#F2EEE6}
.tCpin.done{}
.tCpin.on{background:var(--red);color:#fff;border-color:var(--red);box-shadow:0 0 14px rgba(255,59,78,.6)}
.tCrow .tCpin.done+i{background:var(--red);box-shadow:0 0 6px rgba(255,59,78,.6)}
.tipC h3{font:900 30px/1.02 'Playfair Display',serif;margin:0 0 6px;color:#F2EEE6}
.tipC p{margin:0;font:400 16px/1.45 'Playfair Display',serif;color:#BDB8AE;flex:1}
.tipC button{align-self:flex-start;margin-top:8px;background:none;border:0;padding:8px 0;font:600 12px Cinzel,serif;letter-spacing:3px;color:var(--red);text-transform:uppercase;cursor:pointer}
.tipA{position:relative;flex:none;margin-top:8px;height:232px;display:flex;flex-direction:column;background:#F2EEE6;color:#0b0b0d;padding:22px 18px 16px;transform:rotate(-1.2deg);box-shadow:0 16px 30px rgba(0,0,0,.65);background-image:repeating-linear-gradient(180deg,transparent 0 25px,rgba(90,140,200,.25) 25px 26px),linear-gradient(180deg,transparent 0 40px,rgba(255,59,78,.5) 40px 41.5px,transparent 41.5px);font-family:'Special Elite',monospace}
.tpin{position:absolute;left:50%;top:-8px;margin-left:-8px;width:16px;height:16px;border-radius:50%;background:var(--red);box-shadow:inset -3px -3px 0 rgba(0,0,0,.3),0 3px 6px rgba(0,0,0,.6)}
.tAhead{display:flex;justify-content:space-between;align-items:center;font:13px 'Special Elite',monospace;letter-spacing:2px;color:#4A4740}
.tAhead button{background:none;border:0;font:13px 'Special Elite',monospace;letter-spacing:2px;color:#b3202e;padding:10px 0 10px 16px;margin:-10px 0}
.tipA h3{font:24px/1.1 'Special Elite',monospace;margin:12px 0 4px;text-decoration:underline;text-decoration-color:var(--red);text-underline-offset:4px}
.tipA p{margin:0;font:15px/26px 'Special Elite',monospace;color:#2e2c28;flex:1;overflow:hidden}
.tdots{display:flex;gap:5px}.tdots i{width:7px;height:7px;border-radius:50%;background:#cfc8b8}.tdots i.on{background:var(--red)}
.tnext{align-self:flex-end;display:flex;align-items:center;gap:8px;min-height:40px;margin-top:6px;padding:0 14px;border:1.5px solid #0b0b0d;background:#0b0b0d;color:#F2EEE6;font:13px 'Special Elite',monospace;letter-spacing:2px;cursor:pointer}
.tnext b{font:16px monospace;color:var(--red)}
.tip{background:rgba(11,11,13,.72);color:#F2EEE6;padding:16px 18px;border:1px solid #3a3a40;border-left:3px solid var(--red)}
.bf{scrollbar-width:none}
.bftab{flex:none;overflow:visible;min-height:auto}.bftab .rv{animation:none;opacity:1;transform:none}.bftab .bfhero{height:230px}
.bfsheet{margin:-18px -16px -18px;flex:none;overflow:visible;border-radius:12px 12px 0 0}.bfsheet .rv{animation:none;opacity:1;transform:none}.bfsheet .bfhero{height:240px}
.bfhero{position:relative;height:min(46svh,380px);flex:none;overflow:hidden}
.bfhero img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:40% 40%;filter:grayscale(1) contrast(1.1) brightness(.85);-webkit-mask-image:linear-gradient(180deg,#000 45%,transparent 100%);mask-image:linear-gradient(180deg,#000 45%,transparent 100%)}
.bfhero::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(11,11,13,.7) 0,transparent 25%,transparent 50%,rgba(11,11,13,.55) 80%,rgba(11,11,13,0) 100%)}
.bftop{position:absolute;z-index:2;left:20px;right:20px;top:18px;display:flex;justify-content:space-between}
.bftitle{position:absolute;z-index:2;left:20px;right:20px;bottom:10px}
.bftitle h1{font:900 50px/.92 'Playfair Display',serif;letter-spacing:-1px;color:#F2EEE6;margin:6px 0 0;text-shadow:0 4px 22px rgba(0,0,0,.85)}
.bfbody{position:relative;padding:14px 20px 24px;display:flex;flex-direction:column;gap:20px}
.bfvic{display:flex;gap:18px;align-items:center}
.polaroid{position:relative;margin:4px 0 0;flex:none;width:108px;background:#F2EEE6;padding:7px 7px 0;transform:rotate(-4deg);box-shadow:0 14px 26px rgba(0,0,0,.7)}
.polaroid img{display:block;width:100%;aspect-ratio:4/5;object-fit:cover;object-position:top;filter:grayscale(1)}
.polaroid figcaption{font:700 12px 'Playfair Display',serif;color:#0b0b0d;text-align:center;padding:6px 0 7px}
.ppin{position:absolute;z-index:1;left:50%;top:-7px;width:15px;height:15px;margin-left:-7px;border-radius:50%;background:var(--red);box-shadow:inset -3px -3px 0 rgba(0,0,0,.3),0 3px 6px rgba(0,0,0,.6)}
.bfvic h2{font:900 26px/1.05 'Playfair Display',serif;color:#F2EEE6;margin:4px 0 6px}
.bfvic p{margin:0;font:400 15px/1.45 'Playfair Display',serif;color:#BDB8AE}
.bffacts{list-style:none;margin:0;padding:0;border-top:1px solid #2c2c31}
.bffacts li{display:flex;align-items:baseline;gap:12px;min-height:46px;border-bottom:1px solid #2c2c31;padding-top:12px}
.bffacts b{width:76px;flex:none;font:700 11px 'Playfair Display',serif;letter-spacing:3px;color:#8f8f96;text-transform:uppercase}
.bffacts span{font:900 19px 'Playfair Display',serif;color:#F2EEE6}
.bfquote{margin:0;border-left:3px solid var(--red);padding:2px 0 2px 16px}
.bfquote q{display:block;margin-top:6px;font:italic 900 30px/1.08 'Playfair Display',serif;color:#F2EEE6;quotes:"“" "”"}
.bfnext{display:flex;gap:14px;align-items:center;background:rgba(11,11,13,.72);border:1px solid #3a3a40;padding:12px}
.bfnext img{width:58px;height:58px;flex:none;object-fit:cover;object-position:top;filter:grayscale(1);border-radius:50%;border:2px solid #B48CFF}
.bfnext p{margin:0;font:400 15px/1.45 'Playfair Display',serif;color:#BDB8AE}.bfnext b{color:#F2EEE6}.bfnext em{color:#F2EEE6;font-style:italic;font-weight:700}
.bfask{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.bfask span{min-height:58px;display:flex;align-items:center;justify-content:center;border:1.5px solid #F2EEE6;font:900 20px 'Playfair Display',serif;letter-spacing:4px;color:#F2EEE6}
.bfrules{margin:-6px 0 0;font:400 14px/1.45 'Playfair Display',serif;color:#8f8f96;text-align:center}
.rvl{scrollbar-width:none}
.rv{opacity:0;transform:translateY(14px);animation:rvIn .7s cubic-bezier(.2,.7,.2,1) var(--d,0s) forwards}
@keyframes rvIn{to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.rv{animation:none;opacity:1;transform:none}.gstamp{animation:none!important;opacity:.92}}
.rhero{position:relative;height:min(78svh,620px);flex:none;overflow:hidden}
.rhero img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 18%;filter:grayscale(1) contrast(1.15) brightness(.82);-webkit-mask-image:linear-gradient(180deg,#000 50%,transparent 100%);mask-image:linear-gradient(180deg,#000 50%,transparent 100%)}
.rhero::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(11,11,13,.75) 0,transparent 22%,transparent 50%,rgba(11,11,13,.55) 80%,rgba(11,11,13,0) 100%)}
.rtop{position:absolute;z-index:2;left:20px;right:20px;top:18px;display:flex;justify-content:space-between}
.rname{position:absolute;z-index:2;left:20px;right:20px;bottom:18px}
.rname h1{font:900 46px/.95 'Playfair Display',serif;letter-spacing:-1px;margin:6px 0 8px;color:#F2EEE6;text-shadow:0 4px 20px rgba(0,0,0,.8)}
.rname p{margin:0;font:400 16px 'Playfair Display',serif;color:#d8d4cc}
.gstamp{position:absolute;z-index:3;right:16px;top:36%;font:900 64px 'Playfair Display',serif;letter-spacing:6px;color:var(--red);border:5px solid var(--red);padding:4px 16px 0;transform:rotate(-12deg);opacity:0;background:rgba(11,11,13,.25);text-shadow:0 0 18px rgba(255,59,78,.5);animation:gStamp .45s cubic-bezier(.3,1.6,.5,1) 1.1s forwards;box-shadow:inset 0 0 0 2px rgba(255,59,78,.35)}
@keyframes gStamp{0%{opacity:0;transform:rotate(-12deg) scale(2.4)}100%{opacity:.92;transform:rotate(-12deg) scale(1)}}
.rbody{position:relative;padding:8px 18px 28px;display:flex;flex-direction:column;gap:14px}
.beat{border-left:3px solid var(--red);padding:4px 0 4px 14px}
.beat .bk{font:700 12px 'Playfair Display',serif;letter-spacing:4px;color:#8f8f96}
.beat .ba{font:900 28px/1.05 'Playfair Display',serif;color:#F2EEE6;margin-top:2px}
.beat .bn{font:400 15px/1.4 'Playfair Display',serif;color:#BDB8AE;margin-top:4px}
.rpin{width:12px;height:12px;border-radius:50%;background:var(--c);box-shadow:inset -2px -2px 0 rgba(0,0,0,.3)}
.rpin.miss{background:none;border:1.5px solid var(--c);box-shadow:none;opacity:.6}
.rcount{font:400 13px 'Playfair Display',serif;color:#8f8f96;margin-left:4px}
.rsnake{margin:12px -18px 0;position:relative}
.rsnake img{display:block;width:100%;aspect-ratio:1;object-fit:cover;filter:grayscale(1) contrast(1.1)}
.rsnake figcaption{position:relative;margin:-90px 18px 0;background:rgba(11,11,13,.86);border:1px solid #3a3a40;padding:16px 16px 14px;display:flex;flex-direction:column;gap:6px}
.rsnake q{font:italic 900 26px/1.1 'Playfair Display',serif;color:#F2EEE6;quotes:"“" "”"}
.rsnake p{margin:0;font:400 15px/1.45 'Playfair Display',serif;color:#BDB8AE}
.rh{font:900 26px 'Playfair Display',serif;color:#F2EEE6;margin:18px 0 0}
.rchain{list-style:none;margin:0;padding:0 0 0 0;position:relative;display:flex;flex-direction:column;gap:14px}
.rchain::before{content:"";position:absolute;left:31px;top:20px;bottom:20px;width:3px;background:var(--red);box-shadow:0 0 8px rgba(255,59,78,.6)}
.rchain li{position:relative;display:flex;gap:14px;align-items:center}
.rchain img{width:64px;height:64px;flex:none;object-fit:cover;border:2px solid #F2EEE6;filter:grayscale(.4);box-shadow:0 8px 16px rgba(0,0,0,.6);background:#1c1c20}
.rchain li>div{display:flex;flex-direction:column;gap:1px}
.rchain b{font:900 18px/1.15 'Playfair Display',serif;color:#F2EEE6}
.rchain p{margin:0;font:400 14px/1.4 'Playfair Display',serif;color:#BDB8AE}
.rnext{margin:6px 0 0;font:italic 700 17px/1.4 'Playfair Display',serif;color:#F2EEE6;border-top:1px solid #2c2c31;padding-top:14px}
.rboard{border-top:1px solid #2c2c31}
.rrow{display:flex;align-items:center;gap:12px;min-height:56px;border-bottom:1px solid #2c2c31}
.rrow .pin{width:14px;height:14px;border-radius:50%;flex:none;box-shadow:inset -2px -2px 0 rgba(0,0,0,.3)}
.rrow b{font:900 20px 'Playfair Display',serif;color:#F2EEE6}
.rrank{width:18px;font:700 14px 'Playfair Display',serif;color:#8f8f96}
.rbest{font:700 10px 'Playfair Display',serif;letter-spacing:2px;color:#0b0b0d;background:#F2EEE6;padding:3px 6px}
.rpts{margin-left:auto;font:900 26px 'Playfair Display',serif;color:#F2EEE6}.rpts small{font-size:13px;color:#8f8f96}
.rrow.top .rpts{color:var(--red)}
.cases{position:relative;flex:1;min-height:0;display:flex;flex-direction:column;margin-top:clamp(28px,6svh,64px)}
@media (max-height:760px){.tblock{zoom:.82}}
.ckick{display:flex;justify-content:space-between;padding:0 24px 10px;font:600 11px Cinzel,serif;letter-spacing:4px;color:#BDB8AE}
.ckick span+span{letter-spacing:2px;color:#8f8f96}
.ctrack{flex:1;min-height:300px;display:flex;gap:14px;overflow-x:auto;scroll-snap-type:x mandatory;padding:4px 24px 14px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.ctrack::-webkit-scrollbar{display:none}
.ccard{position:relative;flex:none;width:min(76vw,300px);max-height:470px;scroll-snap-align:center;border:1.5px solid #F2EEE6;color:#F2EEE6;display:flex;flex-direction:column;justify-content:space-between;overflow:hidden;box-shadow:0 18px 34px rgba(0,0,0,.65);background:linear-gradient(180deg,rgba(11,11,13,.35) 0,rgba(11,11,13,0) 30%,rgba(11,11,13,.55) 55%,#0b0b0d 92%),var(--img,linear-gradient(165deg,hsl(var(--h) 14% 22%),#0b0b0d 70%)) 38% 50%/cover}
.ccard.soon{border-color:#34343a;box-shadow:none}
.ctop{position:relative;display:flex;justify-content:space-between;align-items:center;padding:12px 14px}
.cno{font:600 10px Cinzel,serif;letter-spacing:4px;color:#d8d4cc}
.cpin{width:16px;height:16px;border-radius:50%;background:var(--red);box-shadow:inset -3px -3px 0 rgba(0,0,0,.3),0 3px 6px rgba(0,0,0,.6)}
.csoon{font:600 9px Cinzel,serif;letter-spacing:3px;color:#F2EEE6;border:1px solid rgba(242,238,230,.6);padding:3px 6px 2px}
.cghost{position:absolute;right:-10px;top:38%;font:900 120px 'Playfair Display',serif;color:rgba(242,238,230,.06);letter-spacing:-4px;line-height:1}
.ctext{position:relative;padding:0 14px 14px;display:flex;flex-direction:column;gap:4px}
.cwhere{font:600 10px Cinzel,serif;letter-spacing:3px;color:#BDB8AE}
.ctext b{font:900 28px/1.02 'Playfair Display',serif;text-shadow:0 3px 14px rgba(0,0,0,.8)}
.cmeta{font:400 13px 'Playfair Display',serif;color:#BDB8AE}
.ccard.soon .ctext b{color:#9a9aa0}
.cbtns{display:grid;gap:8px;margin-top:10px}
.cbtns .cbtn{min-height:50px;font-size:15px}
.cbtn.ghostc{background:rgba(11,11,13,.6);color:#F2EEE6;border:1.5px solid #F2EEE6}
.ccard.nope{animation:nope .35s}
@keyframes nope{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}

const ITEMS = [
  {id:'D1', kind:'doc', r:1, tag:'D-1', n:'Helen\'s statement', sub:'Witness statement', style:'form', body:`<div class="ftitle">SURREY CONSTABULARY<br>STATEMENT OF WITNESS</div><div class="fhead"><div><b>NAME</b>Helen Stoner</div><div><b>AGE</b>30</div><div><b>ADDRESS</b>Stoke Moran Manor</div><div><b>TAKEN BY</b>Sgt. W. Hale</div></div><div class="lined"><p>On the night Julia died, a storm was blowing. Julia came to my room before bed and asked if I ever heard a low, clear whistle in the night, around three. I said no. She said she had heard it for several nights.</p><p>Later I woke to a terrible scream. I opened my door and heard a soft whistle, then a clanging sound, like metal falling. Julia staggered out of her room. She cried, "It was the band! The speckled band!" and pointed toward the doctor's room. She died within minutes.</p><p>Julia always locked her door and barred her shutters at night. My stepfather keeps a cheetah and a baboon loose on the grounds.</p><p>Signed: <span class="sig">Helen Stoner</span></p></div><div class="bstamp">RECEIVED<br>SURREY<br>CONSTABULARY</div>`},
  {id:'D2', kind:'doc', r:1, tag:'D-2', n:'Inquest summary', sub:'Coroner', style:'official', body:`<div class="crest"><svg width="38" height="42" viewBox="0 0 38 42" aria-hidden="true"><path d="M19 2l15 6v12c0 10-7 17-15 20C11 37 4 30 4 20V8z" fill="none" stroke="#1d1a14" stroke-width="1.5"/><path d="M19 10v22M11 18h16" stroke="#1d1a14" stroke-width="1.5"/></svg><b>CORONER'S COURT · COUNTY OF SURREY</b><small>Summary of Inquest held at Leatherhead</small></div><table><tr><td>Deceased</td><td>Julia Stoner, spinster, aged 30</td></tr><tr><td>Place of death</td><td>Stoke Moran Manor, west wing</td></tr><tr><td>Finding</td><td><span class="rstamp">OPEN VERDICT</span></td></tr></table><p>No marks of violence upon the body, save two small dark marks above the left ankle, taken to be scratches. No poison found in tests. The bedroom door was locked from within; the window shutters barred with iron bars, checked each night. Walls and floor found solid. The chimney is wide, but barred with four large staples.</p><p>The deceased was found in her nightdress. In her right hand, the charred stump of a match; in her left, a matchbox.</p><p>The Court is unable to name a cause of death. Death from fright is possible.</p><p style="text-align:right;margin:0">J. Whitmore, <i>H.M. Coroner</i> <span class="sig" style="font-size:28px;color:#1d1a14">J Whitmore</span></p>`},
  {id:'D3', kind:'doc', r:2, tag:'D-3', n:'Mrs. Stoner\'s will', sub:'Extract', style:'will', body:`<h3>Last Will &amp; Testament</h3><div class="of">of Mrs. Margaret Stoner, widow, of Stoke Moran</div><p class="first">I give and bequeath my whole income of one thousand pounds a year unto my husband, Doctor Grimesby Roylott, <b>so long as my daughters shall reside with him</b>.</p><p>Upon the marriage of either daughter, the said daughter shall receive a yearly portion of the said income for her own sole use and benefit.</p><div class="wit"><div><span class="sig" style="font-size:24px;color:#2a1d0e">E. Farrow</span><br>Witness</div><div><span class="sig" style="font-size:24px;color:#2a1d0e">T. Lyle</span><br>Witness</div></div><div class="seal">S</div>`},
  {id:'D4', kind:'doc', r:2, tag:'D-4', n:'Julia\'s letter', sub:'Found in her desk', style:'letter', body:`<div class="date">Stoke Moran, Tuesday</div><h3>Dearest Helen,</h3><p>Strange things this week. Workmen came and fitted a new ventilator high in my wall, and a bell-rope beside my bed, though I never asked for either. The ventilator opens into the doctor's room, not outside. Some nights I smell his cigars through it.</p><p>And that whistle again, at three in the morning. You must hear it too?</p><p style="text-align:right">Your loving sister,<br>Julia</p>`},
  {id:'P1', kind:'photo', r:1, tag:'Photo 1', n:'Julia\'s bedroom', img:'photo-1-bedroom', d:'The bolted bed, the bell-rope dangling to the pillow, the vent high above.'},
  {id:'P2', kind:'photo', r:1, tag:'Photo 2', n:'The window', img:'photo-2-window', d:'Heavy shutters, barred with iron from the inside. Checked every night.'},
  {id:'P3', kind:'photo', r:3, tag:'Photo 3', n:'Roylott\'s room', img:'photo-3-roylott-room', d:'The room next door: the iron safe, the vent high in the wall, the lash on the bedpost.'},

  const put = (path, v) => { const ks = path.split('/').filter(Boolean); let o = db; ks.slice(0, -1).forEach(k => { if (typeof o[k] !== 'object' || o[k] === null) o[k] = {}; o = o[k]; }); if (v == null) delete o[ks[ks.length - 1]]; else o[ks[ks.length - 1]] = JSON.parse(JSON.stringify(v)); };

    update: (path, v) => op({t:'update', p:path, v}),

    push: (path, v) => op({t:'set', p:path + '/k' + Date.now().toString(36) + (n++) + rid(3), v}),
    key: () => 'k' + Date.now().toString(36) + (n++) + rid(3),

app.addEventListener('click', async e => {
  const t = e.target.closest('[data-a]'); if (!t) return;
  const a = t.dataset.a, v = t.dataset.v;
  if (a === 'host' || a === 'join') { S.hosting = a === 'host'; S.screen = 'join'; S.joinErr = false; render(); const f = $(S.hosting ? '#jn' : '#jc'); if (f) f.focus(); }
  else if (a === 'case') { const c = CASES.find(x => x.id === v); if (c.soon) { t.classList.remove('nope'); void t.offsetWidth; t.classList.add('nope'); return; } S.case = v; render(); }
  else if (a === 'home') { if (S.code) leaveRoom(); else { S.screen = 'title'; render(); } }
  else if (a === 'leave') leaveRoom();
  else if (a === 'swatch') { PLAYERS[0].c = v; try { localStorage.rtColor = v; } catch (e) {} const jn = $('#jn'), jc = $('#jc'); if (jn) S.name = jn.value; if (jc) S.code = jc.value.toUpperCase(); render(); }
  else if (a === 'dojoin') {
    if (S.busy) return;
    const jc = $('#jc'); S.name = $('#jn').value.trim().slice(0, 14); if (!S.name) return;
    try { localStorage.rtName = S.name; } catch (e) {}
    if (!net) { toastMsg('Can’t reach the game server. Check your connection.'); return; }
    S.busy = true; if (document.activeElement && document.activeElement.blur) document.activeElement.blur(); render();
    try {
      if (S.hosting) await createRoom();
      else { const code = (jc ? jc.value : S.code).toUpperCase(); S.code = code; if (!(await joinRoom(code))) { S.code = code; S.joinErr = true; } }
    } catch (err) { console.error(err); toastMsg('Couldn’t connect. Try again in a moment.'); }
    S.busy = false; render();
  }
  else if (a === 'tipgo') { S.tip = +v; startTips(); S.tip = +v; render(); }
  else if (a === 'tipnext') { const n = (S.tip + 1) % TIPS.length; startTips(); S.tip = n; render(); }
  else if (a === 'mode') { if (S.host === 'me') netUpdate('meta', {mode:v}); }
  else if (a === 'start') { if (S.host === 'me' && S.joined.length >= 2) netUpdate('meta', {phase:'brief'}); }
  else if (a === 'begin') {
    if (S.host !== 'me') return;
    await netPush('pins', {id:'victim', by:ME, note:'', x:50, y:16, r:0});
    netUpdate('meta', {phase:'game', round:1, endsAt:net.now() + ROUND_SECS * 1000});
  }
  else if (a === 'tab') { S.tab = v; S.sel = null; S.tie = false; render(); }
  else if (a === 'open') openItem(v);
  else if (a === 'opensus') { const s = SUS.find(x => x.id === v); S.sheet = `<img src="${IMG(s.img)}" alt="${s.n}" style="width:100%;aspect-ratio:1;object-fit:cover;object-position:top;filter:grayscale(1);border-radius:4px"><div><div class="row"><span class="dot" style="background:${s.c}"></span><span class="lbl">SUSPECT</span></div><h2 class="serif" style="font:900 28px/1.1 'Playfair Display';margin-top:4px">${s.n}</h2><p style="margin:6px 0;color:#d8d8dc">${s.who}</p><p class="mono" style="margin:0;font-size:12px;color:var(--mute)">ALIBI: ${s.alibi}</p></div>${pinned(v) ? `<button class="btn ghost" disabled>PINNED BY ${P_(pinned(v).by).n.toUpperCase()}</button>` : `<button class="btn" data-a="pin" data-v="${v}">PIN TO BOARD</button>`}<button class="btn ghost" data-a="close">CLOSE</button>`; render(); }
  else if (a === 'pin') { if (pinned(v)) return; addPin(v, 'me'); const s = SUS.find(x => x.id === v); pinMoment(s ? s.s : ITEMS.find(i => i.id === v).n); }
  else if (a === 'openbrief') { S.sheet = brief(true); render(); }
  else if (a === 'close') { S.sheet = null; render(); }
  else if (a === 'flip') { const im = $('#pimg'); if (!im) return; const back = im.dataset.side !== 'b'; im.style.transform = 'rotateX(90deg)'; setTimeout(() => { im.src = back ? im.dataset.b : im.dataset.f; im.dataset.side = back ? 'b' : 'f'; im.alt = im.alt.replace(/(front|back)$/, back ? 'back' : 'front'); im.style.transform = 'none'; }, 180); t.textContent = back ? 'TURN IT BACK' : 'TURN IT OVER'; }
  else if (a === 'ovclose') { S.ov = null; render(); }
  else if (a === 'skip') { if (S.host !== 'me') return; if (S.t > 20) netUpdate('meta', {endsAt:net.now() + 15000}); else advance(); }
  else if (a === 'ready') { netSet('ready/r' + S.round + '/' + ME, true); }
  else if (a === 'tie') { S.tie = !S.tie; S.sel = null; render(); }
  else if (a === 'note') { S.sheet = `<h2 class="serif" style="font:italic 900 26px 'Playfair Display'">Add a note</h2><label for="nt" class="lbl">WHAT ARE YOU THINKING?</label><input id="nt" maxlength="40" placeholder="e.g. 3 a.m. whistle" style="min-height:52px;font-size:16px;padding:0 14px;background:#1c1c20;border:1px solid var(--line);border-radius:4px;color:var(--ink)"><button class="btn" data-a="addnote">PIN THE NOTE</button><button class="btn ghost" data-a="close">CANCEL</button>`; render(); setTimeout(() => $('#nt') && $('#nt').focus(), 50); }
  else if (a === 'addnote') { const txt = ($('#nt').value || '').trim().slice(0, 40); if (!txt) return; addPin('note', 'me', txt); S.sheet = null; render(); }
  else if (a === 'tvview') { S.tv = true; render(); }
  else if (a === 'tvclose') { S.tv = false; render(); }
  else if (a === 'undo') { for (let i = S.strings.length - 1; i >= 0; i--) if (S.strings[i][2] === 'me') { netRemove('strings/' + S.strings[i][3]); break; } }
  else if (a === 'who') { if (S.votes.me) return; S.vote.who = v; render(); }
  else if (a === 'lock') { const x = S.vote; if (x.who && x.how.trim().length > 2 && x.why.trim().length > 2) netSet('votes/' + ME, {who:x.who, how:x.how.trim().slice(0, 120), why:x.why.trim().slice(0, 120)}); }
  else if (a === 'ck') { if (myCheck(S.round)) return; S.ck[t.dataset.k] = +v; render(); }
  else if (a === 'cklock') { if (S.ck.a !== null && S.ck.b !== null) netSet('checks/r' + S.round + '/' + ME, {a:S.ck.a, b:S.ck.b}); }
  else if (a === 'nextround') { if (!inCharge()) return; const m = roomData.meta; if (m.round >= 3) netUpdate('meta', {phase:'vote'}); else netUpdate('meta', {phase:'game', round:m.round + 1, endsAt:net.now() + ROUND_SECS * 1000}); }
  else if (a === 'overturn') { if (v === ME) return; const path = 'overrides/' + v + '/' + t.dataset.k + '/' + ME; if (flips(v, t.dataset.k).includes(ME)) netRemove(path); else netSet(path, true); }
  else if (a === 'again') { if (S.host !== 'me') return; netUpdate('', {pins:null, strings:null, ready:null, votes:null, checks:null, overrides:null, 'meta/phase':'lobby', 'meta/round':1, 'meta/endsAt':0}); }
});
/* closing a sheet or finishing a drag catches up on anything that arrived meanwhile */
app.addEventListener('focusout', () => setTimeout(() => { if (pendingRender && !(document.activeElement && /INPUT|TEXTAREA/.test(document.activeElement.tagName))) softRender(); }, 0));

app.addEventListener('input', e => {
  if (e.target.id === 'vhow' || e.target.id === 'vwhy') { S.vote[e.target.id === 'vhow' ? 'how' : 'why'] = e.target.value; const v = S.vote, done = v.who && v.how.trim().length > 2 && v.why.trim().length > 2, b = $('#vlock'); if (b) { b.disabled = !done; b.textContent = done ? 'ACCUSE ' + SUS.find(s => s.id === v.who).s.toUpperCase() : 'NAME WHO, HOW AND WHY'; } return; }
  if (e.target.id === 'jc') { const v = e.target.value.toUpperCase().replace(/[^A-Z]/g, '').slice(0, 4); e.target.value = v; S.code = v; S.joinErr = false;
    document.querySelectorAll('.boxes span').forEach((b, i) => { b.textContent = v[i] || ''; b.className = i === v.length ? 'on' : ''; });
    const er = $('#jerr'); if (er) { er.style.color = '#8f8f96'; er.textContent = 'It’s on the TV or the host’s phone.'; } if (v.length === 4) $('#jn').focus(); }
  if (e.target.id === 'jc' || e.target.id === 'jn') { if (e.target.id === 'jn') S.name = e.target.value; const g = $('#jgo'); if (g) g.disabled = !((S.hosting || (S.code || '').length === 4) && (S.name || '').trim()); }
});

/* board: drag cards, tap to tie strings */
let drag = null;
app.addEventListener('pointerdown', e => {
  const c = e.target.closest('.bc'); if (!c) return; const b = $('#board').getBoundingClientRect();
  drag = {k:c.dataset.k, el:c, b, sx:e.clientX, sy:e.clientY, moved:false}; c.setPointerCapture(e.pointerId);
});
app.addEventListener('pointermove', e => {
  if (!drag) return; const d = Math.hypot(e.clientX - drag.sx, e.clientY - drag.sy); if (d > 6) drag.moved = true; if (!drag.moved || S.tie) return;
  const p = S.pins.find(x => x.key === drag.k); p.x = Math.min(94, Math.max(6, (e.clientX - drag.b.left) / drag.b.width * 100)); p.y = Math.min(94, Math.max(6, (e.clientY - drag.b.top) / drag.b.height * 100));
  drag.el.style.left = p.x + '%'; drag.el.style.top = p.y + '%'; drawStrings();
});
app.addEventListener('pointerup', () => {
  if (!drag) return; const k = drag.k, moved = drag.moved; drag = null;
  if (moved && !S.tie) { const p = S.pins.find(x => x.key === k); if (p) netUpdate('pins/' + k, {x:Math.round(p.x * 10) / 10, y:Math.round(p.y * 10) / 10}); if (pendingRender) render(); return; }
  if (S.tie) { if (!S.sel) { S.sel = k; } else if (S.sel !== k) { if (!S.strings.some(([x, y]) => (x === S.sel && y === k) || (x === k && y === S.sel))) netPush('strings', {a:S.sel, b:k, by:ME}); S.sel = null; S.tie = false; } render(); }
});

window.RT = {get S() { return S; }, render, get net() { return net; }};
boot();
}
</script>
</body>
</html>
