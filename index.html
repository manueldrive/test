<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Bao Buddy</title>
<link rel="manifest" href="manifest.json" />
<meta name="theme-color" content="#5B7FFF" />
<link rel="icon" href="icon-192.png" />
<link rel="apple-touch-icon" href="icon-192.png" />

<!-- Firebase SDKs -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

<style>
  @import url('https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Nunito:wght@500;700;800&display=swap');

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; min-height: 100vh; background: #F3EEE7; font-family: 'Nunito', -apple-system, sans-serif; transition: background 1.2s ease; }
  #sky-bg { position: fixed; inset: 0; z-index: 0; transition: background 1.2s ease; }
  .moon-glow { width: 120px; height: 120px; }
  #root { max-width: 460px; margin: 0 auto; padding: 16px 16px 190px; position: relative; z-index: 1; }
  @keyframes twinkle {
    0%, 100% { opacity: 0.25; transform: scale(0.8); }
    50% { opacity: 1; transform: scale(1.15); }
  }
  .twinkle-star { animation: twinkle 2.6s ease-in-out infinite; }
  @keyframes driftCloud {
    0% { transform: translateX(-20vw); }
    100% { transform: translateX(120vw); }
  }
  .drift-cloud { animation: driftCloud linear infinite; animation-fill-mode: both; left: 0; }
  @media (min-width: 480px) { #root { padding: 24px 24px 200px; } }
  button { font-family: inherit; }

  @keyframes fall { to { transform: translateY(140px) rotate(200deg); opacity: 0; } }
  @keyframes bob {
    0%, 100% { transform: translateY(0) rotate(-2deg); }
    50% { transform: translateY(-5px) rotate(2deg); }
  }
  .bob { animation: bob 2.4s ease-in-out infinite; }
  .bob-fast { animation: bob 1.5s ease-in-out infinite; }
  @keyframes squish {
    0% { transform: scale(1, 1) rotate(0deg); }
    18% { transform: scale(1.32, 0.66) rotate(-4deg); }
    38% { transform: scale(0.8, 1.22) rotate(4deg); }
    58% { transform: scale(1.14, 0.88) rotate(-2deg); }
    75% { transform: scale(0.94, 1.08) rotate(1.5deg); }
    90% { transform: scale(1.03, 0.98) rotate(-0.5deg); }
    100% { transform: scale(1, 1) rotate(0deg); }
  }
  .squish-anim { animation: squish 0.55s cubic-bezier(0.34, 1.56, 0.64, 1); transform-origin: 50% 65%; }
  .mascot-tap { cursor: pointer; }
  @keyframes celebratePop {
    0% { transform: scale(0.7); opacity: 0; }
    55% { transform: scale(1.06); opacity: 1; }
    75% { transform: scale(0.97); }
    100% { transform: scale(1); }
  }
  .celebrate-pop { animation: celebratePop 0.5s cubic-bezier(0.34, 1.56, 0.64, 1); }

  .kid-panel-content { position: relative; }
  .shared-header {
    margin-bottom: 14px;
    display: grid;
    grid-template-columns: 36px 1fr 36px;
    align-items: center;
    justify-items: center;
  }
  .row { display: flex; align-items: center; }
  .row-between { display: flex; justify-content: space-between; align-items: center; }
  .kid-btn { flex: 1; border: none; cursor: pointer; border-radius: 22px; display: flex; flex-direction: column; align-items: center; gap: 2px; transition: all 0.2s ease; }
  
  /* Chore Card */
  .chore-card { 
    position: relative; 
    border-radius: 20px; 
    padding: 12px 14px; 
    display: flex; 
    align-items: center; 
    gap: 10px; 
    transition: transform 0.2s ease, box-shadow 0.25s ease, opacity 0.2s ease; 
  }
  .chore-card.dragging {
    opacity: 0.45;
    transform: scale(0.98);
  }
  .chore-card.drag-over {
    border: 2px dashed #3A2E2E;
  }
  .drag-handle {
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: grab;
    user-select: none;
    touch-action: none;
    font-size: 16px;
    color: #B4A9A4;
    padding: 0 2px;
  }
  .drag-handle:active { cursor: grabbing; }

  .icon-box { width: 44px; height: 44px; border-radius: 14px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; cursor: pointer; }
  .chore-content { flex: 1; min-width: 0; }
  .done-btn { background: none; border: none; cursor: pointer; flex-shrink: 0; padding: 0; }
  
  /* Action Toolbar inside card for Parent Mode */
  .parent-card-actions {
    display: flex;
    align-items: center;
    gap: 4px;
    margin-top: 4px;
    flex-wrap: wrap;
  }
  .action-btn-pill {
    border: none;
    border-radius: 7px;
    height: 24px;
    padding: 0 7px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    font-size: 11px;
    font-weight: 800;
    cursor: pointer;
    box-shadow: 0 1px 2px rgba(0,0,0,0.06);
    transition: transform 0.1s ease;
  }
  .action-btn-pill:active { transform: scale(0.92); }

  /* Compact Day Toggle Chips */
  .day-chips-row {
    display: flex;
    gap: 4px;
    align-items: center;
    justify-content: space-between;
    width: 100%;
    margin-top: 2px;
  }
  .day-chip-btn {
    flex: 1;
    height: 24px;
    border-radius: 6px;
    border: 1px solid #D8CBBF;
    background: #FAF6F0;
    color: #736763;
    font-family: 'Nunito', sans-serif;
    font-size: 10px;
    font-weight: 800;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 0;
    transition: all 0.15s ease;
  }
  .day-chip-btn.selected {
    background: #3A2E2E;
    color: white;
    border-color: #3A2E2E;
  }

  /* Ten-Frame Interactive Elements */
  .timer-pill-btn {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    border: none;
    border-radius: 999px;
    padding: 3px 8px;
    font-family: 'Nunito', sans-serif;
    font-weight: 800;
    font-size: 11.5px;
    cursor: pointer;
    transition: all 0.15s ease;
    box-shadow: 0 1px 2px rgba(0,0,0,0.06);
  }
  .timer-pill-btn:active { transform: scale(0.95); }

  .ten-frames-wrapper {
    display: flex;
    gap: 6px;
    align-items: center;
    flex-wrap: wrap;
    margin-top: 5px;
  }
  .ten-frame-grid {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    grid-template-rows: repeat(2, 1fr);
    gap: 2.5px;
    background: #EDE4D8;
    padding: 3.5px;
    border-radius: 8px;
    width: 120px;
  }
  .ten-frame-slot {
    height: 13px;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 3px;
    background: #FAF6F0;
    position: relative;
    overflow: hidden;
    transition: background-color 0.2s ease;
  }
  .ten-frame-slot.active {
    background: var(--kid-accent, #FF9B42);
  }
  .ten-frame-dot {
    width: 5px;
    height: 5px;
    border-radius: 50%;
    background: white;
    transition: transform 0.2s linear;
  }

  @keyframes activeSlotPulse {
    0%, 100% { box-shadow: inset 0 0 0 0 rgba(255,255,255,0.7); }
    50% { box-shadow: inset 0 0 4px 1px rgba(255,255,255,0.9); }
  }
  .ten-frame-slot.current-ticking {
    animation: activeSlotPulse 1.5s ease-in-out infinite;
  }

  /* Phase Header Tabs (Parent Mode) */
  .phase-pills-bar {
    display: flex;
    gap: 6px;
    background: rgba(0, 0, 0, 0.15);
    padding: 4px;
    border-radius: 16px;
    margin-top: 14px;
  }
  .phase-tab-btn {
    flex: 1;
    border: none;
    border-radius: 12px;
    padding: 6px 4px;
    background: transparent;
    color: rgba(255,255,255,0.8);
    font-family: 'Nunito', sans-serif;
    font-size: 11.5px;
    font-weight: 800;
    cursor: pointer;
    transition: all 0.2s ease;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 1px;
  }
  .phase-tab-btn.active {
    background: white;
    color: #3A2E2E;
    box-shadow: 0 2px 8px rgba(0,0,0,0.12);
  }

  /* Redesigned Footer Card */
  .footer-card { 
    margin-top: 16px; 
    background: white; 
    border-radius: 24px; 
    padding: 16px; 
    display: flex; 
    flex-direction: column;
    gap: 14px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.06); 
  }
  .debit-card-box {
    width: 100%;
    aspect-ratio: 1.586 / 1;
    border: none;
    cursor: pointer;
    text-align: left;
    border-radius: 20px;
    padding: 18px 20px;
    color: #3A2E2E;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    position: relative;
    overflow: hidden;
    box-shadow: 0 8px 24px rgba(0,0,0,0.12), inset 0 1px 1px rgba(255,255,255,0.6);
  }
  .goals-container-2x2 {
    display: grid;
    grid-template-columns: 1fr 1fr;
    grid-template-rows: 1fr 1fr;
    gap: 10px;
    width: 100%;
  }
  .goal-card-item {
    background: #FAF6F0;
    border: 1px solid #EADBCE;
    border-radius: 18px;
    padding: 10px 12px;
    display: flex;
    align-items: center;
    gap: 10px;
    min-height: 64px;
    box-shadow: 0 2px 6px rgba(0,0,0,0.03);
  }
  .donut-gauge-wrap {
    position: relative;
    width: 38px;
    height: 38px;
    flex-shrink: 0;
  }
  .donut-gauge-wrap svg {
    transform: rotate(-90deg);
  }

  .lock-btn { background: #ffffff33; border: none; border-radius: 999px; width: 36px; height: 36px; display: flex; align-items: center; justify-content: center; cursor: pointer; }
  .timer-btn { border: none; border-radius: 999px; width: 34px; height: 34px; display: flex; align-items: center; justify-content: center; cursor: pointer; box-shadow: 0 2px 0 rgba(0,0,0,0.15); }

  /* Responsive Rules */
  .hide-mobile { display: none !important; }
  .kid-grid { display: block; }
  .kid-piece { display: none; container-type: inline-size; }
  .kid-piece.active { display: block; }
  .wide-only { display: none; }

  @media (min-width: 700px) {
    #root { max-width: 1280px; }
    .hide-mobile { display: flex !important; }
    .kid-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 22px 28px; }
    .kid-piece { display: block !important; min-width: 0; }
    .narrow-only { display: none !important; }
    .wide-only { display: flex !important; }

    .chore-card { padding: 18px 20px !important; border-radius: 24px !important; gap: 14px !important; }
    .icon-box { width: 56px !important; height: 56px !important; border-radius: 16px !important; }
    .chore-label { font-size: 20px !important; }
    .chore-emoji { font-size: 32px !important; }
    .timer-pill-btn { font-size: 13px !important; padding: 4px 11px !important; }
    .ten-frame-grid { width: 145px !important; gap: 4px !important; padding: 5px !important; }
    .ten-frame-slot { height: 16px !important; border-radius: 4px !important; }
    .ten-frame-dot { width: 7px !important; height: 7px !important; }

    .wide-mascot svg { width: 112px !important; height: 112px !important; }
    .moon-glow { width: 190px !important; height: 190px !important; }
  }

  @container (min-width: 560px) {
    .footer-card {
      flex-direction: row !important;
      align-items: stretch !important;
      padding: 20px !important;
      border-radius: 26px !important;
      gap: 16px !important;
    }
    .debit-card-box {
      flex: 1.05 !important;
      width: auto !important;
      min-height: 150px !important;
      aspect-ratio: 1.586 / 1 !important;
    }
    .goals-container-2x2 { flex: 1.35 !important; }
  }
  .confetti-wrap { position: absolute; inset: 0; pointer-events: none; overflow: hidden; border-radius: 20px; z-index: 3; }
  .confetti-piece { position: absolute; top: -10%; width: 7px; height: 7px; }
</style>
</head>

    ],

      { id: "e4", label: "Brush teeth",    minutes: 2,  emoji: "\uD83E\uDEA5", days: ALL_DAYS },
      { id: "e5", label: "Put on pajamas", minutes: 3,  emoji: "🥼", days: ALL_DAYS }
    ]
  }
};

var GOALS = {
  miles: [
    { emoji: "\uD83C\uDF66", label: "Ice Cream", cost: 4 },
    { emoji: "\uD83D\uDC2E", label: "Chick-fil-A", cost: 6 },

  ],

    { emoji: "\uD83D\uDECC", label: "Sleepover", cost: 8 },

  ]

function cloneChoreList(list) {
  return list.map(function (c) { 
    return { id: c.id, label: c.label, minutes: c.minutes, emoji: c.emoji, days: (c.days && c.days.length > 0) ? c.days.slice() : ALL_DAYS.slice() }; 
  });
}
function defaultCustomChores() {
  var out = {};
  Object.keys(KIDS).forEach(function (kidId) {
    out[kidId] = {
      morning: cloneChoreList(CHORE_LIBRARY[kidId].morning),
      afternoon: cloneChoreList(CHORE_LIBRARY[kidId].afternoon),
      evening: cloneChoreList(CHORE_LIBRARY[kidId].evening)
    };
  });
  return out;
}

/* ---------------- state ---------------- */

};

/* ---------------- Firebase Persistence & Sanitizer ---------------- */
var firebaseConfig = {
  apiKey: "AIzaSyDMxcuNZmdic9AZIL5uQwvGdxKnGW2Uq_c",
  authDomain: "bao-buddy.firebaseapp.com",
  databaseURL: "https://bao-buddy-default-rtdb.firebaseio.com",
  projectId: "bao-buddy",
  storageBucket: "bao-buddy.firebasestorage.app",
  messagingSenderId: "167816448505",
  appId: "1:167816448505:web:35d57633f3caea0ba71528"
};

if (!firebase.apps.length) {
  firebase.initializeApp(firebaseConfig);
}
var db = firebase.database();
var dbRef = db.ref("bao_buddy_state");

function savePersisted() {
  dbRef.set({
    done: state.done,
    balance: state.balance,
    jars: state.jars,
    weekly: state.weekly,
    customChores: state.customChores,
    timingSettings: state.timingSettings,
    bunColors: state.bunColors,
    bunAccessories: state.bunAccessories,
    flappyHighScore: state.flappyHighScore,
    nextChoreId: state.nextChoreId,
    lastActiveDate: state.lastActiveDate
  });
}

function todayDateString(d) {
  return d.toISOString().slice(0, 10);
}
function mondayOfWeek(d) {
  var day = d.getDay();
  var diff = (day === 0 ? -6 : 1 - day);
  var monday = new Date(d.getFullYear(), d.getMonth(), d.getDate() + diff);
  return todayDateString(monday);
}
function isoWeekdayKey(d) {
  var map = { 1: "mon", 2: "tue", 3: "wed", 4: "thu", 5: "fri", 6: "sat", 0: "sun" };
  return map[d.getDay()] || null;
}

function sanitizeChoresState(savedChores) {
  if (!savedChores) return defaultCustomChores();
  var out = {};
  ["miles", "lina"].forEach(function(kid) {
    out[kid] = {};
    ["morning", "afternoon", "evening"].forEach(function(p) {
      if (savedChores[kid] && Array.isArray(savedChores[kid][p])) {
        out[kid][p] = savedChores[kid][p].map(function(c) {
          return {
            id: c.id || ("c" + Math.random().toString(36).substr(2, 6)),
            label: c.label || "Chore",
            minutes: parseInt(c.minutes, 10) || 5,
            emoji: c.emoji || "\u2B50",
            days: (Array.isArray(c.days) && c.days.length > 0) ? c.days : ALL_DAYS.slice()
          };
        });
      } else {
        out[kid][p] = [];
      }
    });
  });
  return out;
}

function migrateLegacyDone(savedDone) {
  if (!savedDone || typeof savedDone !== "object") return {};
  var keys = Object.keys(savedDone);
  if (keys.length === 0) return {};
  var looksNew = keys.every(function (k) {
    return typeof savedDone[k] === "object" && savedDone[k] !== null;
  });
  if (looksNew) return savedDone;
  var today = todayDateString(new Date());
  var wrapped = {};
  wrapped[today] = {};
  keys.forEach(function (k) {
    if (savedDone[k]) wrapped[today][k] = true;
  });
  return wrapped;
}

function initPersistence() {
  dbRef.on("value", function (snapshot) {
    var saved = snapshot.val();
    var now = new Date();
    var today = todayDateString(now);
    var thisMonday = mondayOfWeek(now);

    if (saved) {
      var migratedDone = false;
      if (saved.done) {
        var beforeKeys = Object.keys(saved.done);
        state.done = migrateLegacyDone(saved.done);
        migratedDone = beforeKeys.length > 0 && state.done !== saved.done;
      }
      if (saved.balance) state.balance = saved.balance;
      if (saved.jars) state.jars = saved.jars;
      if (saved.weekly) state.weekly = saved.weekly;
      state.customChores = sanitizeChoresState(saved.customChores);
      if (saved.timingSettings) state.timingSettings = saved.timingSettings;
      if (saved.flappyHighScore) state.flappyHighScore = saved.flappyHighScore;
      var migratedColors = false;
      if (saved.bunColors) {
        var wasLegacy = Object.keys(KIDS).some(function (kidId) {
          var c = saved.bunColors[kidId];
          return c && !c.bodyStart && c.body;
        });
        state.bunColors = migrateLegacyBunColors(saved.bunColors);
        migratedColors = wasLegacy;
      }
      if (saved.bunAccessories) state.bunAccessories = saved.bunAccessories;
      if (saved.nextChoreId) state.nextChoreId = saved.nextChoreId;
      if (saved.lastActiveDate) state.lastActiveDate = saved.lastActiveDate;
      if (migratedDone || migratedColors) savePersisted();
    }

    if (state.lastActiveDate !== today) {
      state.timers = {};
      state.timerUI = {};
      state.lastActiveDate = today;
      savePersisted();
    }

    Object.keys(KIDS).forEach(function (kidId) {
      var w = state.weekly[kidId];
      if (!w || w.weekStart !== thisMonday) {
        state.weekly[kidId] = { weekStart: thisMonday, days: { mon: false, tue: false, wed: false, thu: false, fri: false }, awarded: false };
      }
    });

    render();
  });
}

function naturalPeriod() {
  var h = new Date().getHours();
  var ts = state.timingSettings || { morningStart: 5, afternoonStart: 13, eveningStart: 17 };
  if (h >= ts.morningStart && h < ts.afternoonStart) return "morning";
  if (h >= ts.afternoonStart && h < ts.eveningStart) return "afternoon";
  return "evening";
}
function visualPeriod(now) {
  var h = now.getHours();
  var ts = state.timingSettings || { morningStart: 5, afternoonStart: 13, eveningStart: 17 };
  if (h >= ts.morningStart && h < ts.afternoonStart) return "morning";
  if (h >= ts.afternoonStart && h < ts.eveningStart) return "afternoon";
  return "evening";
}
function currentPeriod() {
  if (state.parentMode && state.periodOverride) {
    return state.periodOverride;
  }
  return naturalPeriod();
}

function formatHourLabel(h24) {
  var ampm = h24 >= 12 ? "PM" : "AM";
  var h = h24 % 12 || 12;
  return h + ":00 " + ampm;
}

function getRestrictedDayTag(days) {
  if (!days || days.length === 0 || days.length === 7) return null;
  if (days.length === 5 && days.indexOf("sat") < 0 && days.indexOf("sun") < 0) return "Mon–Fri";
  if (days.length === 2 && days.indexOf("sat") >= 0 && days.indexOf("sun") >= 0) return "Weekend";
  return days.map(function(d) { return d.charAt(0).toUpperCase() + d.slice(1); }).join(", ");
}

function choresFor(kidId, period, dateObj) {
  var list = (state.customChores[kidId] && state.customChores[kidId][period]) || [];
  if (state.parentMode && !dateObj) {
    return list;
  }
  var d = dateObj || new Date();
  var dayKey = isoWeekdayKey(d);
  return list.filter(function(c) {
    return !c.days || c.days.length === 0 || c.days.indexOf(dayKey) >= 0;
  });
}

function choreKey(kidId, period, choreId) {
  return kidId + "-" + period + "-" + choreId;
}
function getChoreStatus(dateStr, key) {
  if (state.done[dateStr] && state.done[dateStr][key]) {
    return state.done[dateStr][key];
  }
  return false;
}
function setChoreStatus(dateStr, key, val) {
  if (!state.done[dateStr]) state.done[dateStr] = {};
  if (val) {
    state.done[dateStr][key] = val;
  } else {
    delete state.done[dateStr][key];
  }
}

function ensureTimer(key, minutes) {
  if (!state.timers[key]) {
    state.timers[key] = { totalSeconds: minutes * 60, remainingSeconds: minutes * 60, running: false, endTimestamp: null };
  }
  return state.timers[key];
}
function formatClockParts(d) {
  var h = d.getHours();
  var m = d.getMinutes();
  var ampm = h >= 12 ? "PM" : "AM";
  h = h % 12 || 12;
  return { hm: h + ":" + (m < 10 ? "0" + m : m), ampm: ampm };
}

/* ---------------- confetti ---------------- */
function spawnConfetti(containerEl) {
  if (!containerEl) return;
  var wrap = document.createElement("div");
  wrap.className = "confetti-wrap";
  var colors = ["#FF9B42", "#FFD166", "#5B7FFF", "#7DD8C6", "#FF6B6B"];
  for (var i = 0; i < 14; i++) {
    var span = document.createElement("span");
    span.className = "confetti-piece";
    var left = Math.random() * 100;
    var delay = Math.random() * 0.2;
    var dur = 0.7 + Math.random() * 0.5;
    var color = colors[i % colors.length];
    span.style.left = left + "%";
    span.style.background = color;
    span.style.borderRadius = (i % 2) ? "50%" : "2px";
    span.style.animation = "fall " + dur + "s ease-in " + delay + "s forwards";
    wrap.appendChild(span);
  }
  containerEl.appendChild(wrap);
  setTimeout(function () { if (wrap.parentNode) wrap.parentNode.removeChild(wrap); }, 1200);
}

  var r = Math.min(255, (num >> 16) + amt);
  var g = Math.min(255, ((num >> 8) & 0x00FF) + amt);
  var b = Math.min(255, (num & 0x0000FF) + amt);
  return "#" + (0x1000000 + r * 0x10000 + g * 0x100 + b).toString(16).slice(1);
}
function migrateLegacyBunColors(savedColors) {

  Object.keys(KIDS).forEach(function (kidId) {
    var c = savedColors && savedColors[kidId];

/* ---------------- 10-Frame Multi-Box Builder ---------------- */
function renderTenFrameBoxesHtml(key, minutes, remainingSeconds, isRunning) {
  var remainingMin = Math.ceil(remainingSeconds / 60);
  var activeSlotGlobal = remainingMin - 1;
  
  var secInMinute = remainingSeconds % 60;
  if (secInMinute === 0 && remainingSeconds > 0) secInMinute = 60;
  var subFraction = remainingSeconds > 0 ? (secInMinute / 60) : 0;
  var microScale = (0.35 + 0.65 * subFraction).toFixed(2);

  var frameCount = minutes > 10 ? Math.ceil(minutes / 10) : 1;
  var html = '<div class="ten-frames-wrapper">';

  for (var f = 0; f < frameCount; f++) {
    html += '<div class="ten-frame-grid">';
    for (var s = 0; s < 10; s++) {
      var globalIdx = f * 10 + s;
      var inTask = globalIdx < minutes;
      var active = inTask && (globalIdx < remainingMin);
      var isCurrentlyTicking = isRunning && (globalIdx === activeSlotGlobal);

      var slotClasses = "ten-frame-slot";
      if (active) slotClasses += " active";
      if (isCurrentlyTicking) slotClasses += " current-ticking";

      var dotScale = isCurrentlyTicking ? microScale : "1";
      var dotHtml = active ? '<div class="ten-frame-dot" style="transform:scale(' + dotScale + ')"></div>' : '';

      html += '<div id="slot-' + key + '-' + globalIdx + '" class="' + slotClasses + '">' + dotHtml + '</div>';
    }
    html += '</div>';
  }

  html += '</div>';
  return html;
}

/* ---------------- Drag & Drop Logic ---------------- */
var draggedChoreId = null;
var draggedPeriod = null;
var draggedKid = null;

function handleDragStart(e) {
  var card = e.target.closest(".chore-card");
  if (!card) return;
  draggedChoreId = card.dataset.choreid;
  draggedPeriod = card.dataset.period;
  draggedKid = card.dataset.kid;
  card.classList.add("dragging");
  e.dataTransfer.effectAllowed = "move";
  e.dataTransfer.setData("text/plain", draggedChoreId);
}

function handleDragOver(e) {
  e.preventDefault();
  var card = e.target.closest(".chore-card");
  if (card && card.dataset.choreid !== draggedChoreId) {
    card.classList.add("drag-over");
  }
}

function handleDragLeave(e) {
  var card = e.target.closest(".chore-card");
  if (card) card.classList.remove("drag-over");
}

function handleDrop(e) {
  e.preventDefault();
  var targetCard = e.target.closest(".chore-card");
  document.querySelectorAll(".chore-card").forEach(function(c) {
    c.classList.remove("dragging", "drag-over");
  });
  if (!targetCard || !draggedChoreId) return;

  var targetChoreId = targetCard.dataset.choreid;
  if (targetChoreId === draggedChoreId) return;

  var list = state.customChores[draggedKid][draggedPeriod];
  var fromIdx = list.findIndex(function(c) { return c.id === draggedChoreId; });
  var toIdx = list.findIndex(function(c) { return c.id === targetChoreId; });

  if (fromIdx >= 0 && toIdx >= 0) {
    var movedItem = list.splice(fromIdx, 1)[0];
    list.splice(toIdx, 0, movedItem);
    savePersisted();
    render();
  }
}

function handleDragEnd() {
  document.querySelectorAll(".chore-card").forEach(function(c) {
    c.classList.remove("dragging", "drag-over");
  });
  draggedChoreId = null;
  draggedPeriod = null;
  draggedKid = null;
}

}

/* ---------------- Flappy Bao Game Engine ---------------- */
var flappyGame = {
  canvas: null,
  ctx: null,
  animId: null,
  kidId: null,
  baoImg: null,
  score: 0,
  highScore: 0,
  state: "ready", // ready, playing, gameover
  bao: { x: 55, y: 150, vy: 0, radius: 18, squishScaleX: 1, squishScaleY: 1, squishTime: 0 },
  pipes: [],
  pipeWidth: 38,
  pipeGap: 110, // Original classic gap
  gravity: 0.38, // Original responsive gravity
  jumpStrength: -6.2, // Original responsive jump
  pipeSpeed: 2.0, // Original snappy speed
  spawnCounter: 0,

  init: function(kidId) {
    this.kidId = kidId;
    this.canvas = document.getElementById("flappy-canvas");
    if (!this.canvas) return;
    this.ctx = this.canvas.getContext("2d");

    this.reset();
    this.renderBaoImage();
    if (this.animId) cancelAnimationFrame(this.animId);
    this.loop();
  },

  reset: function() {

    this.bao.y = this.canvas.height / 2;
    this.bao.vy = 0;
    this.bao.squishScaleX = 1;
    this.bao.squishScaleY = 1;
    this.bao.squishTime = 0;
    this.pipes = [];
    this.score = 0;
    this.spawnCounter = 0;
    this.state = "ready";
  },

  renderBaoImage: function() {
    var currentP = (state.parentMode && state.periodOverride) ? state.periodOverride : visualPeriod(new Date());
    var svgStr = mascotSVG(this.kidId, 100, currentP, "p100");
    var blob = new Blob([svgStr], { type: "image/svg+xml;charset=utf-8" });
    var url = URL.createObjectURL(blob);
    var img = new Image();
    var self = this;
    img.onload = function() {
      self.baoImg = img;
    };
    img.src = url;
  },

  flap: function() {
    if (this.state === "ready" || this.state === "playing") {
      this.state = "playing";
      this.bao.vy = this.jumpStrength;
      this.bao.squishTime = 15;
      playFlapSound();
    } else if (this.state === "gameover") {
      this.reset();
      this.state = "playing";
      this.bao.vy = this.jumpStrength;
      this.bao.squishTime = 15;
      playFlapSound();
    }
  },

  update: function() {
    if (this.state === "playing") {
      this.bao.vy += this.gravity;
      this.bao.y += this.bao.vy;

      // Squish animation on tap
      if (this.bao.squishTime > 0) {
        this.bao.squishTime--;
        var progress = (15 - this.bao.squishTime) / 15;
        this.bao.squishScaleX = 1 + 0.35 * Math.sin(progress * Math.PI);
        this.bao.squishScaleY = 1 - 0.28 * Math.sin(progress * Math.PI);
      } else {
        this.bao.squishScaleX = 1;
        this.bao.squishScaleY = 1;
      }

      // Ceiling and floor bounds
      if (this.bao.y - this.bao.radius <= 0) {
        this.bao.y = this.bao.radius;
        this.bao.vy = 0;
      }
      if (this.bao.y + this.bao.radius >= this.canvas.height - 20) {
        this.gameOver();
      }

      // Spawn chopstick pipes
      this.spawnCounter++;
      if (this.spawnCounter >= 85) {
        this.spawnCounter = 0;
        var minTop = 40;
        var maxTop = this.canvas.height - this.pipeGap - 60;
        var topHeight = Math.floor(minTop + Math.random() * (maxTop - minTop));
        this.pipes.push({
          x: this.canvas.width + 10,
          top: topHeight,
          bottom: topHeight + this.pipeGap,
          passed: false
        });
      }

      // Move & collide chopstick pipes
      for (var i = this.pipes.length - 1; i >= 0; i--) {
        var p = this.pipes[i];
        p.x -= this.pipeSpeed;

        var bx = this.bao.x;
        var by = this.bao.y;
        var br = this.bao.radius - 2;

        if (bx + br > p.x && bx - br < p.x + this.pipeWidth) {
          if (by - br < p.top || by + br > p.bottom) {
            this.gameOver();
          }
        }

        if (!p.passed && p.x + this.pipeWidth < this.bao.x) {
          p.passed = true;
          this.score++;
          playScoreSound();
          if (this.score > this.highScore) {
            this.highScore = this.score;
            if (!state.flappyHighScore) state.flappyHighScore = {};
            state.flappyHighScore[this.kidId] = this.highScore;
            savePersisted();
          }
        }

        if (p.x + this.pipeWidth < -20) {
          this.pipes.splice(i, 1);
        }
      }
    }
  },

  gameOver: function() {
    this.state = "gameover";

  draw: function() {
    var ctx = this.ctx;
    var W = this.canvas.width;
    var H = this.canvas.height;
    var vp = (state.parentMode && state.periodOverride) ? state.periodOverride : visualPeriod(new Date());

    // Dynamic Time-Of-Day Sky Background in Game
    var skyGrad = ctx.createLinearGradient(0, 0, 0, H);
    if (vp === "morning") {
      skyGrad.addColorStop(0, "#7B9FE8");
      skyGrad.addColorStop(0.35, "#B98FD1");
      skyGrad.addColorStop(0.7, "#F0B896");
      skyGrad.addColorStop(1, "#F5D9A8");
    } else if (vp === "afternoon") {
      skyGrad.addColorStop(0, "#2F8FEA");
      skyGrad.addColorStop(0.45, "#6FB8F5");
      skyGrad.addColorStop(1, "#D6ECFB");
    } else {
      skyGrad.addColorStop(0, "#0B1A3D");
      skyGrad.addColorStop(0.5, "#1B2F63");
      skyGrad.addColorStop(1, "#33468C");
    }
    ctx.fillStyle = skyGrad;
    ctx.fillRect(0, 0, W, H);

    // Dynamic Atmosphere Decor
    if (vp === "morning" || vp === "afternoon") {
      // Sun Glow
      if (vp === "morning") {
        var sunG = ctx.createRadialGradient(W - 20, 20, 0, W - 20, 20, 70);
        sunG.addColorStop(0, "rgba(255, 222, 122, 0.5)");
        sunG.addColorStop(0.6, "rgba(255, 182, 138, 0.2)");
        sunG.addColorStop(1, "transparent");
        ctx.fillStyle = sunG;
        ctx.fillRect(W - 90, 0, 90, 90);
      }
      // Floating Clouds
      ctx.fillStyle = "rgba(255, 255, 255, 0.65)";
      ctx.beginPath();
      ctx.arc(60, 45, 18, 0, Math.PI * 2);
      ctx.arc(80, 40, 24, 0, Math.PI * 2);
      ctx.arc(104, 45, 18, 0, Math.PI * 2);
      ctx.fill();

      ctx.beginPath();
      ctx.arc(220, 80, 16, 0, Math.PI * 2);
      ctx.arc(238, 75, 22, 0, Math.PI * 2);
      ctx.arc(260, 80, 16, 0, Math.PI * 2);
      ctx.fill();
    } else {
      // Moon Glow & Stars
      var moonG = ctx.createRadialGradient(W - 25, 25, 0, W - 25, 25, 75);
      moonG.addColorStop(0, "rgba(234, 230, 255, 0.45)");
      moonG.addColorStop(0.5, "rgba(185, 198, 255, 0.2)");
      moonG.addColorStop(1, "transparent");
      ctx.fillStyle = moonG;
      ctx.fillRect(W - 100, 0, 100, 100);

      // Night Stars
      ctx.fillStyle = "#FFFFFF";
      STAR_FIELD.forEach(function(s, idx) {
        if (idx % 2 === 0) {
          ctx.beginPath();
          ctx.arc((s.x / 100) * W, (s.y / 100) * (H - 40), s.size * 0.7, 0, Math.PI * 2);
          ctx.fill();
        }
      });
    }

    // Ground line matching landscape
    var lp = LANDSCAPE_PALETTE[vp] || LANDSCAPE_PALETTE.evening;
    ctx.fillStyle = lp.front;
    ctx.fillRect(0, H - 20, W, 20);
    ctx.fillStyle = lp.tree;
    ctx.fillRect(0, H - 24, W, 4);

    // Draw Chopsticks
    this.pipes.forEach(function(p) {
      var topGrad = ctx.createLinearGradient(p.x, 0, p.x + flappyGame.pipeWidth, 0);
      topGrad.addColorStop(0, "#E6C280");
      topGrad.addColorStop(0.5, "#F7E1B5");
      topGrad.addColorStop(1, "#C29853");
      ctx.fillStyle = topGrad;

      // Top body
      ctx.beginPath();
      ctx.roundRect(p.x, -10, flappyGame.pipeWidth, p.top + 10, [0, 0, 8, 8]);
      ctx.fill();
      ctx.strokeStyle = "#8C6527";
      ctx.lineWidth = 2;
      ctx.stroke();

      // Top wrap
      ctx.fillStyle = "#E63946";
      ctx.fillRect(p.x, 15, flappyGame.pipeWidth, 8);
      ctx.fillStyle = "#FFD166";
      ctx.fillRect(p.x, 18, flappyGame.pipeWidth, 2);

      // Bottom body
      var botHeight = H - p.bottom;
      ctx.fillStyle = topGrad;
      ctx.beginPath();
      ctx.roundRect(p.x, p.bottom, flappyGame.pipeWidth, botHeight + 10, [8, 8, 0, 0]);
      ctx.fill();
      ctx.strokeStyle = "#8C6527";
      ctx.lineWidth = 2;
      ctx.stroke();

      // Bottom wrap
      ctx.fillStyle = "#E63946";
      ctx.fillRect(p.x, H - 45, flappyGame.pipeWidth, 8);
      ctx.fillStyle = "#FFD166";
      ctx.fillRect(p.x, H - 42, flappyGame.pipeWidth, 2);
    });

    // Draw Customized Kid Bao
    ctx.save();
    ctx.translate(this.bao.x, this.bao.y);
    var tilt = Math.min(Math.PI / 4, Math.max(-Math.PI / 6, this.bao.vy * 0.06));

    if (this.baoImg && this.baoImg.complete) {
      ctx.drawImage(this.baoImg, -28, -22, 56, 44);
    } else {
      ctx.fillStyle = "#FFF";
      ctx.beginPath();
      ctx.arc(0, 0, this.bao.radius, 0, Math.PI * 2);
      ctx.fill();

    ctx.restore();

    // Draw Score
    ctx.fillStyle = vp === "evening" ? "#FFFFFF" : "#3A2E2E";
    ctx.font = "800 26px 'Baloo 2', Nunito, sans-serif";
    ctx.textAlign = "center";
    ctx.fillText(this.score, W / 2, 40);

    // Ready Overlay

      ctx.fillStyle = vp === "evening" ? "rgba(255, 255, 255, 0.95)" : "rgba(58, 46, 46, 0.88)";

      ctx.fillRect(0, 0, W, H);

      ctx.fillStyle = "#FFFFFF";
      ctx.beginPath();
      ctx.roundRect(W / 2 - 95, H / 2 - 70, 190, 140, 18);
      ctx.fill();
      ctx.strokeStyle = "#EDE4D8";
      ctx.lineWidth = 2;
      ctx.stroke();

      ctx.fillStyle = "#3A2E2E";
      ctx.font = "800 20px 'Baloo 2', sans-serif";
      ctx.fillText("Game Over!", W / 2, H / 2 - 38);

      ctx.font = "800 14px Nunito, sans-serif";
      ctx.fillStyle = "#FF9B42";
      ctx.fillText("Score: " + this.score, W / 2, H / 2 - 12);
      ctx.fillStyle = "#736763";
      ctx.font = "700 12px Nunito, sans-serif";

      ctx.fillStyle = "#3A2E2E";
      ctx.font = "800 13px 'Baloo 2', sans-serif";

  },

  loop: function() {

    '<div style="display:flex;justify-content:space-between;align-items:center;position:relative">' +

    '<span style="font-family:\'Nunito\',sans-serif;font-weight:800;font-size:10px;letter-spacing:1px;text-transform:uppercase;color:#3a2e2e;opacity:0.85">Bao Bank</span>' +
    '</div>' +
    '<div style="width:28px;height:20px;background:linear-gradient(135deg,#E6C575,#D1A949);border-radius:4px;box-shadow:inset 0 1px 1px rgba(255,255,255,0.6);border:1px solid #B89233"></div>' +
    '</div>' +

    '<div class="balance-amount" style="font-family:\'Baloo 2\',sans-serif;font-weight:800;font-size:32px;margin:2px 0;position:relative;letter-spacing:0.5px;line-height:1">' + balanceStr + '</div>' +
    
    '<div style="display:flex;justify-content:space-between;align-items:center;position:relative">' +
    '<div style="font-family:\'Nunito\',sans-serif;font-weight:800;font-size:11.5px;letter-spacing:1.2px;text-transform:uppercase;color:#3a2e2e;opacity:0.9">' + kid.name + '</div>' +

    '</div>' +
    '</button>';

    list.forEach(function(c) {

      var done = !!status;
      var excused = status === "excused";

      html += '<div style="display:flex;align-items:center;gap:8px;background:#FAF6F0;padding:8px 12px;border-radius:12px;margin-top:4px">' +

/* ---------------- actions & streak check ---------------- */
function checkWeeklyAward(kidId, dateStr) {
  var d = dateStr ? new Date(dateStr + "T12:00:00") : new Date();
  var todayKey = isoWeekdayKey(d);
  if (!todayKey || WEEKDAY_KEYS.indexOf(todayKey) < 0) return;

  var targetDateStr = todayDateString(d);
  var periods = ["morning", "afternoon", "evening"];
  var allPeriodsDone = periods.every(function(p) {
    var pChores = choresFor(kidId, p, d);
    if (pChores.length === 0) return true;
    return pChores.every(function(c) {
      return !!getChoreStatus(targetDateStr, choreKey(kidId, p, c.id));
    });
  });

  var w = state.weekly[kidId];
  if (!w) return;
  w.days[todayKey] = allPeriodsDone;

  var allDaysDone = WEEKDAY_KEYS.every(function (k) { return w.days[k]; });
  if (allDaysDone && !w.awarded) {
    w.awarded = true;
    state.balance[kidId] += 2;
  }
  savePersisted();
}

function completeChore(kidId, period, choreId) {
  var key = choreKey(kidId, period, choreId);
  var today = todayDateString(new Date());
  var chores = choresFor(kidId, period);
  var wasAllDone = chores.every(function (c) { return !!getChoreStatus(today, choreKey(kidId, period, c.id)); });

  setChoreStatus(today, key, true);
  if (state.timers[key]) { state.timers[key].running = false; }

  var isAllDoneNow = chores.every(function (c) { return !!getChoreStatus(today, choreKey(kidId, period, c.id)); });
  var justFinishedRoutine = isAllDoneNow && !wasAllDone;

  if (justFinishedRoutine) {
    playFanfare();
    state.celebrateKid = kidId;
  } else {
    playChime();
  }
  checkWeeklyAward(kidId, today);
  savePersisted();
  render();

  var card = document.querySelector('[data-chorekey="' + key + '"]');
  spawnConfetti(card);
  if (justFinishedRoutine) {
    var banner = document.querySelector('[data-all-done-banner="' + kidId + '"]');
    if (banner) spawnBigConfetti(banner);
  }
}

document.getElementById("root").addEventListener("click", function (e) {
  var el = e.target.closest("[data-action]");
  if (!el) return;
  var action = el.dataset.action;
  var key = el.dataset.key;

  if (action === "select-kid") {
    state.kidId = el.dataset.kid;
    state.accountOpenFor = null;
    state.playModalFor = null;
    state.gameActive = false;
    flappyGame.stop();
    state.squishSwitcher = el.dataset.kid;
    render();
  } else if (action === "switch-phase") {
    state.periodOverride = el.dataset.period;
    render();
  } else if (action === "open-timings-modal") {
    state.timingsModalOpen = true;
    render();
  } else if (action === "close-timings-modal") {
    state.timingsModalOpen = false;
    render();
  } else if (action === "save-modal-timings") {
    var mVal = parseInt(document.getElementById("modal-ts-morning").value, 10);
    var aVal = parseInt(document.getElementById("modal-ts-afternoon").value, 10);
    var eVal = parseInt(document.getElementById("modal-ts-evening").value, 10);
    state.timingSettings = { morningStart: mVal, afternoonStart: aVal, eveningStart: eVal };
    state.timingsModalOpen = false;
    savePersisted();
    render();
  } else if (action === "toggle-form-day") {
    el.classList.toggle("selected");
  } else if (action === "squish-switcher") {
    state.squishSwitcher = el.dataset.kid;
    render();
  } else if (action === "squish-banner") {
    state.squishBanner = el.dataset.kid;
    state.playModalFor = el.dataset.kid;
    state.gameActive = false;
    render();
  } else if (action === "close-play-modal") {
    state.playModalFor = null;
    state.gameActive = false;
    flappyGame.stop();
    render();
  } else if (action === "start-flappy") {
    state.gameActive = true;
    render();
  } else if (action === "exit-flappy") {
    state.gameActive = false;
    flappyGame.stop();
    render();
  } else if (action === "flap-bao") {
    flappyGame.flap();
  } else if (action === "bun-color") {
    var colorKid = el.dataset.kid;
    var colorIndex = parseInt(el.dataset.colorIndex, 10);
    state.bunColors[colorKid] = BUN_PALETTE[colorIndex];
    savePersisted();
    render();
  } else if (action === "accessory-type") {
    var accKid = el.dataset.kid;
    var accType = el.dataset.type;
    if (!accType) {
      state.bunAccessories[accKid] = null;
    } else {
      var existingColor = state.bunAccessories[accKid] ? state.bunAccessories[accKid].color : ACCESSORY_COLORS[0];
      state.bunAccessories[accKid] = { type: accType, color: existingColor };
    }
    savePersisted();
    render();
  } else if (action === "accessory-color") {
    var accColorKid = el.dataset.kid;
    if (state.bunAccessories[accColorKid]) {
      state.bunAccessories[accColorKid].color = el.dataset.color;
      savePersisted();
      render();
    }
  } else if (action === "toggle-parent") {
    state.parentMode = !state.parentMode;
    if (!state.parentMode) {
      state.timingsModalOpen = false;
      state.periodOverride = null;
    }
    render();
  } else if (action === "toggle-fullscreen") {
    try {
      if (!document.fullscreenElement && document.documentElement.requestFullscreen) {
        document.documentElement.requestFullscreen().catch(function () {});
      } else if (document.fullscreenElement && document.exitFullscreen) {
        document.exitFullscreen().catch(function () {});
      }
    } catch (e) { }
  } else if (action === "open-history") {
    state.historyOpen = true;
    state.selectedHistoryDate = todayDateString(new Date());
    render();
  } else if (action === "close-history") {
    state.historyOpen = false;
    render();
  } else if (action === "history-select-date") {
    state.selectedHistoryDate = el.dataset.datestr;
    render();
  } else if (action === "history-toggle-done") {
    var hDate = el.dataset.datestr;
    var hKey = el.dataset.key;
    var cur = getChoreStatus(hDate, hKey);
    setChoreStatus(hDate, hKey, cur === true ? false : true);
    checkWeeklyAward(state.kidId, hDate);
    savePersisted();
    render();
  } else if (action === "history-toggle-pass") {
    var hpDate = el.dataset.datestr;
    var hpKey = el.dataset.key;
    var curP = getChoreStatus(hpDate, hpKey);
    setChoreStatus(hpDate, hpKey, curP === "excused" ? false : "excused");
    checkWeeklyAward(state.kidId, hpDate);
    savePersisted();
    render();
  } else if (action === "open-account") {
    state.accountOpenFor = el.dataset.kid;
    render();
  } else if (action === "close-account") {
    state.accountOpenFor = null;
    render();
  } else if (action === "jar-inc" || action === "jar-dec") {
    var jarKidId = el.dataset.kid;
    var jarName = el.dataset.jar;
    var jars = state.jars[jarKidId];
    var totalBalance = state.balance[jarKidId];
    var allocatedNow = jars.give + jars.save + jars.spend;
    if (action === "jar-inc") {
      if (allocatedNow < totalBalance) jars[jarName] += 1;
    } else {
      if (jars[jarName] > 0) jars[jarName] -= 1;
    }
    savePersisted();
    render();
  } else if (action === "balance-adj") {
    if (!state.parentMode) return;
    var adjKidId = el.dataset.kid;
    var amount = parseInt(el.dataset.amount, 10);
    var adjJars = state.jars[adjKidId];
    var floor = adjJars.give + adjJars.save + adjJars.spend;
    var newBalance = state.balance[adjKidId] + amount;
    state.balance[adjKidId] = Math.max(floor, newBalance);
    savePersisted();
    render();
  } else if (action === "chore-move-up" || action === "chore-move-down") {
    if (!state.parentMode) return;
    var mvKid = el.dataset.kid, mvPeriod = el.dataset.period, mvId = el.dataset.choreid;
    var mvList = state.customChores[mvKid][mvPeriod];
    var mvIdx = mvList.findIndex(function (c) { return c.id === mvId; });
    if (mvIdx < 0) return;
    var mvTarget = action === "chore-move-up" ? mvIdx - 1 : mvIdx + 1;
    if (mvTarget < 0 || mvTarget >= mvList.length) return;
    var mvTmp = mvList[mvIdx];
    mvList[mvIdx] = mvList[mvTarget];
    mvList[mvTarget] = mvTmp;
    savePersisted();
    render();
  } else if (action === "chore-delete") {
    if (!state.parentMode) return;
    var delKid = el.dataset.kid, delPeriod = el.dataset.period, delId = el.dataset.choreid;
    var delList = state.customChores[delKid][delPeriod];
    var delIdx = delList.findIndex(function (c) { return c.id === delId; });
    if (delIdx >= 0) delList.splice(delIdx, 1);
    savePersisted();
    render();
  } else if (action === "chore-add") {
    if (!state.parentMode) return;
    var addKid = el.dataset.kid, addPeriod = el.dataset.period;
    var idBase = "chore-add-" + addKid + "-" + addPeriod;
    var emojiEl = document.getElementById(idBase + "-emoji");
    var labelEl = document.getElementById(idBase + "-label");
    var minutesEl = document.getElementById(idBase + "-minutes");
    var label = (labelEl.value || "").trim();
    if (!label) { labelEl.focus(); return; }
    var minutes = parseInt(minutesEl.value, 10);
    if (!minutes || minutes < 1) minutes = 5;
    var emoji = (emojiEl.value || "").trim() || "\u2B50";

    var days = [];
    ALL_DAYS.forEach(function(d) {
      var btn = document.getElementById(idBase + "-daybtn-" + d);
      if (btn && btn.classList.contains("selected")) days.push(d);
    });
    if (days.length === 0) days = ALL_DAYS.slice();

    var newChore = { id: "c" + state.nextChoreId, label: label, minutes: minutes, emoji: emoji, days: days };
    state.nextChoreId += 1;
    state.customChores[addKid][addPeriod].push(newChore);
    savePersisted();
    render();
  } else if (action === "chore-pass") {
    if (!state.parentMode) return;
    var passToday = todayDateString(new Date());
    var passCur = getChoreStatus(passToday, key);
    setChoreStatus(passToday, key, passCur === "excused" ? false : "excused");
    checkWeeklyAward(state.kidId, passToday);
    savePersisted();
    render();
  } else if (action === "chore-edit") {
    if (!state.parentMode) return;
    state.editingChore = { kidId: el.dataset.kid, period: el.dataset.period, choreId: el.dataset.choreid };
    render();
  } else if (action === "chore-edit-cancel") {
    state.editingChore = null;
    render();
  } else if (action === "chore-edit-save") {
    if (!state.parentMode) return;
    var editKid = el.dataset.kid, editPeriod = el.dataset.period, editChoreId = el.dataset.choreid;
    var editIdBase = "chore-edit-" + editKid + "-" + editPeriod + "-" + editChoreId;
    var eEmojiEl = document.getElementById(editIdBase + "-emoji");
    var eLabelEl = document.getElementById(editIdBase + "-label");
    var eMinutesEl = document.getElementById(editIdBase + "-minutes");
    var ePhaseEl = document.getElementById(editIdBase + "-phase");
    var eLabel = (eLabelEl.value || "").trim();
    if (!eLabel) { eLabelEl.focus(); return; }
    var eMinutes = parseInt(eMinutesEl.value, 10);
    if (!eMinutes || eMinutes < 1) eMinutes = 5;
    var eEmoji = (eEmojiEl.value || "").trim() || "\u2B50";
    var targetPhase = (ePhaseEl && ePhaseEl.value) || editPeriod;

    var editDays = [];
    ALL_DAYS.forEach(function(d) {
      var btn = document.getElementById(editIdBase + "-daybtn-" + d);
      if (btn && btn.classList.contains("selected")) editDays.push(d);
    });
    if (editDays.length === 0) editDays = ALL_DAYS.slice();

    var sourceList = state.customChores[editKid][editPeriod];
    var editIdx = sourceList.findIndex(function (c) { return c.id === editChoreId; });
    
    if (editIdx >= 0) {
      var updatedChore = {
        id: editChoreId,
        label: eLabel,
        minutes: eMinutes,
        emoji: eEmoji,
        days: editDays
      };

      if (targetPhase === editPeriod) {
        sourceList[editIdx] = updatedChore;
      } else {
        sourceList.splice(editIdx, 1);
        if (!state.customChores[editKid][targetPhase]) state.customChores[editKid][targetPhase] = [];
        state.customChores[editKid][targetPhase].push(updatedChore);
        state.periodOverride = targetPhase;
      }
    }
    state.editingChore = null;
    savePersisted();
    render();
  } else if (action === "toggle-pill-timer") {
    var t = state.timers[key];
    if (!t) return;
    
    if (!state.timerUI[key]) {
      state.timerUI[key] = true;
      t.endTimestamp = Date.now() + t.remainingSeconds * 1000;
      t.running = true;
    } else {
      if (t.running) {
        t.remainingSeconds = Math.max(0, Math.round((t.endTimestamp - Date.now()) / 1000));
        t.running = false;
      } else {
        t.endTimestamp = Date.now() + t.remainingSeconds * 1000;
        t.running = true;
      }
    }
    render();
  } else if (action === "reset-pill-timer") {
    var t2 = state.timers[key];
    if (!t2) return;
    t2.running = false;
    t2.remainingSeconds = t2.totalSeconds;
    state.timerUI[key] = false;
    render();
  } else if (action === "toggle-done") {
    var todayStr = todayDateString(new Date());
    var parts = key.split("-");
    var kId = parts[0], pId = parts[1], cId = parts[2];
    var curDone = getChoreStatus(todayStr, key);
    if (curDone) {
      setChoreStatus(todayStr, key, false);
      checkWeeklyAward(kId, todayStr);
      savePersisted();
      render();
    } else {
      completeChore(kId, pId, cId);
    }
  }
});

/* Keyboard Spacebar jump listener for Flappy Bao */
window.addEventListener("keydown", function(e) {
  if (e.code === "Space" && state.gameActive) {
    e.preventDefault();
    flappyGame.flap();
  }
});

/* ---------------- ticker ---------------- */
setInterval(function () {
  var parts = formatClockParts(new Date());
  document.querySelectorAll("[data-clock-time]").forEach(function (el) {
    if (el.textContent !== parts.hm) el.textContent = parts.hm;
  });
  document.querySelectorAll("[data-clock-ampm]").forEach(function (el) {
    if (el.textContent !== parts.ampm) el.textContent = parts.ampm;
  });

  if (!state.periodOverride && naturalPeriod() !== state.lastRenderedPeriod) {
    render();
    return;
  }

  Object.keys(state.timers).forEach(function (key) {
    var t = state.timers[key];
    if (!t.running) return;
    var remaining = Math.max(0, Math.round((t.endTimestamp - Date.now()) / 1000));
    if (remaining !== t.remainingSeconds) {
      var prevRemainingMin = Math.ceil(t.remainingSeconds / 60);
      var currentRemainingMin = Math.ceil(remaining / 60);

      t.remainingSeconds = remaining;

      if (prevRemainingMin !== currentRemainingMin && remaining > 0) {
        playDotPop();
      }

      var pillLabel = document.getElementById("pill-label-" + key);
      if (pillLabel) {
        var mm = Math.floor(remaining / 60), ss = remaining % 60;
        pillLabel.textContent = mm + ":" + (ss < 10 ? "0" + ss : ss);
      }

      var totalMinutes = Math.round(t.totalSeconds / 60);
      var activeSlotGlobal = currentRemainingMin - 1;
      var secInMinute = remaining % 60;
      if (secInMinute === 0 && remaining > 0) secInMinute = 60;
      var subFraction = remaining > 0 ? (secInMinute / 60) : 0;
      var microScale = (0.35 + 0.65 * subFraction).toFixed(2);

      for (var i = 0; i < totalMinutes; i++) {
        var slotEl = document.getElementById("slot-" + key + "-" + i);
        if (slotEl) {
          var active = i < currentRemainingMin;
          var isCurrentlyTicking = t.running && (i === activeSlotGlobal);

          if (active) {
            slotEl.className = "ten-frame-slot active" + (isCurrentlyTicking ? " current-ticking" : "");
            var dotEl = slotEl.querySelector(".ten-frame-dot");
            if (!dotEl) {
              slotEl.innerHTML = '<div class="ten-frame-dot" style="transform:scale(' + (isCurrentlyTicking ? microScale : '1') + ')"></div>';
            } else {
              dotEl.style.transform = 'scale(' + (isCurrentlyTicking ? microScale : '1') + ')';
            }
          } else {
            slotEl.className = "ten-frame-slot";
            slotEl.innerHTML = "";
          }
        }
      }
    }
    if (remaining <= 0) {
      var p = key.split("-");
      completeChore(p[0], p[1], p[2]);
    }
  });
}, 500);

document.addEventListener("fullscreenchange", function () { render(); });

initPersistence();
</script>
