l<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>ChoreTrail</title>
<style>
  html, body { margin: 0; padding: 0; background: #F3EEE7; }
  #root { max-width: 460px; margin: 0 auto; padding: 16px; }
  @media (min-width: 480px) { #root { padding: 24px; } }
</style>

<!-- React itself, from a CDN -->
<script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
<!-- Babel, to turn the JSX below into plain JS right in the browser -->
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<!-- Icon set used throughout the app -->
<script src="https://unpkg.com/lucide-react@0.383.0/dist/umd/lucide-react.js" crossorigin></script>
</head>
<body>
<div id="root"></div>

<script type="text/babel" data-presets="react">
const { useState, useEffect, useRef, useCallback } = React;
const {
  Sun, Moon, CheckCircle2, Circle, Play, Pause, RotateCcw,
  Lock, Unlock, Coins, Award, Shirt, Backpack, Bed, Utensils,
  Sparkles, Dog,
} = LucideReact;

/* ---------------------------------------------------------------
   ChoreTrail — a walk-the-path chore/timer/reward app for kids.
   Signature idea: each routine is a little path across a sky that
   actually shifts with the time of day. Every chore is a stepping
   stone; finishing one moves the kid's marker further down the
   path toward home (morning) or bed (evening).
----------------------------------------------------------------- */

const FONT_IMPORT = `@import url('https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Nunito:wght@500;700;800&display=swap');`;

function MilesLionCub({ size = 64, mood = "idle" }) {
  const petals = 10;
  return (
    <svg width={size} height={size} viewBox="0 0 100 100">
      <g>
        {Array.from({ length: petals }).map((_, i) => {
          const angle = (360 / petals) * i;
          return (
            <ellipse
              key={i}
              cx="50" cy="16" rx="12" ry="16"
              fill={i % 2 === 0 ? "#FF9B42" : "#FFC15E"}
              transform={`rotate(${angle} 50 50)`}
            />
          );
        })}
      </g>
      <circle cx="50" cy="50" r="27" fill="#FFE3B0" />
      <ellipse cx="34" cy="34" rx="7" ry="6" fill="#FF9B42" />
      <ellipse cx="66" cy="34" rx="7" ry="6" fill="#FF9B42" />
      <circle cx="40" cy="49" r="4.4" fill="#4A2E15" />
      <circle cx="60" cy="49" r="4.4" fill="#4A2E15" />
      <circle cx="41.3" cy="47.5" r="1.3" fill="#fff" />
      <circle cx="61.3" cy="47.5" r="1.3" fill="#fff" />
      <ellipse cx="46" cy="60" rx="4.5" ry="10" fill="#F7C9A0" opacity="0.6" />
      <ellipse cx="54" cy="60" rx="4.5" ry="10" fill="#F7C9A0" opacity="0.6" />
      <ellipse cx="50" cy="57" rx="3.6" ry="2.6" fill="#E8895A" />
      {mood === "happy" ? (
        <path d="M40 63 Q50 72 60 63" stroke="#4A2E15" strokeWidth="2.6" fill="none" strokeLinecap="round" />
      ) : (
        <path d="M42 64 Q50 69 58 64" stroke="#4A2E15" strokeWidth="2.6" fill="none" strokeLinecap="round" />
      )}
    </svg>
  );
}

function LinaButterflyPixie({ size = 64, mood = "idle" }) {
  return (
    <svg width={size} height={size} viewBox="0 0 100 100">
      <g opacity="0.9">
        <path d="M46 50 C20 20, 4 24, 8 46 C4 66, 24 66, 46 54 Z" fill="#7DD8C6" />
        <path d="M54 50 C80 20, 96 24, 92 46 C96 66, 76 66, 54 54 Z" fill="#5B7FFF" />
        <path d="M46 54 C26 62, 16 78, 26 84 C36 88, 44 70, 48 58 Z" fill="#7DD8C6" opacity="0.85" />
        <path d="M54 54 C74 62, 84 78, 74 84 C64 88, 56 70, 52 58 Z" fill="#5B7FFF" opacity="0.85" />
      </g>
      <path d="M46 22 Q40 10 33 9" stroke="#5B7FFF" strokeWidth="2.4" fill="none" strokeLinecap="round" />
      <path d="M54 22 Q60 10 67 9" stroke="#5B7FFF" strokeWidth="2.4" fill="none" strokeLinecap="round" />
      <circle cx="33" cy="9" r="2.4" fill="#5B7FFF" />
      <circle cx="67" cy="9" r="2.4" fill="#5B7FFF" />
      <circle cx="50" cy="50" r="24" fill="#FFF3E9" />
      <path d="M28 40 Q34 22 50 24" stroke="#4A3A6B" strokeWidth="6" fill="none" strokeLinecap="round" />
      <circle cx="41" cy="49" r="4.2" fill="#3F2E5C" />
      <circle cx="59" cy="49" r="4.2" fill="#3F2E5C" />
      <circle cx="42.3" cy="47.5" r="1.2" fill="#fff" />
      <circle cx="60.3" cy="47.5" r="1.2" fill="#fff" />
      <ellipse cx="47" cy="59" rx="3.6" ry="8" fill="#FFC9B8" opacity="0.55" />
      <ellipse cx="53" cy="59" rx="3.6" ry="8" fill="#FFC9B8" opacity="0.55" />
      {mood === "happy" ? (
        <path d="M41 62 Q50 70 59 62" stroke="#3F2E5C" strokeWidth="2.4" fill="none" strokeLinecap="round" />
      ) : (
        <path d="M43 63 Q50 68 57 63" stroke="#3F2E5C" strokeWidth="2.4" fill="none" strokeLinecap="round" />
      )}
    </svg>
  );
}

const KIDS = {
  miles: { name: "Miles", age: 3, accent: "#FF9B42", accent2: "#FFD166", Character: MilesLionCub },
  lina: { name: "Lina", age: 7, accent: "#5B7FFF", accent2: "#7DD8C6", Character: LinaButterflyPixie },
};

const CHORE_LIBRARY = {
  miles: {
    morning: [
      { id: "m1", label: "Get dressed", minutes: 5, icon: Shirt },
      { id: "m2", label: "Brush teeth", minutes: 2, icon: Sparkles },
      { id: "m3", label: "Eat breakfast", minutes: 10, icon: Utensils },
      { id: "m4", label: "Pack backpack", minutes: 3, icon: Backpack },
    ],
    evening: [
      { id: "e1", label: "Clean up toys", minutes: 5, icon: Circle },
      { id: "e2", label: "Bath time", minutes: 10, icon: Dog },
      { id: "e3", label: "Brush teeth", minutes: 2, icon: Sparkles },
      { id: "e4", label: "Pajamas + bed", minutes: 5, icon: Bed },
    ],
  },
  lina: {
    morning: [
      { id: "m1", label: "Make bed", minutes: 3, icon: Bed },
      { id: "m2", label: "Get dressed", minutes: 5, icon: Shirt },
      { id: "m3", label: "Brush teeth", minutes: 2, icon: Sparkles },
      { id: "m4", label: "Eat breakfast", minutes: 10, icon: Utensils },
      { id: "m5", label: "Pack backpack", minutes: 3, icon: Backpack },
    ],
    evening: [
      { id: "e1", label: "Tidy room", minutes: 8, icon: Circle },
      { id: "e2", label: "Shower", minutes: 10, icon: Dog },
      { id: "e3", label: "Brush teeth", minutes: 2, icon: Sparkles },
      { id: "e4", label: "Read + lights out", minutes: 10, icon: Bed },
    ],
  },
};

function useClock() {
  const [now, setNow] = useState(new Date());
  useEffect(() => {
    const t = setInterval(() => setNow(new Date()), 1000 * 15);
    return () => clearInterval(t);
  }, []);
  return now;
}

function playChime() {
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const notes = [523.25, 659.25, 783.99];
    notes.forEach((freq, i) => {
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = "sine";
      osc.frequency.value = freq;
      osc.connect(gain);
      gain.connect(ctx.destination);
      const start = ctx.currentTime + i * 0.09;
      gain.gain.setValueAtTime(0.0001, start);
      gain.gain.exponentialRampToValueAtTime(0.18, start + 0.02);
      gain.gain.exponentialRampToValueAtTime(0.0001, start + 0.35);
      osc.start(start);
      osc.stop(start + 0.4);
    });
  } catch (e) {}
}

function formatClock(d) {
  let h = d.getHours();
  const m = d.getMinutes();
  const ampm = h >= 12 ? "PM" : "AM";
  h = h % 12 || 12;
  return `${h}:${m.toString().padStart(2, "0")} ${ampm}`;
}

function ChoreTimer({ minutes, active, onComplete, accent }) {
  const [secondsLeft, setSecondsLeft] = useState(minutes * 60);
  const [running, setRunning] = useState(false);
  const intervalRef = useRef(null);

  useEffect(() => {
    if (running) {
      intervalRef.current = setInterval(() => {
        setSecondsLeft((s) => {
          if (s <= 1) {
            clearInterval(intervalRef.current);
            setRunning(false);
            playChime();
            onComplete();
            return 0;
          }
          return s - 1;
        });
      }, 1000);
    }
    return () => clearInterval(intervalRef.current);
  }, [running, onComplete]);

  const reset = () => {
    clearInterval(intervalRef.current);
    setRunning(false);
    setSecondsLeft(minutes * 60);
  };

  const pct = 1 - secondsLeft / (minutes * 60);
  const mm = Math.floor(secondsLeft / 60);
  const ss = secondsLeft % 60;

  if (!active) return null;

  return (
    <div style={{ display: "flex", alignItems: "center", gap: 10, marginTop: 8 }}>
      <div style={{ position: "relative", width: 44, height: 44 }}>
        <svg width="44" height="44" viewBox="0 0 44 44">
          <circle cx="22" cy="22" r="18" fill="none" stroke="#ffffff55" strokeWidth="5" />
          <circle
            cx="22" cy="22" r="18" fill="none"
            stroke={accent} strokeWidth="5" strokeLinecap="round"
            strokeDasharray={2 * Math.PI * 18}
            strokeDashoffset={2 * Math.PI * 18 * (1 - pct)}
            transform="rotate(-90 22 22)"
            style={{ transition: "stroke-dashoffset 1s linear" }}
          />
        </svg>
        <div style={{
          position: "absolute", inset: 0, display: "flex", alignItems: "center",
          justifyContent: "center", fontFamily: "'Nunito', sans-serif",
          fontWeight: 800, fontSize: 11, color: "#3a2e2e",
        }}>
          {mm}:{ss.toString().padStart(2, "0")}
        </div>
      </div>
      <button onClick={() => setRunning((r) => !r)} style={btnStyle(accent)} aria-label={running ? "Pause timer" : "Start timer"}>
        {running ? <Pause size={16} /> : <Play size={16} />}
      </button>
      <button onClick={reset} style={btnStyle("#ffffffcc", "#3a2e2e")} aria-label="Reset timer">
        <RotateCcw size={15} />
      </button>
    </div>
  );
}

function btnStyle(bg, color = "white") {
  return {
    background: bg, color, border: "none", borderRadius: 999,
    width: 34, height: 34, display: "flex", alignItems: "center",
    justifyContent: "center", cursor: "pointer", boxShadow: "0 2px 0 rgba(0,0,0,0.15)",
  };
}

function Confetti({ show }) {
  if (!show) return null;
  const pieces = Array.from({ length: 14 });
  return (
    <div style={{ position: "absolute", inset: 0, pointerEvents: "none", overflow: "hidden", borderRadius: 20 }}>
      {pieces.map((_, i) => {
        const left = Math.random() * 100;
        const delay = Math.random() * 0.2;
        const dur = 0.7 + Math.random() * 0.5;
        const colors = ["#FF9B42", "#FFD166", "#5B7FFF", "#7DD8C6", "#FF6B6B"];
        const color = colors[i % colors.length];
        return (
          <span key={i} style={{
            position: "absolute", left: `${left}%`, top: "-10%",
            width: 7, height: 7, background: color,
            borderRadius: i % 2 ? "50%" : 2,
            animation: `fall ${dur}s ease-in ${delay}s forwards`,
          }} />
        );
      })}
    </div>
  );
}

function ChoreStone({ chore, done, onToggle, accent }) {
  const Icon = chore.icon || Circle;
  const [showConfetti, setShowConfetti] = useState(false);
  const [timerActive, setTimerActive] = useState(false);

  const handleComplete = useCallback(() => {
    if (!done) {
      onToggle(true);
      setShowConfetti(true);
      setTimeout(() => setShowConfetti(false), 1000);
    }
  }, [done, onToggle]);

  const handleCardTap = () => {
    if (done) { onToggle(false); return; }
    playChime();
    onToggle(true);
    setShowConfetti(true);
    setTimeout(() => setShowConfetti(false), 1000);
  };

  return (
    <div style={{
      position: "relative",
      background: done ? `linear-gradient(135deg, ${accent}, ${accent}cc)` : "#ffffffee",
      borderRadius: 20, padding: "14px 16px", display: "flex", alignItems: "center", gap: 14,
      boxShadow: done ? `0 4px 0 ${accent}88, 0 8px 20px rgba(0,0,0,0.12)` : "0 4px 0 rgba(0,0,0,0.08), 0 8px 20px rgba(0,0,0,0.06)",
      transition: "all 0.25s ease",
    }}>
      <Confetti show={showConfetti} />
      <div
        onClick={() => setTimerActive((t) => !t)}
        style={{
          width: 48, height: 48, borderRadius: 14,
          background: done ? "#ffffff33" : `${accent}22`,
          display: "flex", alignItems: "center", justifyContent: "center",
          flexShrink: 0, cursor: "pointer",
        }}
        title="Tap for a timer"
      >
        <Icon size={24} color={done ? "white" : accent} />
      </div>
      <div style={{ flex: 1, minWidth: 0 }}>
        <div style={{ fontFamily: "'Baloo 2', sans-serif", fontWeight: 700, fontSize: 17, color: done ? "white" : "#3a2e2e", lineHeight: 1.15 }}>
          {chore.label}
        </div>
        <div style={{ fontFamily: "'Nunito', sans-serif", fontSize: 12.5, fontWeight: 700, color: done ? "#ffffffcc" : "#8a7f7f", marginTop: 1 }}>
          {chore.minutes} min · tap the icon for a timer
        </div>
        <ChoreTimer minutes={chore.minutes} active={timerActive && !done} onComplete={handleComplete} accent={accent} />
      </div>
      <button onClick={handleCardTap} style={{ background: "none", border: "none", cursor: "pointer", color: done ? "white" : "#c9c2c2", flexShrink: 0 }} aria-label={done ? "Mark not done" : "Mark done"}>
        {done ? <CheckCircle2 size={30} /> : <Circle size={30} />}
      </button>
    </div>
  );
}

function WeekStrip({ accent }) {
  const days = ["S", "M", "T", "W", "T", "F", "S"];
  const todayIdx = new Date().getDay();
  return (
    <div style={{ display: "flex", gap: 6, marginTop: 6 }}>
      {days.map((d, i) => (
        <div key={i} style={{
          width: 26, height: 26, borderRadius: 999,
          background: i < todayIdx ? accent : i === todayIdx ? `${accent}55` : "#ffffff40",
          display: "flex", alignItems: "center", justifyContent: "center",
          fontFamily: "'Nunito', sans-serif", fontSize: 11, fontWeight: 800,
          color: i <= todayIdx ? "white" : "#ffffffaa",
          border: i === todayIdx ? `2px solid ${accent}` : "none",
        }}>
          {d}
        </div>
      ))}
    </div>
  );
}

function ChoreTrail() {
  const now = useClock();
  const hour = now.getHours();
  const autoPeriod = hour >= 4 && hour < 15 ? "morning" : "evening";

  const [kidId, setKidId] = useState("lina");
  const [period, setPeriod] = useState(autoPeriod);
  const [parentMode, setParentMode] = useState(false);
  const [doneMap, setDoneMap] = useState({});
  const [badges] = useState({ miles: 2, lina: 5 });

  useEffect(() => setPeriod(autoPeriod), [autoPeriod]);

  const kid = KIDS[kidId];
  const chores = CHORE_LIBRARY[kidId][period];
  const key = (choreId) => `${kidId}-${period}-${choreId}`;
  const doneCount = chores.filter((c) => doneMap[key(c.id)]).length;
  const allDone = doneCount === chores.length;

  const toggle = (choreId, val) => {
    setDoneMap((prev) => ({ ...prev, [key(choreId)]: val }));
  };

  const isMorning = period === "morning";
  const sky = isMorning
    ? "linear-gradient(180deg, #FFE5A3 0%, #FFB683 45%, #FF9B7A 100%)"
    : "linear-gradient(180deg, #1B2A6B 0%, #3B3F8C 55%, #6B5B95 100%)";
  const textOnSky = isMorning ? "#5A3A1A" : "#EAE6FF";

  return (
    <div style={{ fontFamily: "'Nunito', sans-serif", minHeight: 560, position: "relative" }}>
      <style>{`
        ${FONT_IMPORT}
        @keyframes fall { to { transform: translateY(140px) rotate(200deg); opacity: 0; } }
        @keyframes bob {
          0%, 100% { transform: translateY(0) rotate(-2deg); }
          50% { transform: translateY(-5px) rotate(2deg); }
        }
        .bob { animation: bob 2.4s ease-in-out infinite; }
        .bob-fast { animation: bob 1.5s ease-in-out infinite; }
        * { box-sizing: border-box; }
      `}</style>

      <div style={{ background: sky, borderRadius: 28, padding: 20, position: "relative", overflow: "hidden", transition: "background 1.2s ease" }}>
        <div style={{ position: "absolute", top: 18, right: 24, opacity: 0.9 }}>
          {isMorning ? <Sun size={38} color="#FFDE7A" /> : <Moon size={34} color="#EAE6FF" />}
        </div>

        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center" }}>
          <div style={{ fontFamily: "'Baloo 2', sans-serif", fontWeight: 800, fontSize: 26, color: textOnSky, letterSpacing: 0.3 }}>
            {formatClock(now)}
          </div>
          <button
            onClick={() => setParentMode((p) => !p)}
            style={{ background: "#ffffff33", border: "none", borderRadius: 999, width: 36, height: 36, display: "flex", alignItems: "center", justifyContent: "center", cursor: "pointer", color: textOnSky }}
            aria-label="Toggle parent mode"
          >
            {parentMode ? <Unlock size={17} /> : <Lock size={17} />}
          </button>
        </div>

        <div style={{ display: "flex", gap: 12, marginTop: 14 }}>
          {Object.entries(KIDS).map(([id, k]) => {
            const selected = kidId === id;
            const Character = k.Character;
            return (
              <button
                key={id}
                onClick={() => setKidId(id)}
                style={{
                  flex: 1, border: "none", cursor: "pointer",
                  borderRadius: 22, padding: selected ? "12px 10px 10px" : "10px 10px 8px",
                  background: selected ? "white" : "#ffffff2e",
                  display: "flex", flexDirection: "column", alignItems: "center", gap: 2,
                  boxShadow: selected ? "0 4px 0 rgba(0,0,0,0.1), 0 10px 18px rgba(0,0,0,0.12)" : "none",
                  transition: "all 0.2s ease",
                }}
              >
                <div className={selected ? "bob-fast" : "bob"} style={{ filter: selected ? "none" : "grayscale(0.15) opacity(0.85)" }}>
                  <Character size={selected ? 60 : 46} mood={selected ? "happy" : "idle"} />
                </div>
                <span style={{ fontFamily: "'Baloo 2', sans-serif", fontWeight: 800, fontSize: selected ? 16 : 13.5, color: selected ? "#3a2e2e" : textOnSky, marginTop: 2 }}>
                  {k.name}
                </span>
              </button>
            );
          })}
        </div>

        <div style={{ marginTop: 18, display: "flex", justifyContent: "space-between", alignItems: "baseline" }}>
          <div style={{ fontFamily: "'Baloo 2', sans-serif", fontWeight: 700, fontSize: 19, color: textOnSky }}>
            {isMorning ? "☀️ Morning routine" : "🌙 Evening routine"}
          </div>
          <div style={{ fontFamily: "'Nunito', sans-serif", fontWeight: 800, fontSize: 13, color: textOnSky }}>
            {doneCount}/{chores.length} done
          </div>
        </div>
        {parentMode && (
          <button
            onClick={() => setPeriod((p) => (p === "morning" ? "evening" : "morning"))}
            style={{ marginTop: 8, background: "#ffffff40", border: "none", borderRadius: 12, padding: "6px 10px", color: textOnSky, fontFamily: "'Nunito', sans-serif", fontWeight: 800, fontSize: 12, cursor: "pointer" }}
          >
            Parent: preview {isMorning ? "evening" : "morning"} list
          </button>
        )}

        <div style={{ display: "flex", flexDirection: "column", gap: 12, marginTop: 16 }}>
          {chores.map((c) => (
            <ChoreStone key={c.id} chore={c} done={!!doneMap[key(c.id)]} onToggle={(val) => toggle(c.id, val)} accent={kid.accent} />
          ))}
        </div>

        {allDone && (
          <div style={{ marginTop: 14, background: "#ffffff", borderRadius: 16, padding: "10px 14px", display: "flex", alignItems: "center", gap: 10 }}>
            <div className="bob-fast">
              <kid.Character size={36} mood="happy" />
            </div>
            <div style={{ fontFamily: "'Baloo 2', sans-serif", fontWeight: 700, color: "#3a2e2e", fontSize: 14 }}>
              All done, {kid.name}! Great {isMorning ? "morning" : "evening"}!
            </div>
          </div>
        )}
      </div>

      <div style={{ marginTop: 16, background: "white", borderRadius: 22, padding: 16, display: "flex", justifyContent: "space-between", alignItems: "center", boxShadow: "0 4px 16px rgba(0,0,0,0.06)" }}>
        <div>
          <div style={{ display: "flex", alignItems: "center", gap: 6 }}>
            <Award size={18} color={kid.accent} />
            <span style={{ fontFamily: "'Baloo 2', sans-serif", fontWeight: 700, fontSize: 14, color: "#3a2e2e" }}>
              {badges[kidId]} badges earned
            </span>
          </div>
          <div style={{ display: "flex", alignItems: "center", gap: 6, marginTop: 8 }}>
            <Coins size={18} color="#E0A526" />
            <span style={{ fontFamily: "'Baloo 2', sans-serif", fontWeight: 700, fontSize: 14, color: "#3a2e2e" }}>
              $2 this week if every day is checked off
            </span>
          </div>
          <WeekStrip accent={kid.accent} />
        </div>
        <div className="bob" style={{ width: 60, height: 60, borderRadius: "50%", background: `${kid.accent}22`, display: "flex", alignItems: "center", justifyContent: "center" }}>
          <kid.Character size={44} mood={allDone ? "happy" : "idle"} />
        </div>
      </div>

      {parentMode && (
        <div style={{ marginTop: 12, background: "#3a2e2e", borderRadius: 16, padding: 12, color: "white", fontFamily: "'Nunito', sans-serif", fontSize: 12.5 }}>
          Parent mode: tap any checkmark to undo a chore. Data resets each day — this is a click-through prototype, so nothing is saved between visits yet.
        </div>
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<ChoreTrail />);
</script>
</body>
</html>
