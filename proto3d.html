<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Draw Together 3D Prototype</title>
<link rel="stylesheet" href="css/lagoon.css">
<style>
html,body{height:100%;overflow:hidden}
canvas.layer{position:fixed;inset:0;width:100%;height:100%;display:block}
.bar{position:fixed;left:calc(1.8vw + env(safe-area-inset-left,0px));bottom:calc(2.4vh + env(safe-area-inset-bottom,0px));z-index:5;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.kinds{display:flex;gap:6px;flex-wrap:wrap;background:var(--glass);padding:6px;border-radius:999px}
.kinds .chip{cursor:pointer;border:0;background:var(--cream);color:var(--ink);font:900 12px var(--body);letter-spacing:.08em;text-transform:uppercase;padding:8px 12px;border-radius:999px}
.kinds .chip[aria-pressed="true"]{background:var(--butter)}
.tag{position:fixed;top:calc(2vh + env(safe-area-inset-top,0px));left:calc(1.8vw + env(safe-area-inset-left,0px));z-index:5;
  font:700 clamp(18px,3.5vh,42px)/1 var(--display);color:var(--cream);-webkit-text-stroke:clamp(3px,.6vh,7px) var(--ink);paint-order:stroke fill;text-shadow:0 .32vh 0 var(--ink)}
.tag span{font:900 clamp(9px,1.25vh,14px)/1 var(--body);letter-spacing:.14em;text-transform:uppercase;color:var(--ink);background:var(--butter);padding:.6vh 1.1vh;border-radius:999px;
  -webkit-text-stroke:0;text-shadow:none;vertical-align:middle;margin-left:1vh}
</style>
<script src="vendor/three.min.js"></script>
<script src="js/shark-core.js"></script>
<script src="js/creatures3d.js"></script>
</head>
<body>
<canvas class="layer" id="back"></canvas>
<canvas class="layer" id="gl"></canvas>
<canvas class="layer" id="front"></canvas>
<div class="tag">Draw Together<span>3D prototype</span></div>
<div class="bar">
  <div class="kinds" id="kinds" role="group" aria-label="Creature for the next photos"></div>
  <input type="file" id="file" accept="image/*" multiple class="vh">
  <label class="btn" for="file" role="button" tabindex="0">Add sheet photos</label>
</div>
<div class="toast" id="toast" hidden></div>
<script>
(function(){
'use strict';
var C = SharkCore, K = Creatures3D, DEFS = K.DEFS;
var back = document.getElementById('back'), front = document.getElementById('front'), glc = document.getElementById('gl');
var bg = back.getContext('2d'), fg = front.getContext('2d'), scene2d = C.makeScene();
var W = 0, H = 0, DPR = 1;

var renderer = new THREE.WebGLRenderer({ canvas: glc, antialias: true, alpha: true, preserveDrawingBuffer: true });
renderer.setClearColor(0x000000, 0);
if ('outputColorSpace' in renderer) renderer.outputColorSpace = THREE.SRGBColorSpace; else renderer.outputEncoding = THREE.sRGBEncoding;
var scene = new THREE.Scene();
scene.fog = new THREE.Fog(0x6cbde2, 1050, 2600);           // far creatures fade into the water
var camera = new THREE.PerspectiveCamera(38, 16 / 9, 10, 4000);
camera.position.set(0, 20, 820); camera.lookAt(0, -10, 0);
scene.add(new THREE.HemisphereLight(0xe6f8ff, 0x1d5f8c, 1.05));
var sun = new THREE.DirectionalLight(0xfff6e6, 1.25); sun.position.set(250, 700, 600); scene.add(sun);
var rim = new THREE.DirectionalLight(0x9fe0ff, .45); rim.position.set(-400, 200, -500); scene.add(rim);

function resize(){
  DPR = Math.min(2, devicePixelRatio || 1); W = innerWidth; H = innerHeight;
  [back, front].forEach(function(c){ c.width = Math.round(W*DPR); c.height = Math.round(H*DPR); });
  renderer.setPixelRatio(DPR); renderer.setSize(W, H, false);
  camera.aspect = W / H; camera.updateProjectionMatrix();
}
addEventListener('resize', resize); resize();

/* ---------------- the tank ----------------
   Each creature has its own zone (depth and height), speed and way of moving:
   whales cruise the deep back, turtles glide through the middle, sharks patrol everywhere,
   fish dart near the front in little schools, and jellyfish, seahorses and octopuses float upright. */
var all = [];
function rand(a, b){ return a + Math.random() * (b - a); }
function halfWidthAt(z){ var dist = camera.position.z - z; return Math.tan(camera.fov * Math.PI / 360) * dist * camera.aspect; }
function zone(s){ return { z: s.def.z, y: s.def.y }; }
function newTarget(s){
  var Z = zone(s), best = null, bd = -1;
  for (var k = 0; k < 4; k++){
    var tz = rand(Z.z[0], Z.z[1]), hw = halfWidthAt(tz) * .82, c = [rand(-hw, hw), rand(Z.y[0], Z.y[1]), tz];
    var d = (c[0] - s.x) * (c[0] - s.x) + (c[2] - s.z) * (c[2] - s.z) * 1.5;
    if (d > bd){ bd = d; best = c; }
  }
  s.tx = best[0]; s.ty = best[1]; s.tz = best[2]; s.mode = 'wander';
}
function leaders(){ return all.filter(function(s){ return !s.def.upright && !s.leader; }); }
function awayCount(){ return leaders().filter(function(s){ return s.mode === 'leave' || s.mode === 'away'; }).length; }
function maybeLeave(s){
  var L = leaders(), cap = L.length < 4 ? 0 : Math.max(1, Math.floor(L.length * .3));
  if (awayCount() >= cap || Math.random() > .28) return false;
  var side = Math.cos(s.heading) >= 0 ? 1 : -1, Z = zone(s);
  s.tz = Math.max(Z.z[0], Math.min(Z.z[1], s.z + rand(-80, 80)));
  s.tx = side * (halfWidthAt(s.tz) + 320 * s.scale); s.ty = rand(Z.y[0], Z.y[1]); s.mode = 'leave';
  return true;
}
function comeBack(s){
  var side = Math.random() < .5 ? -1 : 1, Z = zone(s);
  s.z = rand(Z.z[0], Z.z[1]); s.y = rand(Z.y[0], Z.y[1]);
  s.x = side * (halfWidthAt(s.z) + 260 * s.scale); s.heading = side > 0 ? Math.PI : 0; s.pitch = 0; s.bank = 0;
  s.tz = Math.max(Z.z[0], Math.min(Z.z[1], s.z + rand(-60, 60))); s.tx = -side * rand(0, halfWidthAt(s.tz) * .6); s.ty = s.y;
  s.mode = 'enter'; s.group.visible = true;
  all.forEach(function(f){ if (f.leader === s){ f.x = s.x + f.off[0] * 1.5; f.y = s.y + f.off[1]; f.z = s.z + f.off[2]; f.heading = s.heading; f.mode = 'follow'; f.group.visible = true; } });
}

function addCreature(kind, img){
  var def = DEFS[kind], c = new K.Creature(kind, img), s = c;
  s.size = rand(.88, 1.12); s.scale = def.size * s.size; c.group.scale.setScalar(s.scale);
  var Z = def;
  s.x = rand(-420, 420); s.y = rand(Z.y[0], Z.y[1]); s.z = rand(Z.z[0], Z.z[1]);
  s.heading = Math.random() < .5 ? 0 : Math.PI; s.pitch = 0; s.bank = 0; s.seed = Math.random() * 9;
  s.speed = def.speed ? rand(def.speed[0], def.speed[1]) : 0; s.facing = Math.random() < .5 ? 1 : -1; s.ry = s.facing > 0 ? 0 : Math.PI;
  if (kind === 'fish'){
    var lead = all.filter(function(f){ return f.kind === 'fish' && !f.leader && all.filter(function(g){ return g.leader === f; }).length < 5; })[0];
    if (lead){ s.leader = lead; s.off = [rand(-70, 70), rand(-45, 45), rand(-70, 70)]; s.mode = 'follow'; s.x = lead.x + s.off[0]; s.y = lead.y + s.off[1]; s.z = lead.z + s.off[2]; s.heading = lead.heading; s.speed = lead.speed; }
  }
  if (!s.leader){ if (def.upright){ s.tx = rand(-300, 300); s.ty = s.y; s.baseY = s.y; s.mode = 'float'; } else newTarget(s); }
  scene.add(c.group); all.push(s);
  return s;
}

/* ---- keeping creatures from passing through each other (capsules along their bodies) ---- */
function axis(s, ahead){
  if (s.def.upright){ var h = s.def.halfLen * s.scale * .8; return { a: [s.x, s.y - h, s.z], b: [s.x, s.y + h, s.z], c: [s.x, s.y, s.z], dir: [0, 1, 0] }; }
  var cp = Math.cos(s.pitch), dir = [Math.cos(s.heading) * cp, Math.sin(s.pitch), -Math.sin(s.heading) * cp];
  var v = s.speed * (ahead || 0), L = s.def.halfLen * s.scale;
  var cx = s.x + dir[0] * v, cy = s.y + dir[1] * v, cz = s.z + dir[2] * v;
  return { a: [cx - dir[0] * L, cy - dir[1] * L, cz - dir[2] * L], b: [cx + dir[0] * L * .9, cy + dir[1] * L * .9, cz + dir[2] * L * .9], c: [cx, cy, cz], dir: dir };
}
function segDist(p1, q1, p2, q2){
  var d1 = sub(q1, p1), d2 = sub(q2, p2), r = sub(p1, p2), a = dot(d1, d1), e = dot(d2, d2), f = dot(d2, r), s, t;
  var c = dot(d1, r), b = dot(d1, d2), den = a * e - b * b;
  s = den > 1e-6 ? clamp((b * f - c * e) / den) : 0;
  t = e > 1e-9 ? (b * s + f) / e : 0;
  if (t < 0) { t = 0; s = clamp(-c / a); } else if (t > 1) { t = 1; s = clamp((b - c) / a); }
  var c1 = add(p1, mul(d1, s)), c2 = add(p2, mul(d2, t));
  return [Math.sqrt(dot(sub(c1, c2), sub(c1, c2))), c1, c2];
}
function sub(a, b){ return [a[0]-b[0], a[1]-b[1], a[2]-b[2]]; } function add(a, b){ return [a[0]+b[0], a[1]+b[1], a[2]+b[2]]; }
function mul(a, k){ return [a[0]*k, a[1]*k, a[2]*k]; } function dot(a, b){ return a[0]*b[0] + a[1]*b[1] + a[2]*b[2]; }
function clamp(x){ return x < 0 ? 0 : x > 1 ? 1 : x; }
function visibleNow(s){ return s.group.visible && Math.abs(s.x) < halfWidthAt(s.z) + 200 * s.scale; }

function avoidance(dt){
  for (var i = 0; i < all.length; i++) { all[i].avTurn = 0; all[i].avLift = 0; all[i].avSlow = 0; }
  for (i = 0; i < all.length; i++) for (var j = i + 1; j < all.length; j++) {
    var A = all[i], B = all[j];
    if (A.mode === 'away' || B.mode === 'away') continue;
    if (A.leader === B || B.leader === A || (A.leader && A.leader === B.leader)) { // schoolmates: just keep a little spacing
      var dx0 = A.x - B.x, dy0 = A.y - B.y, dz0 = A.z - B.z, dd = Math.sqrt(dx0*dx0 + dy0*dy0 + dz0*dz0) || 1, want = 52;
      if (dd < want){ var k0 = (want - dd) * Math.min(1, dt * 3) / dd * .5; A.x += dx0 * k0; A.y += dy0 * k0; A.z += dz0 * k0; B.x -= dx0 * k0; B.y -= dy0 * k0; B.z -= dz0 * k0; }
      continue;
    }
    var ex = A.x - B.x, ey = A.y - B.y, ez = A.z - B.z, reach = 260 * (A.scale + B.scale) + 120;
    if (ex*ex + ey*ey + ez*ez > reach * reach) continue;
    var R = A.def.radius * A.scale + B.def.radius * B.scale;
    var fa = axis(A, .9), fb = axis(B, .9), fut = segDist(fa.a, fa.b, fb.a, fb.b);
    var na = axis(A, 0), nb = axis(B, 0), now = segDist(na.a, na.b, nb.a, nb.b);
    var d = Math.min(fut[0], now[0]);
    if (d > R * 1.25) continue;
    var w = Math.min(1, (R * 1.25 - d) / R), pa = fut[0] < now[0] ? fut[1] : now[1], pb = fut[0] < now[0] ? fut[2] : now[2];
    var n = sub(pa, pb), len = Math.sqrt(dot(n, n)) || 1; n = mul(n, 1 / len);
    if (len < 1) n = [0, A.y >= B.y ? 1 : -1, 0];
    var up = (n[1] >= 0 ? 1 : -1) * Math.max(.6, Math.abs(n[1]));
    A.avLift += up * w; B.avLift -= up * w;
    var sideA = na.dir[0] * (-n[2]) - na.dir[2] * (-n[0]), sideB = nb.dir[0] * n[2] - nb.dir[2] * n[0];
    A.avTurn += (sideA > 0 ? -1 : 1) * w * .5; B.avTurn += (sideB > 0 ? -1 : 1) * w * .5;
    var aBehind = dot(na.dir, sub(nb.c, na.c)) > 0, slow = aBehind ? A : B;
    slow.avSlow = Math.max(slow.avSlow, w * .45);
    if (now[0] < R * .8) {
      var push = (R * .8 - now[0]) * Math.min(1, dt * 4), nn = sub(now[1], now[2]), l2 = Math.sqrt(dot(nn, nn)) || 1; nn = mul(nn, 1 / l2);
      if (l2 < 1) nn = [0, 1, 0];
      var ma = A.def.upright ? .3 : .5, mb = B.def.upright ? .3 : .5;   // floaters drift less
      A.x += nn[0] * push * ma; A.y += nn[1] * push * ma; A.z += nn[2] * push * ma;
      B.x -= nn[0] * push * mb; B.y -= nn[1] * push * mb; B.z -= nn[2] * push * mb;
    }
  }
}

function steerSwimmer(s, dt){
  var Z = zone(s);
  if (s.mode === 'away'){ s.awayT -= dt; if (s.awayT <= 0) comeBack(s); else return; }
  if (s.leader){                                   // school fish: follow the leader's spot in the school
    var L = s.leader;
    if (L.mode === 'away'){ if (Math.abs(s.x) > halfWidthAt(s.z) + 200){ s.mode = 'away'; s.group.visible = false; return; } }
    else if (s.mode === 'away') return;
    var ch = Math.cos(L.heading), sh = Math.sin(L.heading);
    s.tx = L.x + s.off[0] * ch - s.off[2] * sh; s.tz = L.z - s.off[0] * sh - s.off[2] * ch; s.ty = L.y + s.off[1];
    if (L.mode === 'away'){ s.tx = s.x + Math.cos(s.heading) * 400; s.tz = s.z; }
  } else {
    var dx = s.tx - s.x, dz = s.tz - s.z;
    if (s.mode === 'leave' && Math.abs(s.x) > halfWidthAt(s.z) + 240 * s.scale){ s.mode = 'away'; s.awayT = rand(3, 9); s.group.visible = false; return; }
    if (s.mode === 'enter' && Math.abs(s.x) < halfWidthAt(s.z) * .7) newTarget(s);
    if (s.mode !== 'leave' && dx*dx + dz*dz < 120*120){ if (!maybeLeave(s)) newTarget(s); }
  }
  var want = Math.atan2(-(s.tz - s.z), s.tx - s.x), diff = want - s.heading;
  while (diff > Math.PI) diff -= 2*Math.PI; while (diff < -Math.PI) diff += 2*Math.PI;
  var maxTurn = s.def.turn * (s.leader ? 1.6 : 1);
  var turn = Math.max(-maxTurn, Math.min(maxTurn, diff * 1.1 + (s.avTurn || 0) * .9));
  s.heading += turn * dt;
  s.bank += ((-turn * .9) - s.bank) * Math.min(1, dt * 2);
  var climb = Math.max(-.25, Math.min(.25, (s.ty - s.y) / 400 + (s.avLift || 0) * .45));
  s.pitch += (Math.max(-.35, Math.min(.35, climb)) - s.pitch) * Math.min(1, dt * 2.2);
  var v = s.speed * (1 + Math.abs(turn) * .4) * (1 - (s.avSlow || 0));
  if (s.leader){ var gap = Math.hypot(s.tx - s.x, s.tz - s.z); v = s.leader.speed * (0.8 + Math.min(1.2, gap / 160)); }
  s.x += Math.cos(s.heading) * Math.cos(s.pitch) * v * dt; s.z -= Math.sin(s.heading) * Math.cos(s.pitch) * v * dt; s.y += Math.sin(s.pitch) * v * dt;
  s.y = Math.max(Z.y[0] - 30, Math.min(Z.y[1] + 20, s.y));
  s.group.position.set(s.x, s.y, s.z);
  s.group.rotation.set(s.bank, s.heading, s.pitch, 'YXZ');
  s.animate(dt, Math.abs(turn));
}

function floatUpright(s, dt, T){
  var Z = zone(s), hw = halfWidthAt(s.z) * .75;
  if (Math.abs(s.tx - s.x) < 30) s.tx = rand(-hw, hw);
  if (s.kind === 'jelly'){
    var p = Math.max(0, Math.sin(s.phase)); s.y += (p * p * 70 - 16) * dt;           // pulse up, sink slowly
    if (s.y > Z.y[1]) s.y -= 30 * dt; if (s.y < Z.y[0]) s.y += 40 * dt;
    s.x += Math.sign(s.tx - s.x) * 10 * dt; s.ry += dt * .18;
    s.group.rotation.set(Math.sin(T * .4 + s.seed) * .08, s.ry, Math.sin(T * .3 + s.seed) * .1);
  } else if (s.kind === 'seahorse'){
    var dir = Math.sign(s.tx - s.x) || 1; s.facing = dir;
    s.x += dir * 16 * dt; s.y = s.baseY + Math.sin(T * 1.1 + s.seed) * 9;
    var want = dir > 0 ? 0 : Math.PI; s.ry += (want - s.ry) * Math.min(1, dt * 1.2);     // turns around in 3D
    s.group.rotation.set(0, s.ry, Math.sin(T * .9 + s.seed) * .06);
  } else {                                                                            // octopus: drift low, now and then jet upward
    s.jet = (s.jet || rand(4, 9)) - dt;
    if (s.jet < 0){ s.vy = 95; s.jet = rand(6, 11); }
    s.vy = (s.vy || 0) * Math.pow(.35, dt); s.y += (s.vy - 10) * dt; if (s.y < Z.y[0]) s.y = Z.y[0];
    s.x += Math.sign(s.tx - s.x) * 14 * dt;
    s.group.rotation.set(0, Math.sin(T * .25 + s.seed) * .5, Math.sin(T * .5 + s.seed) * .05);
  }
  s.group.position.set(s.x, s.y, s.z);
  s.animate(dt, 0);
}

var T = 0;
function step(dt){
  avoidance(dt);
  all.forEach(function(s){ if (s.def.upright) floatUpright(s, dt, T); else steerSwimmer(s, dt); });
}
function draw(){
  bg.setTransform(DPR,0,0,DPR,0,0); scene2d(bg, W, H, T);
  renderer.render(scene, camera);
  fg.setTransform(DPR,0,0,DPR,0,0); fg.clearRect(0,0,W,H); scene2d.front(fg, W, H, T);
}
var last = performance.now(), auto = true;
function loop(now){ if (auto){ var dt = Math.min(.05, (now - last)/1000); T += dt; step(dt); draw(); } last = now; requestAnimationFrame(loop); }
requestAnimationFrame(loop);

/* ---- demo crayon coloring so the tank isn't empty ---- */
function demoSkin(cols, seed){
  var c = document.createElement('canvas'); c.width = 440; c.height = 300; var g = c.getContext('2d');
  g.fillStyle = '#fff'; g.fillRect(0,0,c.width,c.height); var r = seed;
  function rnd(){ r = (r * 16807) % 2147483647; return r / 2147483647; }
  for (var i = 0; i < 110; i++){ g.strokeStyle = cols[i % cols.length]; g.globalAlpha = .42; g.lineWidth = 6 + rnd()*6; g.beginPath();
    var y = (i % 36) / 36 * c.height + rnd()*8; g.moveTo(-10, y); for (var x = 0; x < c.width + 20; x += 22) g.lineTo(x, y + (rnd()-.5)*18); g.stroke(); }
  var im = new Image(); im.src = c.toDataURL(); return im;
}
// until each creature has its own sheet, other creatures use the colorful middle of a shark sheet
function cropToFill(img){
  var c = document.createElement('canvas'); c.width = 440; c.height = 300;
  c.getContext('2d').drawImage(img, img.width*.14, img.height*.3, img.width*.7, img.height*.45, 0, 0, 440, 300);
  var o = new Image(); o.src = c.toDataURL(); return o;
}
var MIX = ['shark','turtle','fish','fish','fish','jelly','shark','whale','seahorse','fish','fish','turtle','octopus','shark','jelly','fish'];
var palettes = [['#ff5a2b','#ffd92b'],['#2b6fff','#3ac25a'],['#c23bff','#ff6fb5'],['#ff8a2b','#2b6fff','#ffd92b'],['#3ac25a','#1fb5c9'],['#e8322f','#ff8a2b','#ffd92b','#3ac25a','#2b8cff']];
if (!/nodemo/.test(location.search)) MIX.forEach(function(k, i){ addCreature(k, demoSkin(palettes[i % palettes.length], 11 + i * 37)); });

/* ---- pick a creature, then add sheet photos ---- */
var chosen = 'shark', kindsEl = document.getElementById('kinds');
['shark','turtle','whale','fish','jelly','seahorse','octopus'].forEach(function(k){
  var b = document.createElement('button'); b.className = 'chip'; b.textContent = DEFS[k].label; b.setAttribute('aria-pressed', String(k === chosen));
  b.onclick = function(){ chosen = k; kindsEl.querySelectorAll('.chip').forEach(function(x){ x.setAttribute('aria-pressed', String(x === b)); }); };
  kindsEl.appendChild(b);
});
document.getElementById('file').addEventListener('change', function(e){
  Array.prototype.forEach.call(e.target.files, function(f){
    var url = URL.createObjectURL(f), im = new Image();
    im.onload = function(){ var r = C.scanSheet(im); URL.revokeObjectURL(url);
      if (!r.ok){ toast(C.reasonText(r.reason)); return; }
      var s = new Image(); s.onload = function(){ addCreature(chosen, chosen === 'shark' ? s : cropToFill(s)); }; s.src = r.dataUrl; };
    im.src = url;
  });
  e.target.value = '';
});
function toast(m){ var t = document.getElementById('toast'); t.textContent = m; t.hidden = false; clearTimeout(t._t); t._t = setTimeout(function(){ t.hidden = true; }, 3200); }

// hooks for recording a clip and testing
function overlaps(){
  var c = 0;
  for (var i = 0; i < all.length; i++) for (var j = i + 1; j < all.length; j++) {
    var A = all[i], B = all[j];
    if (!visibleNow(A) || !visibleNow(B) || A.mode === 'away' || B.mode === 'away') continue;
    if (A.leader === B || B.leader === A || (A.leader && A.leader === B.leader)) continue;
    var a = axis(A, 0), b = axis(B, 0), d = segDist(a.a, a.b, b.a, b.b)[0];
    if (d < .33 * (A.def.radius * A.scale + B.def.radius * B.scale)) c++;
  }
  return c;
}
window.__proto = {
  add: function(kind, src, fill){ var im = new Image(); im.src = src; return new Promise(function(r){ im.onload = function(){ addCreature(kind, fill ? cropToFill(im) : im); r(); }; }); },
  manual: function(){ auto = false; },
  tick: function(dt){ T += dt; step(dt); draw(); },
  measure: function(seconds){ var hit = 0, steps = Math.round(seconds * 30); for (var k = 0; k < steps; k++){ T += 1/30; step(1/30); if (overlaps()) hit++; } return { frames: steps, framesWithOverlap: hit }; },
  warm: function(seconds){ for (var k = 0; k < Math.round(seconds * 30); k++){ T += 1/30; step(1/30); } },
  count: function(){ var o = {}; all.forEach(function(s){ o[s.kind] = (o[s.kind] || 0) + 1; }); return o; }
};
})();
</script>
